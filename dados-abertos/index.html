<!DOCTYPE html>
<!-- ARQUIVO: dados_abertos.html — página PÚBLICA (sem login), publicada em dados-abertos/ (scripts/build_frontend.js).
     Hoje é só o aviso "Em desenvolvimento"; não carrega o sistema nem chama o servidor. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dados abertos — Samaúma</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- ARQUIVO: styles_design_system.html -->
<!-- ============================================================================
     DESIGN SYSTEM SAMAÚMA — Fundação de tokens + utilitários (camada ADITIVA)
     ----------------------------------------------------------------------------
     • Arquivo de estilo único do sistema. Seção "BASE" (logo abaixo): reset,
       layout de body/main e classes globais (.btn, .card, tabelas, .badge…);
       depois tokens --ds-* e componentes .ds-*.
     • UI nova (vidro + sidebar, claro/escuro): tokens portados de
       "Design system com sidebar expansível/tokens". Tema escuro via
       [data-ds-theme="dark"] no <html>; alto contraste (body.high-contrast)
       sempre prevalece sobre o escuro.
     • Uma fonte de estilo: componente só existe aqui, com UMA classe; token só
       existe aqui, com UM nome por papel (docs/design_system.md, "DIRETRIZ — Uma
       fonte de estilo"). Raio: escala única --ds-r-* (xs 2px … 2xl 14px, pill).
     • Documentação completa (regras, uso, conformidade ISO/IEC 9126 e 25010):
       docs/design_system.md
     • Exceção deliberada: baseline global de :focus-visible e prefers-reduced-motion
       (ganho de acessibilidade; não afeta o usuário de mouse).
     ============================================================================ -->
<style>
/* ===================== BASE =====================
   Reset, layout de body/main e as classes globais mais antigas (.btn, .card, tabelas…).
   Cada seletor tem UMA regra neste arquivo (variações de tema à parte). */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; }

/* --ds-sb-w = largura ocupada pela sidebar (empurra body e topbar). No mobile (<=768px) a sidebar
   vira drawer sobreposto e não ocupa espaço. */
html { --ds-sb-w: var(--ds-sidebar-width); }
html.ds-sb-collapsed { --ds-sb-w: var(--ds-sidebar-width-collapsed); }
@media (max-width: 768px) { html, html.ds-sb-collapsed { --ds-sb-w: 0px; } }
@supports (height: 100dvh) { body { height: 100dvh; } }   /* altura visível no celular (a barra do navegador não cobre o fim); o body tem 100vh de reserva */

/* body = altura travada na viewport; quem rola é o <main> — ver docs/design_system.md
   "Área de conteúdo com altura travada (estilo Google Drive)". Sem seleção acidental de texto.
   overflow-x: clip (não hidden) corta estouro lateral SEM criar contêiner de scroll (sticky continua funcionando). */
body {
  padding-left: var(--ds-sb-w);
  background: var(--ds-app-bg);
  background-attachment: fixed;
  color: var(--ds-color-text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: hidden;
  overflow-x: clip;
  transition: padding-left var(--ds-duration-slow) var(--ds-ease-standard);
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
input,
textarea,
[contenteditable="true"],
[contenteditable=""],
pre,
code,
.selectable,
.user-select-text {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}
img { -webkit-user-drag: none; user-select: none; }

.hidden { display: none !important; }
.btn { padding: 8px 16px; border-radius: var(--ds-r-sm); border: none; cursor: pointer; font-weight: 500; font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background-color: var(--ds-color-action); color: var(--ds-color-on-action); box-shadow: var(--ds-shadow-2); }
.btn-primary:hover { background-color: var(--ds-color-action-hover); box-shadow: var(--ds-shadow-2); }
.icon { font-size: 20px; }

/* <main>: painel de altura fixa com scroll próprio, fundo = superfície; respiro --ds-main-pad-y/-x (12px nas laterais no mobile). */
main { flex: 1; min-height: 0; padding: var(--ds-main-pad-y) var(--ds-main-pad-x); width: 100%; margin-top: var(--ds-header-height); overflow-y: auto; background: var(--ds-color-surface); }

/* ---- Página (.ds-pagina): o layout de toda tela — hero → [ações] → [faixa de abas] → [filtros] → conteúdo ----
   Quem rola é o <main>. O título rola e some; as ações (.ds-pagina__acoes), a faixa de abas (.ds-pagina__faixa) e os filtros
   (.ds-pagina__filtros) param, empilhados, no topo de <main>, e o cabeçalho da tabela para logo abaixo (top: var(--ds-pagina-topo-tabela)).
   Alturas e a largura das ações são medidas por uiPaginaMedir(pagina) (app_ui_utils.html) — o conteúdo dessas barras muda de altura
   (filtro vira chip, barra de seleção). Ações IRMÃS do hero (página com faixa de abas) ficam sobre a linha do título (margem negativa)
   e, ao rolar, sobre a ponta direita da faixa, que reserva a largura delas; ações DENTRO do hero rolam com ele. No mobile nada fica
   fixo e as ações vão para baixo do título. Página montada por script: o .ds-pagina é o contêiner que o script preenche. */
.ds-pagina {
  --ds-pagina-espaco: 20px;
  --ds-pagina-topo: calc(-1 * var(--ds-main-pad-y));   /* o sticky conta da borda do padding de <main>: assim encosta na barra do topo */
  --ds-pagina-faixa-h: 44px;
  --ds-pagina-filtros-h: 0px;
  --ds-pagina-filtros-pad: var(--ds-space-2-5);   /* respiro acima e abaixo da barra de filtros */
  --ds-pagina-filtros-linha: 44px;   /* altura da linha da barra de filtros (busca, pílulas ou seleção) no celular */
  --ds-pagina-lista-cab: 36px;   /* altura do cabeçalho da lista no celular (ordenação ou rótulo + ferramentas) */
  --ds-pagina-acoes-w: 0px;
  --ds-pagina-topo-tabela: calc(var(--ds-pagina-topo) + var(--ds-pagina-faixa-h) + var(--ds-pagina-filtros-h));
}
.ds-pagina > * { margin-bottom: var(--ds-pagina-espaco); }
.ds-pagina > *:last-child { margin-bottom: 0; }
.ds-pagina__hero {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px;
  min-height: var(--ds-pagina-faixa-h); padding-right: var(--ds-pagina-acoes-w);
}
.ds-pagina__titulo-linha { display: flex; align-items: center; flex-wrap: nowrap; gap: 12px; min-width: 0; max-width: 100%; }
.ds-pagina__titulo-linha > :not(.ds-pagina__titulo) { flex: none; }
.ds-pagina__titulo {
  margin: 0; font-size: var(--ds-text-titulo-pagina); line-height: 1.15; letter-spacing: -0.8px; font-weight: var(--ds-weight-bold);
  color: var(--ds-color-text); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ds-pagina__acoes {
  position: sticky; top: var(--ds-pagina-topo); z-index: 43;
  width: max-content; margin-left: auto;
  margin-top: calc(-1 * (var(--ds-pagina-faixa-h) + var(--ds-pagina-espaco)));
  height: calc(var(--ds-pagina-faixa-h) - 1px);   /* -1px: não cobre a linha base da faixa de abas quando grudadas */
  display: flex; align-items: center; gap: 8px; padding-left: 12px;
  background: var(--ds-color-surface);
}
/* Ações DENTRO do hero (página sem faixa de abas a cobrir): rolam com o título, à direita dele */
.ds-pagina__hero > .ds-pagina__acoes { position: static; margin: 0 0 0 auto; height: auto; padding-left: 0; background: none; }
.ds-pagina__faixa { position: sticky; top: var(--ds-pagina-topo); z-index: 42; padding-right: var(--ds-pagina-acoes-w); }
.ds-pagina__filtros {
  position: sticky; top: calc(var(--ds-pagina-topo) + var(--ds-pagina-faixa-h)); z-index: 41;
  background: var(--ds-color-surface);
}
@media (max-width: 768px) {
  .ds-pagina__hero { flex-direction: column; align-items: stretch; min-height: 0; padding-right: 0; }
  .ds-pagina__titulo-linha { display: none; }   /* no mobile o título (e o voltar) moram na barra do topo, no lugar da trilha */
  .ds-pagina__acoes { position: static; width: 100%; height: auto; margin-top: 0; padding-left: 0; justify-content: flex-end; background: none; }
  .ds-pagina__faixa { position: static; padding-right: 0; }
  /* busca e filtros grudam no alto da área rolável (padrão Gmail); top: 0 anula o deslocamento do desktop */
  .ds-pagina__filtros { top: calc(-1 * var(--ds-main-pad-y)); }   /* o sticky para no padding da área rolável: compensa para colar no topo */
  /* hero sem nada além do título (que no mobile mora na barra do topo) não ocupa espaço */
  .ds-pagina__hero:not(:has(> :not(.ds-pagina__titulo-linha):not(.hidden))) { display: none; }
  .ds-pagina:has(> .ds-pagina__hero:not(:has(> :not(.ds-pagina__titulo-linha):not(.hidden)))) .ds-pagina__filtros { margin-top: var(--ds-pagina-topo); }   /* regra única: hero vazio → a barra de filtros (irmã do hero ou dentro da área de conteúdo) cola no topo */
}

.card { background: var(--ds-glass-bg-strong); border: 1px solid var(--ds-glass-border); border-radius: var(--ds-r-2xl); box-shadow: var(--ds-glass-shadow); padding: 20px; margin-bottom: 20px; }

.table-container { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { text-align: left; padding: 12px; border-bottom: 2px solid var(--ds-color-border); color: var(--ds-color-text-muted); font-size: 0.85rem; text-transform: uppercase; }
td { padding: 12px; border-bottom: 1px solid var(--ds-glass-border); font-size: 0.9rem; vertical-align: middle; }
tr:hover td { background-color: var(--ds-sidebar-item-hover); }

.badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }

.pagination { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 15px; }
.pagination button { background: var(--ds-glass-bg-strong); border: 1px solid var(--ds-glass-border); padding: 5px 10px; border-radius: var(--ds-r-md); color: var(--ds-color-text); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Spinner padrão de carregamento de listas (usar em todas as listas do sistema) */
.lista-spinner-wrap {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 36px 16px;
  color: var(--ds-color-text-muted); font-size: 0.85rem;
}
.lista-spinner {
  width: 32px; height: 32px; border-radius: 50%;
  border: 3px solid var(--ds-color-border);
  border-top-color: var(--ds-color-action);
  animation: lista-spin 0.8s linear infinite;
}
@keyframes lista-spin { to { transform: rotate(360deg); } }

/* Overlay que cobre um app instalável enquanto o plano é trocado (limparTelaDetalhes/
   _appsRenderizarAbas em pages_plano_detalhe.html) */
.view-section[data-app-tab="1"] { position: relative; }
.app-tab-cobrir-anterior {
  position: absolute; inset: 0; z-index: 5;
  background: var(--ds-color-surface);
  display: flex; align-items: center; justify-content: center;
}

/* Modal multietapas: viewport rolável + etapas (.wizard-step data-step="N", alterna .hidden)
   com slide ao avançar/voltar. Usado por components_modal_plano.html e pelos apps
   Elementos/Indicadores/Riscos (cada um ajusta o espaçamento no próprio arquivo). */
.wizard-msg-vazio {
  display: flex; align-items: center; gap: 10px; background: var(--ds-color-surface-2);
  border: 1px dashed var(--ds-color-border); border-radius: 8px; padding: 16px;
  color: var(--ds-color-text-muted); font-size: 0.85rem;
}
.wizard-msg-vazio .material-symbols-outlined { font-size: 22px; flex-shrink: 0; }
.wizard-steps-viewport { position: relative; overflow-y: auto; padding: 0 20px 20px; flex: 1; min-height: 0; }
.wizard-step { transition: transform 200ms ease, opacity 200ms ease; }
.wizard-step.wizard-slide-out-left  { transform: translateX(-24px); opacity: 0; }
.wizard-step.wizard-slide-out-right { transform: translateX(24px);  opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .wizard-step { transition: none !important; }
}

/* ===================== TOKENS (tema padrão) ===================== */
:root {
  /* -- Marca: rampa PRIMARY (navy institucional, base 700 = #0c326f) -- */
  --ds-primary-50:  #eef2f8;
  --ds-primary-100: #d3ddee;
  --ds-primary-200: #a6bbdd;
  --ds-primary-300: #7999cc;
  --ds-primary-400: #4c77bb;
  --ds-primary-500: #1a56a8;
  --ds-primary-600: #123f87;
  --ds-primary-700: #0c326f;
  --ds-primary-800: #092656;
  --ds-primary-900: #051a3a;

  /* -- Marca: rampa ACTION (azul de ação, base 500 = #2670e8) -- */
  --ds-action-50:  #eaf1fd;
  --ds-action-100: #cfe0fb;
  --ds-action-200: #a6c4f7;
  --ds-action-300: #6fa1f1;
  --ds-action-400: #4986ec;
  --ds-action-500: #2670e8;
  --ds-action-600: #1a5bb8;
  --ds-action-700: #164a97;
  --ds-action-800: #123c7a;
  --ds-action-900: #0d2c5a;

  /* -- Acento (âmbar) -- */
  --ds-accent:        #fbbc04;
  --ds-accent-strong: #f29900;
  --ds-accent-bg:     #fef7e0;
  /* Acento secundário — teal (mesma luminosidade/chroma do azul de ação, hue diferente) */
  --ds-accent-teal:        oklch(58% 0.11 200);
  --ds-accent-teal-strong: oklch(48% 0.11 200);

  /* -- Semânticos: superfícies e texto -- */
  --ds-color-bg:          #e9edf5;
  --ds-color-surface:     #ffffff;
  --ds-color-surface-2:   #f3f5f9;
  --ds-color-text:        #1b2430;
  --ds-color-text-muted:  #5b6472;
  --ds-color-border:      #d7dee8;
  --ds-color-border-strong: #bcc6d4;
  --ds-color-heading:     var(--ds-primary-700);  /* títulos/marca; clareia no tema escuro */
  --ds-risk-alto-bg: #fff3e0; --ds-risk-alto-fg: #bf360c;  /* nível de risco Alto (laranja) */

  /* -- Semânticos: ação e feedback -- */
  --ds-color-action:        #2670e8;
  --ds-color-action-hover:  #1a5bb8;
  --ds-color-on-action:     #ffffff;
  --ds-color-success: #1e8e3e; --ds-color-success-bg: #e6f4ea; --ds-color-success-fg: #137333;
  --ds-color-warning: #f9ab00; --ds-color-warning-bg: #fff8e1; --ds-color-warning-fg: #b06000;
  --ds-color-danger:  #d93025; --ds-color-danger-bg:  #fce8e6; --ds-color-danger-fg:  #c5221f;
  --ds-color-info:    #1967d2; --ds-color-info-bg:    #e8f0fe; --ds-color-info-fg:    #1967d2;
  --ds-color-pending: #7b2cbf;
  --ds-color-relacao: #ad1457;  /* relacionamento entre elementos (badge hub + linhas do organograma) */
  --ds-color-indicador: #8e44ad;  /* ícone de indicador (speed), em qualquer tela */
  --ds-color-elemento: #00796b;  /* ícone de elemento (category), em qualquer tela */
  --ds-color-notificacao: var(--ds-color-danger-fg);  /* indicador de não lido/novo (sino, aba do Fórum…): fundo do badge e do ponto */
  --ds-color-on-notificacao: #ffffff;  /* texto sobre --ds-color-notificacao */

  /* -- Status de plano (FONTE ÚNICA — substitui as ~5 cópias divergentes) -- */
  --ds-status-elaboracao-bg: #fff8e1; --ds-status-elaboracao-fg: #b06000;
  --ds-status-analise-bg:    #e8f0fe; --ds-status-analise-fg:    #1967d2;
  --ds-status-execucao-bg:   #e6f4ea; --ds-status-execucao-fg:   #137333;
  --ds-status-avaliacao-bg:  #fef7e0; --ds-status-avaliacao-fg:  #a56300;
  --ds-status-prorrogado-bg: #e6f4ea; --ds-status-prorrogado-fg: #0b8043;
  --ds-status-revisao-bg:    #f3e8fd; --ds-status-revisao-fg:    #8430ce;
  --ds-status-finalizado-bg: #e8eaed; --ds-status-finalizado-fg: #3c4043;
  --ds-status-cancelado-bg:  #fce8e6; --ds-status-cancelado-fg:  #c5221f;

  /* -- Espaçamento (ritmo de 4px) -- */
  --ds-space-0:   0;
  --ds-space-0-5: 2px;
  --ds-space-1:   4px;
  --ds-space-1-5: 6px;
  --ds-space-2:   8px;
  --ds-space-2-5: 10px;
  --ds-space-3:   12px;
  --ds-space-4:   16px;
  --ds-space-5:   20px;
  --ds-space-6:   24px;
  --ds-space-8:   32px;
  --ds-space-10:  40px;
  --ds-space-12:  48px;

  /* -- Elevação (sombras suaves) -- */
  --ds-shadow-1: 0 1px 2px rgba(16,38,73,0.06);
  --ds-shadow-2: 0 2px 8px rgba(16,38,73,0.08);
  --ds-shadow-3: 0 6px 18px rgba(16,38,73,0.12);
  --ds-shadow-4: 0 16px 40px rgba(16,38,73,0.2);

  /* -- Tipografia (mantém Roboto já carregado; sem novo webfont) -- */
  --ds-font-sans: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ds-text-xs:   0.75rem;    /* 12px */
  --ds-text-sm:   0.8125rem;  /* 13px */
  --ds-text-base: 0.875rem;   /* 14px — corpo padrão */
  --ds-text-md:   1rem;       /* 16px */
  --ds-text-lg:   1.125rem;   /* 18px */
  --ds-text-xl:   1.375rem;   /* 22px */
  --ds-text-2xl:  1.75rem;    /* 28px */
  --ds-text-3xl:  2.25rem;    /* 36px */
  --ds-weight-regular:  400;
  --ds-weight-medium:   500;
  --ds-weight-semibold: 600;
  --ds-weight-bold:     700;
  --ds-leading-tight:  1.2;
  --ds-leading-normal: 1.5;

  /* -- Movimento -- */
  --ds-duration-fast: 120ms;
  --ds-duration-base: 200ms;
  --ds-duration-slow: 320ms;
  --ds-ease-standard:  cubic-bezier(.4, 0, .2, 1);
  --ds-ease-emphasized: cubic-bezier(.2, 0, 0, 1);

  /* -- Z-index (escala nomeada) -- */
  --ds-z-base:     1;
  --ds-z-sticky:   40;
  --ds-z-sidebar:  90;
  --ds-z-header:   100;
  --ds-z-drawer:   500;
  --ds-z-fab:      900;
  --ds-z-dropdown: 1000;
  --ds-z-modal:    1100;
  --ds-z-toast:    1200;
  --ds-z-tooltip:  1300;
  --ds-z-tela-cheia: 2147482000; /* passo obrigatório antes do app (login, escolha de vínculo): cobre tudo */
  --ds-tela-fundo: none; /* imagem de fundo da tela cheia com imagem: url("…"), definida por script (hoje a foto da Reitoria; no futuro, a do admin) */

  /* -- Foco -- */
  --ds-focus-ring: rgba(38, 112, 232, .45);
  --ds-shadow-focus: 0 0 0 3px var(--ds-focus-ring);
  --ds-color-scrim: rgba(10,20,35,0.45); /* fundo escurecido atrás de modal */

  /* -- Raio (escala única) -- */
  --ds-r-xs: 2px; --ds-r-sm: 4px; --ds-r-md: 6px; --ds-r-lg: 8px; --ds-r-xl: 10px; --ds-r-2xl: 14px;
  --ds-r-pill: 999px;
  /* Espessura de borda: fina (contornos, divisórias), forte (base de abas, cabeçalho de tabela), destaque (faixa lateral, aba ativa) */
  --ds-borda: 1px; --ds-borda-forte: 2px; --ds-borda-destaque: 3px;
  /* Tamanho de ícone (Material Symbols): xs 14 · sm 15 · md 18 · lg 20 · xl 24 */
  --ds-icon-xs: 14px; --ds-icon-sm: 15px; --ds-icon-md: 18px; --ds-icon-lg: 20px; --ds-icon-xl: 24px;
  --ds-linha-altura: 60px;
  --ds-subtabela-cab-fonte: var(--ds-text-xs); --ds-subtabela-cab-altura: 32px; --ds-subtabela-linha-altura: 44px;
  /* Título de página (h1 do .ds-pagina): 30px; 26px no mobile */
  --ds-text-titulo-pagina: 1.875rem;

  /* -- Tipografia: peso extra (Roboto 800) -- */
  --ds-weight-black: 800;

  /* -- Layout / breakpoints (breakpoints são referência: var() não funciona em @media) -- */
  --ds-header-height: 60px;
  --ds-main-pad-y: 20px;      /* respiro de <main> em cima/embaixo */
  --ds-main-pad-x: 40px;      /* respiro de <main> nas laterais (12px no mobile) */
  --ds-sidebar-width: 264px;
  --ds-sidebar-width-collapsed: 76px;
  --ds-content-max: 1200px;
  --ds-bp-sm: 480px; --ds-bp-md: 768px; --ds-bp-lg: 1024px;

  /* -- Vidro refinado: translucidez discreta, borda fio de cabelo, sombra suave -- */
  --ds-glass-bg: rgba(255,255,255,0.74);
  --ds-glass-bg-strong: rgba(255,255,255,0.90);
  --ds-glass-border: rgba(16,38,73,0.08);
  --ds-glass-blur: 16px;
  --ds-glass-saturate: 1.3;
  --ds-glass-shadow: 0 1px 2px rgba(16,38,73,0.04), 0 10px 28px rgba(16,38,73,0.07);
  --ds-glass-shadow-strong: 0 2px 6px rgba(16,38,73,0.06), 0 22px 48px rgba(16,38,73,0.12);

  /* -- Ambiente: wash de cor por trás do vidro (é o que faz a translucidez aparecer) -- */
  --ds-app-bg: radial-gradient(1200px 600px at 8% -10%, #dbe7fb 0%, transparent 55%),
               radial-gradient(900px 500px at 100% 0%, #dff0f2 0%, transparent 50%),
               linear-gradient(180deg, #eef2f8 0%, #e8edf6 100%);

  /* -- Sidebar -- */
  --ds-sidebar-bg: rgba(255,255,255,0.78);
  --ds-sidebar-border: rgba(16,38,73,0.07);
  --ds-sidebar-item-hover: rgba(16,38,73,0.05);
  --ds-sidebar-item-active: rgba(38,112,232,0.12);
}
@media (max-width: 768px) {
  :root { --ds-main-pad-x: 12px; --ds-text-titulo-pagina: 1.625rem; }
}

/* ===================== TOKENS (tema escuro — "Aero noturno") =====================
   Ativado por <html data-ds-theme="dark"> (alternador no cabeçalho). */
[data-ds-theme="dark"] {
  color-scheme: dark;

  /* Base neutra = preto e variações de cinza (sem matiz azulado) — o navy usado antes
     aqui cansava a vista; cor de marca/ação continua azul, mas só como ACENTO, nunca
     como cor de fundo/superfície. */
  --ds-color-bg: #0a0a0a;
  --ds-color-surface: #161616;
  --ds-color-surface-2: #202020;
  --ds-color-text: #ededed;
  --ds-color-text-muted: #a3a3a3;
  --ds-color-border: #333333;
  --ds-color-border-strong: #474747;
  --ds-color-heading: #cfe0ff;
  /* Marca (navy) é ilegível como TEXTO/ÍCONE sobre fundo escuro (dezenas de usos): no escuro vira azul claro.
     Usos como FUNDO levam texto var(--ds-color-on-action) (.ds-btn--secondary, .bar-estratégico). */
  --ds-primary-700: #8ab4ff; --ds-primary-800: #a9c7ff;
  --ds-risk-alto-bg: #3a2410; --ds-risk-alto-fg: #ffab70;
  --ds-color-action: #5b9bff;
  --ds-color-action-hover: #82b3ff;
  --ds-color-indicador: #c9a2ff;
  --ds-color-elemento: #4db6ac;
  --ds-color-on-action: #06142b;
  --ds-focus-ring: rgba(130,179,255,.55);

  --ds-color-success: #4cc27a; --ds-color-success-bg: #12301f; --ds-color-success-fg: #6fda94;
  --ds-color-warning: #f0b429; --ds-color-warning-bg: #3a2c0d; --ds-color-warning-fg: #f0b429;
  --ds-color-danger:  #ff6b60; --ds-color-danger-bg:  #3a1614; --ds-color-danger-fg:  #ff8a80;
  --ds-color-info:    #8ab4ff; --ds-color-info-bg:    #10233f; --ds-color-info-fg:    #8ab4ff;
  --ds-color-pending: #c9a2ff;
  --ds-color-relacao: #f48fb1;

  --ds-status-elaboracao-bg: #3a2c0d; --ds-status-elaboracao-fg: #f0b429;
  --ds-status-analise-bg:    #10233f; --ds-status-analise-fg:    #8ab4ff;
  --ds-status-execucao-bg:   #12301f; --ds-status-execucao-fg:   #6fda94;
  --ds-status-avaliacao-bg:  #362a10; --ds-status-avaliacao-fg:  #f0c869;
  --ds-status-prorrogado-bg: #12301f; --ds-status-prorrogado-fg: #6fda94;
  --ds-status-revisao-bg:    #2a1f3d; --ds-status-revisao-fg:    #c99cf5;
  --ds-status-finalizado-bg: #222d3c; --ds-status-finalizado-fg: #b7c2d0;
  --ds-status-cancelado-bg:  #3a1614; --ds-status-cancelado-fg:  #ff8a80;

  --ds-shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --ds-shadow-2: 0 2px 8px rgba(0,0,0,.36);
  --ds-shadow-3: 0 6px 18px rgba(0,0,0,.42);
  --ds-shadow-4: 0 16px 40px rgba(0,0,0,.55);

  --ds-glass-bg: rgba(18,18,18,0.72);
  --ds-glass-bg-strong: rgba(22,22,22,0.92);
  --ds-glass-border: rgba(255,255,255,0.09);
  --ds-glass-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.38);
  --ds-glass-shadow-strong: 0 2px 6px rgba(0,0,0,0.4), 0 22px 48px rgba(0,0,0,0.5);

  /* Wash neutro (preto/cinza) por trás do vidro — antes tinha realces azul/teal */
  --ds-app-bg: radial-gradient(1100px 560px at 6% -8%, #1c1c1c 0%, transparent 55%),
               radial-gradient(900px 480px at 100% 0%, #141414 0%, transparent 50%),
               linear-gradient(180deg, #0a0a0a 0%, #000000 100%);

  --ds-sidebar-bg: rgba(14,14,14,0.78);
  --ds-sidebar-border: rgba(255,255,255,0.08);
  --ds-sidebar-item-hover: rgba(255,255,255,0.06);
  --ds-sidebar-item-active: rgba(91,155,255,0.18);

}

/* ===================== TOKENS (alto contraste) ===================== */
body.high-contrast {
  --ds-color-bg:          #000000;
  --ds-color-surface:     #121212;
  --ds-color-surface-2:   #1c1c1c;
  --ds-color-text:        #ffffff;
  --ds-color-text-muted:  #dddddd;
  --ds-color-border:      #ffffff;
  --ds-color-border-strong: #ffffff;

  --ds-color-action:        #00ffff;
  --ds-color-action-hover:  #66ffff;
  --ds-color-on-action:     #000000;
  --ds-color-indicador:     #d6b8ff;
  --ds-color-elemento:      #66ffcc;


  /* Marca (navy): sem contraste suficiente em fundo preto — amarelo do tema original. */
  --ds-primary-700: #ffff00;
  --ds-primary-800: #cccc00;
  --ds-color-success: #00ff00; --ds-color-success-bg: #001a00; --ds-color-success-fg: #00ff00;
  --ds-color-warning: #ffcc00; --ds-color-warning-bg: #1a1400; --ds-color-warning-fg: #ffcc00;
  --ds-color-danger:  #ff5555; --ds-color-danger-bg:  #1a0000; --ds-color-danger-fg:  #ff8080;
  --ds-color-info:    #00ffff; --ds-color-info-bg:    #001a1a; --ds-color-info-fg:    #00ffff;
  --ds-color-pending: #d6b8ff;
  --ds-color-relacao: #ff80d5;

  --ds-status-elaboracao-bg: #000; --ds-status-elaboracao-fg: #ffcc00;
  --ds-status-analise-bg:    #000; --ds-status-analise-fg:    #66ccff;
  --ds-status-execucao-bg:   #000; --ds-status-execucao-fg:   #00ff00;
  --ds-status-avaliacao-bg:  #000; --ds-status-avaliacao-fg:  #ffcc00;
  --ds-status-prorrogado-bg: #000; --ds-status-prorrogado-fg: #00ff00;
  --ds-status-revisao-bg:    #000; --ds-status-revisao-fg:    #d090ff;
  --ds-status-finalizado-bg: #000; --ds-status-finalizado-fg: #ffffff;
  --ds-status-cancelado-bg:  #000; --ds-status-cancelado-fg:  #ff8080;

  --ds-focus-ring: #00ffff;
  --ds-color-heading: #ffff00;
  --ds-risk-alto-bg: #000; --ds-risk-alto-fg: #ffa040;

  /* Sem translucidez/degradê em alto contraste: superfícies sólidas, bordas nítidas */
  --ds-glass-bg: #121212; --ds-glass-bg-strong: #121212;
  --ds-glass-border: #ffffff; --ds-glass-blur: 0px; --ds-glass-saturate: 1;
  --ds-glass-shadow: none; --ds-glass-shadow-strong: none;
  --ds-app-bg: #000000;
  --ds-sidebar-bg: #000000; --ds-sidebar-border: #ffffff;
  --ds-sidebar-item-hover: #333333; --ds-sidebar-item-active: #333300;
}

/* ===================== BASELINE GLOBAL DE ACESSIBILIDADE =====================
   As DUAS únicas regras que atuam fora do prefixo .ds-*. Ambas melhoram a
   acessibilidade (ISO/IEC 25010) sem afetar a aparência para usuário de mouse. */

/* Foco de teclado visível onde hoje não há. :where() tem especificidade 0, então
   NÃO vence estilos de aparência existentes; só adiciona o anel no foco por teclado. */
:where(a, button, [role="button"], input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--ds-color-action);
  outline-offset: 2px;
  border-radius: 2px;
}

/* Respeita "reduzir movimento" do sistema operacional. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===================== UTILITÁRIOS / COMPONENTES .ds-* (opt-in) ===================== */

/* ---- Superfícies ---- */
/* Vidro refinado: translucidez discreta + blur; sem brilho falso nem borda grossa */
.ds-glass {
  background: var(--ds-glass-bg);
  -webkit-backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  border: 1px solid var(--ds-glass-border);
  box-shadow: var(--ds-glass-shadow);
}
.ds-glass--strong { background: var(--ds-glass-bg-strong); box-shadow: var(--ds-glass-shadow-strong); }

/* Cartão de vidro; --flat = sólido, para áreas densas */
.ds-card {
  background: var(--ds-glass-bg);
  -webkit-backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  border: 1px solid var(--ds-glass-border);
  border-radius: var(--ds-r-2xl);
  box-shadow: var(--ds-glass-shadow);
  padding: var(--ds-space-5);
}
.ds-card--flat { background: var(--ds-color-surface); border-color: var(--ds-color-border); box-shadow: var(--ds-shadow-2); -webkit-backdrop-filter: none; backdrop-filter: none; }
.ds-card--pad-sm { padding: var(--ds-space-4); }
.ds-card--interactive {
  cursor: pointer;
  transition: box-shadow var(--ds-duration-base) var(--ds-ease-standard),
              transform var(--ds-duration-base) var(--ds-ease-standard);
}
.ds-card--interactive:hover { box-shadow: var(--ds-glass-shadow-strong); transform: translateY(-1px); }
.ds-card--interactive:active { transform: translateY(0); }

.ds-section-title {
  display: flex; align-items: center; gap: var(--ds-space-2);
  font-size: var(--ds-text-md); font-weight: var(--ds-weight-semibold);
  color: var(--ds-color-text); margin-bottom: var(--ds-space-3);
}
.ds-section-title .material-symbols-outlined { font-size: 20px; color: var(--ds-color-action); }

/* ---- Botões ---- */
.ds-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-2);
  min-height: 40px; padding: 0 var(--ds-space-4);
  font-family: var(--ds-font-sans); font-size: var(--ds-text-base); font-weight: var(--ds-weight-medium);
  line-height: 1; border: 1px solid transparent; border-radius: var(--ds-r-sm);
  background: var(--ds-color-surface); color: var(--ds-color-text);
  cursor: pointer; white-space: nowrap;
  transition: background var(--ds-duration-fast) var(--ds-ease-standard),
              box-shadow var(--ds-duration-fast) var(--ds-ease-standard),
              border-color var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-btn .material-symbols-outlined { font-size: 20px; }
.ds-btn:disabled, .ds-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; pointer-events: none; }
/* Recurso ainda não disponível: sem ação, tooltip "Em breve" (data-title). Não usa pointer-events:none para o tooltip aparecer. */
.ds-icon-action[aria-disabled="true"], .el-th-btn[aria-disabled="true"], .det-tb-btn[aria-disabled="true"], .dropdown-item[aria-disabled="true"], .acoes-btn[aria-disabled="true"], .acoes-menu-item[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.ds-btn:focus-visible { outline: none; box-shadow: var(--ds-shadow-focus); }
.ds-btn:active:not(:disabled) { transform: translateY(1px); }

.ds-btn--primary { background: var(--ds-color-action); color: var(--ds-color-on-action); box-shadow: var(--ds-shadow-2); }
.ds-btn--primary:hover { background: var(--ds-color-action-hover); box-shadow: var(--ds-shadow-2); }
.ds-btn--secondary { background: var(--ds-primary-700); color: var(--ds-color-on-action); }
.ds-btn--secondary:hover { background: var(--ds-primary-800); box-shadow: var(--ds-shadow-2); }
.ds-btn--ghost { background: transparent; border-color: transparent; color: var(--ds-color-text-muted); }
.ds-btn--ghost:hover { background: var(--ds-sidebar-item-hover); color: var(--ds-color-text); border-color: transparent; }
.ds-btn--danger { background: transparent; border-color: var(--ds-color-danger-fg); color: var(--ds-color-danger-fg); }
.ds-btn--danger:hover { background: var(--ds-color-danger-bg); box-shadow: none; }
.ds-btn--sm { min-height: 32px; padding: 0 var(--ds-space-3); font-size: var(--ds-text-sm); }
.ds-btn--lg { min-height: 48px; padding: 0 var(--ds-space-5); font-size: var(--ds-text-md); }
.ds-btn--icon { min-height: 40px; width: 40px; padding: 0; }
.ds-btn--icon.ds-btn--sm { min-height: 32px; width: 32px; }
.ds-btn--block { display: flex; width: 100%; }

/* ---- Tela cheia: passo obrigatório antes do app (entrada por código, escolha de vínculo) ---- */
.ds-tela-cheia {
  position: fixed; inset: 0; z-index: var(--ds-z-tela-cheia);
  display: flex; align-items: center; justify-content: center; padding: var(--ds-space-4);
  background: var(--ds-color-bg); color: var(--ds-color-text); font-family: var(--ds-font-sans);
}
.ds-tela-cheia__card {
  width: 100%; max-width: 420px; padding: 28px 24px;
  background: var(--ds-color-surface); border: 1px solid var(--ds-color-border);
  border-radius: var(--ds-r-2xl); box-shadow: var(--ds-shadow-3);
}
.ds-tela-cheia__titulo { margin-bottom: var(--ds-space-1); font-size: var(--ds-text-xl); font-weight: var(--ds-weight-bold); color: var(--ds-color-heading); }
.ds-tela-cheia__sub { margin-bottom: var(--ds-space-4); font-size: var(--ds-text-base); color: var(--ds-color-text-muted); }
.ds-tela-cheia__aviso:not(:empty) { margin-bottom: var(--ds-space-3); }
/* Tela cheia com imagem de fundo (--ds-tela-fundo): degradê da cor de fundo com um toque da cor de ação por cima da imagem; o cartão usa .ds-glass .ds-glass--cartao. */
.ds-tela-cheia--imagem {
  background:
    linear-gradient(155deg, color-mix(in srgb, var(--ds-color-bg) 82%, transparent) 0%, color-mix(in srgb, var(--ds-color-action) 24%, transparent) 52%, color-mix(in srgb, var(--ds-color-bg) 74%, transparent) 100%),
    var(--ds-tela-fundo) center / cover no-repeat,
    var(--ds-color-bg);
}

/* Cartão flutuante de vidro (tela de acesso, diálogos de confirmação): fundo translúcido, desfoque 1,5x e sombra forte; vem DEPOIS dos cartões que ele cobre, e os tokens --ds-glass-* o neutralizam no alto contraste. Uso: class="ds-glass ds-glass--cartao". */
.ds-glass--cartao {
  background: var(--ds-glass-bg); border-color: var(--ds-glass-border); box-shadow: var(--ds-glass-shadow-strong);
  -webkit-backdrop-filter: blur(calc(var(--ds-glass-blur) * 1.5)) saturate(var(--ds-glass-saturate));
  backdrop-filter: blur(calc(var(--ds-glass-blur) * 1.5)) saturate(var(--ds-glass-saturate));
}

/* Estado vazio (lista, painel, cartão ou modal sem itens): ícone esmaecido, título opcional, mensagem e ação opcional, centralizados. --compacto dentro de cartão, painel ou modal. */
.ds-vazio { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); padding: var(--ds-space-10) var(--ds-space-4); text-align: center; color: var(--ds-color-text-muted); }
.ds-vazio--compacto { padding: var(--ds-space-5) var(--ds-space-3); }
.ds-vazio__icone { font-size: var(--ds-text-3xl); opacity: 0.35; }
.ds-vazio__titulo { margin: 0; font-size: var(--ds-text-md); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-vazio__texto { margin: 0; max-width: 360px; font-size: var(--ds-text-base); }
.ds-vazio__acao { margin-top: var(--ds-space-2); }

/* ---- Tabela de lista (desktop: tabela com cabeçalho fixo sob as abas e filtros; ≤768 px: galeria de cartões) ----
   Estrutura: <div class="ds-tabela-wrap"><table class="ds-tabela"> com thead/tbody; tr principal .ds-linha-lista (+ .ds-linha-clicavel quando abre ao clicar; .is-selecionada quando marcada).
   Papéis de coluna (th e td): __check (caixa de seleção), __principal (a que cresce; dentro dela __id > __tipo + __nome-wrap > __nome), __nowrap (não quebra linha),
   .ds-col-sobreposta/.ds-col-acoes (ações, à direita), __card (coluna SÓ do mobile: o que o cartão mostra além do título), __so-desktop (some nas linhas do mobile e fica
   no cabeçalho como ordenação), __so-larga (some até 1024 px). Linha de aviso (carregando, vazio): tr.ds-tabela__msg com um só td colspan. Seleção com Ctrl/Shift: --selecao.
   Cartão no mobile, em 3 linhas: caixa + tipo + ⋮ / título sozinho com reticências / detalhes (__card). */
.ds-tabela-wrap { overflow: visible; margin-bottom: calc(-1 * var(--ds-main-pad-y)); background: var(--ds-color-surface); }
/* border-collapse: separate: com bordas coladas o th sticky deixaria a borda de baixo para trás ao rolar */
.ds-tabela { width: 100%; margin: 0; border-collapse: separate; border-spacing: 0; }
.ds-tabela thead th {
  position: sticky; top: var(--ds-pagina-topo-tabela); z-index: 40;
  padding: 12px 16px; text-align: left; white-space: nowrap;
  font-size: var(--ds-text-xs); font-weight: var(--ds-weight-semibold); text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--ds-color-text-muted); background: var(--ds-color-surface); border-bottom: var(--ds-borda-forte) solid var(--ds-color-border);
}
.ds-tabela tbody td { padding: 14px 16px; vertical-align: middle; border-bottom: var(--ds-borda) solid var(--ds-glass-border); font-size: var(--ds-text-base); color: var(--ds-color-text); }
.ds-tabela tbody tr { transition: background var(--ds-duration-fast) var(--ds-ease-standard), box-shadow var(--ds-duration-fast), border-color var(--ds-duration-fast); }
.ds-tabela tbody tr:last-child td { border-bottom: none; }
.ds-tabela tbody tr:hover td { background: var(--ds-sidebar-item-hover); }
.ds-tabela tbody tr.is-selecionada td { background: var(--ds-sidebar-item-active); }
.ds-tabela--selecao tbody tr { user-select: none; }
.ds-tabela tbody tr.ds-tabela__msg:hover td { background: transparent; }
.ds-tabela .ds-tabela__check { width: 48px; text-align: left; padding: 14px 0 14px 16px; }
.ds-tabela thead .ds-tabela__check { padding-top: 12px; padding-bottom: 12px; }
.ds-tabela .ds-tabela__expandir { width: 32px; padding-left: 0; padding-right: 0; }   /* coluna da seta de expandir: estreita, o conteúdo fica junto dela */
.ds-tabela input[type="checkbox"] { display: block; margin: 0; width: 16px; height: 16px; }
.ds-tabela__principal { width: 46%; min-width: 260px; }
@media (min-width: 769px) { .ds-tabela td.ds-tabela__principal { max-width: 0; } }
.ds-tabela td.ds-tabela__nowrap { white-space: nowrap; }
.ds-tabela__card { display: none; }
.ds-tabela__vig { display: none; }
.ds-tabela__ordenar { display: none; }
.ds-tabela__id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ds-tabela__nome-wrap { flex: 0 1 auto; min-width: 0; }   /* o nome ocupa só o seu texto: chips e ícones que vêm depois ficam junto dele */
.ds-tabela__codigo { margin-right: var(--ds-space-1); font-weight: var(--ds-weight-regular); color: var(--ds-color-text-muted); }   /* texto cinza que antecede o nome do item: sigla do plano, código do elemento… */
.ds-tabela__rotulo { text-transform: none; letter-spacing: normal; font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-tabela__cab-acoes { display: none; }
.ds-tabela tbody tr.ds-linha-filha { display: none; }   /* descendente de um item da árvore: aparece só com o pai aberto (.is-aberta) */
.ds-tabela tbody tr.ds-linha-filha.is-aberta { display: table-row; }
/* Contorno colorido de um bloco aberto da lista em árvore (celular): SVG desenhado por elAtualizarGruposArvore sobre o bloco; o traço percorre a borda como uma cobrinha
   (topo esquerdo, desce pela esquerda, base, sobe pela direita e fecha no topo) quando o bloco abre (.is-animado). A cor vem de --ds-color-borda-item (tipo do raiz). */
.ds-item-contorno { position: absolute; pointer-events: none; overflow: visible; --ds-color-borda-item: var(--ds-color-action); }
.ds-item-contorno path { fill: none; stroke: var(--ds-color-borda-item); stroke-width: var(--ds-borda-forte); stroke-dasharray: 1 1; stroke-dashoffset: 0; }
.ds-item-contorno.is-animado path { stroke-dashoffset: 1; animation: ds-contorno-desenhar 700ms var(--ds-ease-standard) forwards; }
@keyframes ds-contorno-desenhar { to { stroke-dashoffset: 0; } }
/* Seta de expandir/recolher do item de uma lista em árvore: gira 90° quando aberta (.is-aberto) */
.ds-item-seta {
  width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--ds-r-md); color: var(--ds-color-text-muted);
  transition: background var(--ds-duration-fast) var(--ds-ease-standard), transform var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-item-seta:hover { background: var(--ds-sidebar-item-hover); color: var(--ds-color-action); }
.ds-item-seta.is-aberto { transform: rotate(90deg); }
.ds-item-seta .material-symbols-outlined { font-size: var(--ds-icon-md); }
.ds-tabela__nome { font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1024px) { .ds-tabela .ds-tabela__so-larga { display: none; } }
@media (max-width: 768px) {
  /* lista (padrão Drive): sem painel; o fundo é o da página e cada item é um bloco arredondado de cor DIFERENTE do fundo (--ds-color-surface-2), com um pequeno vão entre eles */
  .ds-tabela-wrap { margin: 0; width: 100%; display: block; padding: 0; background: none; position: relative; }
  .ds-tabela { display: block; width: 100%; }
  /* cabeçalho (padrão Drive): um só item, a ordenação atual com a seta da direção; tocar abre o menu de ordenar. À direita ficarão os modos de visualização, nas telas que os tiverem. */
  .ds-tabela thead { display: block; }
  .ds-tabela thead tr { display: flex; align-items: center; min-height: var(--ds-pagina-lista-cab); padding: 0 var(--ds-space-2); }
  .ds-tabela thead, .ds-tabela thead tr, .ds-tabela thead th { background: none; }
  .ds-tabela thead th { display: none; }
  .ds-tabela thead th.ds-tabela__ordenar, .ds-tabela thead th.ds-tabela__cab-acoes { position: static; }
  .ds-tabela thead th.ds-tabela__ordenar { display: block; flex: 1 1 auto; padding: 2px 0; border: none; }
  .ds-tabela thead th.ds-tabela__cab-acoes { display: block; padding: 0; border: none; }   /* ações da lista (⋮) à direita do cabeçalho, no lugar dos modos de visualização */
  /* com a seleção ligada, o item de ordenação dá lugar a "Selecionar tudo / Desmarcar tudo" (mesma altura: a lista não se move) */
  .ds-tabela--selecionando thead th.ds-tabela__ordenar, .ds-tabela--selecionando thead th.ds-tabela__cab-acoes { display: none; }
  .ds-tabela--selecionando thead th.ds-tabela__check { display: flex; align-items: center; gap: var(--ds-space-2); width: auto; padding: 2px 0; border: none; }
  .ds-tabela thead .ds-tabela__card { display: inline; font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); text-transform: none; letter-spacing: normal; color: var(--ds-color-text); cursor: pointer; }
  .ds-tabela__ordenar-btn { display: inline-flex; align-items: center; gap: var(--ds-space-2); padding: 0; border: 0; background: none; cursor: pointer; font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); text-transform: none; letter-spacing: normal; color: var(--ds-color-text); }
  .ds-tabela__ordenar-btn .material-symbols-outlined, .ds-tabela thead th.ds-tabela__cab-acoes .ds-icon-action { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--ds-r-pill); background: var(--ds-color-surface-2); font-size: var(--ds-icon-md); }
  .ds-tabela thead th.ds-tabela__cab-acoes .ds-icon-action { border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .ds-tabela thead th.ds-tabela__cab-acoes .ds-icon-action .material-symbols-outlined { font-size: var(--ds-icon-md); }
  /* corpo: lista de linhas compactas (padrão Gmail), uma coluna: 1ª linha = badge do tipo à esquerda + vigência à direita (leve); 2ª = título; 3ª = badges, responsável e progresso; ⋮ centrado na altura.
     A caixa de seleção só aparece no modo de seleção (.ds-tabela--selecionando, ligado pelo toque longo), no lugar do ⋮: toque abre o item; com a seleção ligada, toque marca/desmarca. */
  .ds-tabela tbody { display: flex; flex-direction: column; gap: var(--ds-space-1); width: 100%; margin-top: var(--ds-space-1); }
  .ds-tabela tbody tr {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto auto auto;
    gap: 4px 8px; align-items: center; padding: 10px var(--ds-space-3) 10px var(--ds-space-3); border-radius: var(--ds-r-md); background: var(--ds-color-surface-2); position: relative;
  }
  /* lista em árvore: o item raiz e seus descendentes abertos se colam num só bloco (--ini/--meio/--fim), separados por uma linha cinza curta; o contorno colorido
     (.ds-item-contorno) é desenhado por cima, só enquanto o bloco está aberto; a seta fica na faixa da esquerda */
  .ds-tabela tbody tr.ds-item-grupo--ini { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .ds-tabela tbody tr.ds-item-grupo--meio { border-radius: 0; margin-top: calc(-1 * var(--ds-space-1)); }
  .ds-tabela tbody tr.ds-item-grupo--fim { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: calc(-1 * var(--ds-space-1)); }
  .ds-tabela tbody tr.ds-item-grupo--meio::before, .ds-tabela tbody tr.ds-item-grupo--fim::before { content: ''; position: absolute; top: 0; left: var(--ds-space-4); right: var(--ds-space-4); height: var(--ds-borda); background: var(--ds-color-border); }
  .ds-tabela--arvore tbody tr { padding-left: calc(var(--ds-space-3) + 24px); }
  .ds-tabela tbody .ds-tabela__expandir { position: absolute; left: var(--ds-space-2); top: 50%; transform: translateY(-50%); }
  .ds-tabela tbody tr.ds-linha-filha.is-aberta { display: grid; }
  .ds-tabela tbody tr:hover { background: color-mix(in srgb, var(--ds-color-surface-2), var(--ds-color-text) 8%); }   /* destaque do item sob o dedo/cursor: mais claro que o cartão */
  .ds-tabela tbody tr.is-selecionada { background: var(--ds-sidebar-item-active); }
  .ds-tabela tbody td { display: block; padding: 0; border: none; }
  .ds-tabela tbody tr:hover td, .ds-tabela tbody tr.is-selecionada td { background: none; }
  .ds-tabela tbody .ds-tabela__check { display: none; }
  /* com a seleção ligada a caixa ocupa o lugar do ⋮ */
  .ds-tabela--selecionando tbody .ds-tabela__check { display: block; grid-area: 1 / 3 / 4 / 4; justify-self: end; width: auto; padding: 0 12px 0 8px; align-self: center; }
  .ds-tabela--selecionando tbody .ds-col-sobreposta, .ds-tabela--selecionando tbody .ds-col-acoes { display: none; }
  /* a célula principal e seus invólucros "dissolvem": tipo e nome viram itens diretos da grade */
  .ds-tabela tbody .ds-tabela__principal, .ds-tabela tbody .ds-tabela__id, .ds-tabela tbody .ds-tabela__nome-wrap { display: contents; }
  .ds-tabela tbody .ds-tabela__tipo { grid-area: 1 / 1; justify-self: start; }
  /* vigência/prazo no extremo direito do item (cobre a coluna do ⋮, que fica centrado na altura e não a atrapalha) */
  .ds-tabela tbody .ds-tabela__vig { display: block; grid-area: 1 / 2 / 2 / 4; justify-self: end; font-size: var(--ds-text-xs); font-weight: var(--ds-weight-regular); color: var(--ds-color-text-muted); white-space: nowrap; }
  .ds-tabela tbody .ds-tabela__nome { grid-area: 2 / 1 / 3 / 3; min-width: 0; font-size: var(--ds-text-md); }
  .ds-tabela tbody .ds-col-sobreposta, .ds-tabela tbody .ds-col-acoes { grid-area: 1 / 3 / 4 / 4; width: auto; align-self: center; justify-self: end; margin-right: calc(-1 * var(--ds-space-2)); }
  .ds-tabela tbody .ds-tabela__card { grid-area: 3 / 1 / 4 / 3; display: block; min-width: 0; }
  /* 3ª linha: cabem quantos badges couberem, sem quebrar; o que não cabe some e o badge "…" (.ds-badge--mais) sinaliza (uiMetaPreencher) */
  .ds-tabela__meta { display: flex; flex-wrap: nowrap; align-items: center; gap: var(--ds-space-2); overflow: hidden; }
  .ds-tabela__meta > * { flex: none; white-space: nowrap; }
  .ds-tabela__meta > :first-child { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ds-badge--mais { justify-content: center; padding-left: var(--ds-space-2); padding-right: var(--ds-space-2); }
  .ds-badge--mais .material-symbols-outlined { display: block; font-size: var(--ds-icon-sm); }
  /* 1ª linha: o tipo/nível é texto neutro e leve, da cor da data (sem badge) */
  .ds-tabela tbody .ds-tabela__tipo { padding: 0; border: 0; border-radius: 0; background: none !important; color: var(--ds-color-text-muted) !important; font-size: var(--ds-text-xs); font-weight: var(--ds-weight-regular); }
  .ds-tabela__prog { margin-top: var(--ds-space-2); }
  /* o item tem a cor surface-2: as pílulas de dentro (nível, responsável) usam a surface para continuar visíveis */
  .ds-tabela tbody .ds-resp, .ds-tabela tbody .ds-badge[class*="ds-badge--ico"], .ds-tabela tbody .ds-badge:not([class*=" ds-badge--"]) { background: var(--ds-color-surface); }   /* badges neutros (sem tom de status) também saem da cor do item */
  .ds-tabela tbody .ds-progresso .ds-kpi-track { flex: 1 1 auto; width: auto; }   /* na linha da lista a barra ocupa a largura disponível */
  .ds-tabela tbody .ds-tabela__so-desktop { display: none; }
  /* linha de aviso ocupa a largura toda, sem virar cartão */
  .ds-tabela tbody tr.ds-tabela__msg { display: block; grid-column: 1 / -1; background: none; border: none; box-shadow: none; padding: 0; }
}

@media print { .ds-tabela__check { display: none; } }

/* Botão flutuante (FAB, só ≤768 px): o botão principal da página e as ações acessórias (as da seta do botão dividido) no celular. Montado por uiAcoesPaginaMontar
   (app_ui_utils.html), nunca à mão: <div class="ds-fab"> com .ds-fab__fundo, .ds-fab__opcoes (> .ds-fab__item > .ds-fab__rotulo + .ds-fab__mini) e .ds-fab__principal.
   Aberto = .is-aberto (o + gira para ×, o fundo escurece). Com FAB na página, as ações da barra do topo somem no mobile (o FAB as substitui). */
.ds-fab { display: none; position: fixed; right: var(--ds-space-5); bottom: var(--ds-space-5); z-index: var(--ds-z-fab); flex-direction: column; align-items: flex-end; gap: var(--ds-space-4); }
.ds-fab__principal {
  position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border: 0; border-radius: var(--ds-r-pill); cursor: pointer;
  color: var(--ds-color-on-action); background: var(--ds-color-action); box-shadow: var(--ds-shadow-3);
  transition: transform var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-fab__principal:active { transform: scale(0.95); }
.ds-fab { pointer-events: none; }   /* o contêiner cobre as opções recolhidas: só o botão e as opções abertas recebem toque, senão o fim da lista fica sem clique */
.ds-fab__principal { pointer-events: auto; }
.ds-fab.is-aberto, .ds-fab.is-aberto .ds-fab__fundo { pointer-events: auto; }
.ds-fab__principal .material-symbols-outlined { font-size: var(--ds-icon-xl); transition: transform var(--ds-duration-slow) var(--ds-ease-standard); }
.ds-fab.is-aberto .ds-fab__principal { background: var(--ds-color-text); }
.ds-fab.is-aberto .ds-fab__principal .material-symbols-outlined { transform: rotate(45deg); }
.ds-fab__opcoes {
  position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: var(--ds-space-3); padding-bottom: var(--ds-space-1);
  opacity: 0; pointer-events: none; transform: translateY(20px);
  transition: opacity var(--ds-duration-slow) var(--ds-ease-emphasized), transform var(--ds-duration-slow) var(--ds-ease-emphasized);
}
.ds-fab.is-aberto .ds-fab__opcoes { opacity: 1; pointer-events: auto; transform: none; }
.ds-fab__item { display: flex; align-items: center; gap: var(--ds-space-3); border: 0; padding: 0; background: none; cursor: pointer; font-family: inherit; }
.ds-fab__rotulo { padding: 6px 12px; border: var(--ds-borda) solid var(--ds-color-border); border-radius: var(--ds-r-md); background: var(--ds-color-surface); color: var(--ds-color-text); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium); box-shadow: var(--ds-shadow-2); }
.ds-fab__mini { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: var(--ds-r-pill); color: var(--ds-color-on-action); background: var(--ds-color-text-muted); box-shadow: var(--ds-shadow-3); }
.ds-fab__item--principal .ds-fab__mini { background: var(--ds-color-action); }
.ds-fab__fundo { display: none; position: fixed; inset: 0; z-index: 1; background: var(--ds-color-scrim); backdrop-filter: blur(2px); }
.ds-fab.is-aberto .ds-fab__fundo { display: block; }
@media (max-width: 768px) {
  .ds-fab { display: flex; }
  .ds-pagina:has(> .ds-fab) > .ds-pagina__acoes, .ds-pagina:has(> .ds-fab) .ds-pagina__hero > .ds-pagina__acoes { display: none; }
}

/* Voltar: botão discreto (.ds-icon-action) à esquerda do título; injetado por uiVoltarGarantir (app_ui_utils.html) em todo .ds-pagina__hero. Some quando não há para onde voltar. */
.ds-pagina__voltar { flex: none; margin-left: calc(-1 * var(--ds-space-2)); background: none; border-color: transparent; box-shadow: none; }
.ds-pagina__voltar.hidden { display: none; }

/* Bottom sheet (painel que sobe da base da tela, no mobile): .ds-sheet(.is-aberto) > .ds-sheet__fundo + .ds-sheet__painel > .ds-sheet__alca + .ds-sheet__cab (__titulo + ação opcional, ex. "Limpar" + fechar à direita) + .ds-sheet__corpo + .ds-sheet__rodape (opcional).
   Aberto por uiSheetAbrir(opcoes) (app_ui_utils.html): fecha no fundo, no ×, no Esc e arrastando a alça para baixo. Grupos de opções dentro do corpo: .ds-sheet__grupo > .ds-sheet__rotulo + itens .acoes-menu-item (abrirMenuSelecao no mobile). */
.ds-esqueleto { display: none; }
@media (max-width: 768px) {
  /* carregamento de lista no celular: esqueleto (blocos no formato do item) em vez do spinner, que fica no desktop */
  .ds-carregando .lista-spinner-wrap { display: none; }
  .ds-esqueleto { display: flex; flex-direction: column; gap: var(--ds-space-1); width: 100%; }
  .ds-esqueleto__item { display: flex; flex-direction: column; gap: var(--ds-space-2); padding: 14px var(--ds-space-3); border-radius: var(--ds-r-md); background: var(--ds-color-surface-2); }
  .ds-esqueleto__linha { display: block; width: 100%; height: 12px; border-radius: var(--ds-r-pill); background: linear-gradient(90deg, var(--ds-color-border) 25%, var(--ds-color-surface) 50%, var(--ds-color-border) 75%); background-size: 200% 100%; animation: ds-brilho 1.2s linear infinite; }
  .ds-esqueleto__linha--curta { width: 30%; }
  .ds-esqueleto__linha--media { width: 60%; }
}
@keyframes ds-brilho { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.ds-puxar { position: fixed; top: 60px; left: 50%; z-index: var(--ds-z-header); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -20px; border-radius: var(--ds-r-pill); background: var(--ds-color-surface); border: var(--ds-borda) solid var(--ds-color-border); color: var(--ds-color-text-muted); opacity: 0; pointer-events: none; }   /* arrastar a lista para baixo atualiza (uiPuxarParaAtualizar) */
.ds-puxar.is-pronto { color: var(--ds-color-action); }
.ds-puxar.is-atualizando { opacity: 1; transform: translateY(24px); }
.ds-puxar.is-atualizando .material-symbols-outlined { animation: lista-spin 0.8s linear infinite; }
.ds-sheet { position: fixed; inset: 0; z-index: var(--ds-z-modal); display: flex; align-items: flex-end; justify-content: center; visibility: hidden; pointer-events: none; }
.ds-sheet.is-aberto { visibility: visible; pointer-events: auto; }
.ds-sheet__fundo { position: absolute; inset: 0; background: var(--ds-color-scrim); opacity: 0; transition: opacity var(--ds-duration-base) var(--ds-ease-standard); }
.ds-sheet.is-aberto .ds-sheet__fundo { opacity: 1; }
.ds-sheet__painel {
  position: relative; display: flex; flex-direction: column; width: 100%; max-width: 560px; max-height: 85vh;
  background: var(--ds-color-surface); border-radius: var(--ds-r-2xl) var(--ds-r-2xl) 0 0; box-shadow: var(--ds-shadow-4);
  transform: translateY(100%); transition: transform var(--ds-duration-slow) var(--ds-ease-emphasized);
}
.ds-sheet.is-aberto .ds-sheet__painel { transform: none; }
.ds-sheet__alca { flex: none; width: 40px; height: 4px; margin: var(--ds-space-2) auto 0; border-radius: var(--ds-r-pill); background: var(--ds-color-border); touch-action: none; }
.ds-sheet__cab { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); padding: var(--ds-space-2) var(--ds-space-4) var(--ds-space-2); touch-action: none; }
.ds-sheet__titulo { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--ds-text-md); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-sheet__corpo { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--ds-space-5); padding: var(--ds-space-2) var(--ds-space-4) var(--ds-space-4); }
.ds-sheet__rodape { flex: none; display: flex; gap: var(--ds-space-2); padding: var(--ds-space-3) var(--ds-space-4); padding-bottom: max(var(--ds-space-3), env(safe-area-inset-bottom)); border-top: var(--ds-borda) solid var(--ds-color-border); }
.ds-sheet__rodape > .ds-btn { flex: 1; }
.ds-sheet__grupo { display: flex; flex-direction: column; gap: var(--ds-space-2); }
.ds-sheet__rotulo { font-size: var(--ds-text-xs); font-weight: var(--ds-weight-semibold); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ds-color-text-muted); }

/* Barra de navegação (mobile): fixa na base do app, só ≤768px, só ícones. .ds-navbar > button.ds-navbar__item(.is-ativo) > ícone.
   Um item por módulo do ciclo do plano (Início, Planejamento, Execução, Avaliação); o item do módulo da página atual fica marcado.
   Montada e mantida por uiNavbarAtualizar() (app_ui_utils.html), chamada ao fim do navigate(). */
.ds-navbar { display: none; }
@media (max-width: 768px) {
  .ds-navbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--ds-z-header); display: flex; align-items: stretch;
    padding: var(--ds-space-1) var(--ds-space-2) max(var(--ds-space-1), env(safe-area-inset-bottom));
    background: var(--ds-color-surface); border-top: var(--ds-borda) solid var(--ds-color-border);
  }
  .ds-navbar__item {
    flex: 1 1 0; min-width: 0; min-height: 56px; display: flex; align-items: center; justify-content: center;
    padding: var(--ds-space-1); border: 0; background: none; cursor: pointer; color: var(--ds-color-text-muted);
  }
  .ds-navbar__item .material-symbols-outlined { font-size: var(--ds-icon-xl); padding: var(--ds-space-1) var(--ds-space-5); border-radius: var(--ds-r-pill); }
  .ds-navbar__item.is-ativo { color: var(--ds-color-text); }
  .ds-navbar__item.is-ativo .material-symbols-outlined { background: var(--ds-color-info-bg); color: var(--ds-color-info-fg); }
  body:has(.ds-navbar) #main-content { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  body:has(.ds-navbar) .ds-fab { bottom: calc(72px + var(--ds-space-4)); }
  /* rolando a lista para baixo o botão sai de cena (não cobre os itens); o menor arrasto para cima o traz de volta (uiFabRolagem) */
  .ds-fab { transition: transform var(--ds-duration-base) var(--ds-ease-standard), opacity var(--ds-duration-base) var(--ds-ease-standard); }
  .ds-fab[data-recolhido]:not(.is-aberto) { transform: translateY(calc(100% + 96px)); opacity: 0; pointer-events: none; }
  /* o fim da lista rola até ficar acima do botão flutuante (56px + folga), senão ele cobre o ⋮ do último item */
  .ds-pagina:has(> .ds-fab) { padding-bottom: calc(56px + var(--ds-space-8)); }
}

/* ---- Badges / chips ---- */
/* Forma única da pílula (altura, arredondamento, fonte): badge de situação, tipo/nível e responsável compartilham as mesmas medidas; cada um só define cor e peso. */
.ds-badge, .ds-badge-tipo, .ds-resp, .ds-chip--atalho {
  display: inline-flex; align-items: center; gap: var(--ds-space-1);
  padding: 3px 12px; border-radius: var(--ds-r-pill);
  font-size: var(--ds-text-xs); line-height: 1.4; white-space: nowrap;
}
.ds-badge, .ds-badge-tipo { font-weight: var(--ds-weight-semibold); background: var(--ds-color-surface-2); color: var(--ds-color-text-muted); }
.ds-badge { max-width: 220px; }
.ds-badge > :not(.material-symbols-outlined) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ds-badge .material-symbols-outlined { font-size: var(--ds-icon-xs); flex-shrink: 0; }
/* Cor do ÍCONE do badge de dado (custo, vínculo, indicador…): o badge segue neutro, só o ícone leva a cor do conceito. O ícone solto (fora de badge) de elemento e de indicador usa .ds-ico-elemento / .ds-ico-indicador. */
.ds-badge--ico-custo .material-symbols-outlined { color: var(--ds-color-action); }
.ds-badge--ico-vinculo .material-symbols-outlined { color: var(--ds-color-info-fg); }
.ds-ico-indicador, .ds-badge--ico-indicador .material-symbols-outlined { color: var(--ds-color-indicador); }
.ds-ico-elemento, .ds-badge--ico-elemento .material-symbols-outlined { color: var(--ds-color-elemento); }
.ds-badge--ico-relacao .material-symbols-outlined { color: var(--ds-color-relacao); }
.ds-badge--ico-pendente .material-symbols-outlined { color: var(--ds-color-pending); }
.ds-badge--ico-perigo .material-symbols-outlined { color: var(--ds-color-danger-fg); }
.ds-badge--ico-prazo .material-symbols-outlined { color: var(--ds-color-success); }
.ds-badge--elaboracao { background: var(--ds-status-elaboracao-bg); color: var(--ds-status-elaboracao-fg); }
.ds-badge--analise    { background: var(--ds-status-analise-bg);    color: var(--ds-status-analise-fg); }
.ds-badge--execucao   { background: var(--ds-status-execucao-bg);   color: var(--ds-status-execucao-fg); }
.ds-badge--avaliacao  { background: var(--ds-status-avaliacao-bg);  color: var(--ds-status-avaliacao-fg); }
.ds-badge--prorrogado { background: var(--ds-status-prorrogado-bg); color: var(--ds-status-prorrogado-fg); }
.ds-badge--revisao    { background: var(--ds-status-revisao-bg);    color: var(--ds-status-revisao-fg); }
.ds-badge--finalizado { background: var(--ds-status-finalizado-bg); color: var(--ds-status-finalizado-fg); }
.ds-badge--cancelado  { background: var(--ds-status-cancelado-bg);  color: var(--ds-status-cancelado-fg); }
.ds-badge--success { background: var(--ds-color-success-bg); color: var(--ds-color-success-fg); }
.ds-badge--warning { background: var(--ds-color-warning-bg); color: var(--ds-color-warning-fg); }
.ds-badge--danger  { background: var(--ds-color-danger-bg);  color: var(--ds-color-danger-fg); }
.ds-badge--info    { background: var(--ds-color-info-bg);    color: var(--ds-color-info-fg); }

.ds-chip {
  display: inline-flex; align-items: center; gap: var(--ds-space-1);
  padding: var(--ds-space-0-5) var(--ds-space-2); border-radius: var(--ds-r-pill);
  border: 1px solid var(--ds-color-border); background: var(--ds-color-surface);
  font-size: var(--ds-text-xs); color: var(--ds-color-text); white-space: nowrap;
}
/* Chip-atalho: botão de uma ação rápida (ex.: duração da vigência), com a forma da pílula (grupo acima); aria-pressed="true" marca o que está aplicado */
.ds-chip--atalho { border: 0; box-shadow: inset 0 0 0 1px var(--ds-color-border); background: var(--ds-color-surface); color: var(--ds-color-text); font-family: var(--ds-font-sans); font-weight: var(--ds-weight-medium); cursor: pointer; }
.ds-chip--atalho:hover { box-shadow: inset 0 0 0 1px var(--ds-color-action); color: var(--ds-color-info-fg); }
.ds-chip--atalho:focus-visible { outline: none; box-shadow: var(--ds-shadow-focus); }
.ds-chip--atalho[aria-pressed="true"] { background: var(--ds-color-info-bg); box-shadow: none; color: var(--ds-color-info-fg); }

/* ---- Formulário ---- */
.ds-field { display: flex; flex-direction: column; gap: var(--ds-space-1); margin-bottom: var(--ds-space-4); }
.ds-label { font-size: var(--ds-text-base); font-weight: var(--ds-weight-medium); color: var(--ds-color-text); }
.ds-input, .ds-textarea, .ds-select {
  width: 100%; font-family: var(--ds-font-sans); font-size: var(--ds-text-base);
  color: var(--ds-color-text); background: var(--ds-color-surface);
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-r-md);
  padding: var(--ds-space-2) var(--ds-space-3);
  transition: border-color var(--ds-duration-fast) var(--ds-ease-standard),
              box-shadow var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-input, .ds-select { min-height: 40px; }
.ds-textarea { min-height: 72px; resize: vertical; }
.ds-input--codigo { letter-spacing: 8px; text-align: center; font-size: var(--ds-text-xl); }
.ds-input:focus, .ds-textarea:focus, .ds-select:focus {
  outline: none; border-color: var(--ds-color-action); box-shadow: var(--ds-shadow-focus);
}
.ds-input--error, .ds-textarea--error, .ds-select--error { border-color: var(--ds-color-danger); }
.ds-help { font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); }
.ds-help--error { color: var(--ds-color-danger-fg); }
.ds-contador { align-self: flex-end; font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); font-variant-numeric: tabular-nums; }
.ds-contador--limite { color: var(--ds-color-danger-fg); }

/* ---- Assistente em etapas (modal wizard canônico) ----
   .modal-overlay > .modal-card.modal-card--lg > .btn-icon-close + .ds-wizard > (.ds-wizard__trilha + .ds-wizard__corpo).
   Trilha: __cabecalho (__contexto em azul + __titulo), __aviso, __etapas > __etapa[.is-ativa|.is-concluida] (__num + __texto: __rotulo e __resumo),
   __andamento (barra + contador). Corpo: .wizard-steps-viewport > .wizard-step (com __titulo-etapa) e __rodape (botões). */
.modal-card.modal-card--lg { position: relative; overflow: hidden; padding: 0; width: min(800px, calc(100vw - 32px)); max-width: none; height: min(620px, calc(100vh - 48px)); max-height: none; }
.modal-card--lg > .btn-icon-close { position: absolute; top: var(--ds-space-3); right: var(--ds-space-3); z-index: 5; }
.ds-wizard { display: grid; grid-template-columns: 224px minmax(0, 1fr); flex: 1; min-height: 0; }
.ds-wizard__trilha { display: flex; flex-direction: column; gap: var(--ds-space-3); padding: var(--ds-space-5) var(--ds-space-4); background: var(--ds-color-surface-2); border-right: var(--ds-borda) solid var(--ds-glass-border); overflow-y: auto; min-height: 0; }
.ds-wizard__cabecalho { display: flex; flex-direction: column; gap: var(--ds-space-1-5); }
.ds-wizard__contexto { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; font-size: var(--ds-text-xs); line-height: var(--ds-leading-normal); font-weight: var(--ds-weight-bold); color: var(--ds-color-action); }
.ds-wizard__titulo { margin: 0; font-size: var(--ds-text-lg); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-wizard__aviso { display: flex; align-items: flex-start; gap: var(--ds-space-1-5); padding: var(--ds-space-2) var(--ds-space-2-5); border-radius: var(--ds-r-lg); background: var(--ds-color-info-bg); color: var(--ds-color-info-fg); font-size: var(--ds-text-xs); line-height: var(--ds-leading-normal); }
.ds-wizard__aviso--alerta { background: var(--ds-color-warning-bg); color: var(--ds-color-warning-fg); }
.ds-wizard__aviso .material-symbols-outlined { font-size: var(--ds-icon-md); flex: none; }
.ds-wizard__aviso > span:last-child { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.ds-wizard__aviso--corpo { margin-bottom: var(--ds-space-4); }
.ds-wizard__etapas { display: flex; flex-direction: column; gap: var(--ds-space-1-5); flex: 1; min-height: 0; }
.ds-wizard__etapa { display: flex; align-items: flex-start; gap: var(--ds-space-2-5); width: 100%; padding: var(--ds-space-2-5); border: var(--ds-borda) solid transparent; border-radius: var(--ds-r-lg); background: none; color: var(--ds-color-text-muted); text-align: left; font-family: var(--ds-font-sans); cursor: pointer; }
.ds-wizard__etapa:hover { background: var(--ds-sidebar-item-hover); }
.ds-wizard__etapa.is-ativa { background: var(--ds-color-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-color-text); }
.ds-wizard__num { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; margin-top: var(--ds-space-0-5); border-radius: var(--ds-r-pill); background: var(--ds-color-border); color: var(--ds-color-text-muted); font-size: var(--ds-text-xs); font-weight: var(--ds-weight-bold); }
.ds-wizard__num .material-symbols-outlined { font-size: var(--ds-icon-sm); }
.ds-wizard__etapa.is-ativa .ds-wizard__num { background: var(--ds-color-action); color: var(--ds-color-on-action); }
.ds-wizard__etapa.is-concluida .ds-wizard__num { background: var(--ds-color-success); color: var(--ds-color-on-action); }
.ds-wizard__texto { display: flex; flex-direction: column; gap: var(--ds-space-0-5); min-width: 0; }
.ds-wizard__rotulo { font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-wizard__resumo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); }
.ds-wizard__andamento { display: flex; flex-direction: column; gap: var(--ds-space-1-5); flex: none; font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); }
.ds-wizard__barra { height: var(--ds-space-1); border-radius: var(--ds-r-pill); background: var(--ds-color-border); overflow: hidden; }
.ds-wizard__barra-preenchimento { display: block; height: 100%; border-radius: var(--ds-r-pill); background: var(--ds-color-action); transition: width var(--ds-duration-fast) var(--ds-ease-standard); }
.ds-wizard__corpo { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ds-wizard button.ds-select { position: relative; padding-right: var(--ds-space-10); }
.ds-wizard button.ds-select::after { content: 'expand_more'; position: absolute; top: 50%; right: var(--ds-space-2); transform: translateY(-50%); font-family: 'Material Symbols Outlined'; font-feature-settings: 'liga'; font-size: var(--ds-icon-lg); line-height: 1; color: var(--ds-color-text-muted); }
.ds-wizard__corpo .wizard-steps-viewport { padding: var(--ds-space-5) var(--ds-space-8) var(--ds-space-4); }
.ds-wizard__titulo-etapa { margin: 0 var(--ds-space-8) var(--ds-space-4) 0; font-size: var(--ds-text-lg); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-wizard__rodape { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: var(--ds-space-2); flex: none; padding: var(--ds-space-3) var(--ds-space-4); border-top: var(--ds-borda) solid var(--ds-glass-border); }
.ds-wizard__rodape-dir { display: flex; align-items: center; gap: var(--ds-space-2); margin-left: auto; }
@media (max-width: 768px) {
  .modal-card.modal-card--lg { width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .ds-wizard { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .ds-wizard__trilha { gap: var(--ds-space-2); padding: var(--ds-space-3) var(--ds-space-12) var(--ds-space-3) var(--ds-space-4); overflow-y: visible; border-right: 0; border-bottom: var(--ds-borda) solid var(--ds-glass-border); }
  .ds-wizard__etapas { display: none; }
  .ds-wizard__corpo .wizard-steps-viewport { padding: var(--ds-space-4); }
}

/* ---- Formulário: marca de obrigatório, divisor e duas colunas ---- */
.ds-obrig { font-size: var(--ds-text-xs); font-weight: var(--ds-weight-bold); text-transform: uppercase; color: var(--ds-color-danger-fg); }
.ds-divisor { margin: var(--ds-space-5) 0; border-top: var(--ds-borda) solid var(--ds-glass-border); }
.ds-form-linha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ds-space-4); }
@media (max-width: 480px) { .ds-form-linha { grid-template-columns: minmax(0, 1fr); gap: 0; } }

/* ---- Interruptor (liga/desliga): <label class="ds-switch"><input type="checkbox" role="switch"><span class="ds-switch__trilho"></span></label> ---- */
.ds-switch { position: relative; display: inline-flex; flex-shrink: 0; cursor: pointer; }
.ds-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.ds-switch__trilho { position: relative; width: 38px; height: 20px; border-radius: var(--ds-r-pill); background: var(--ds-color-border-strong); transition: background var(--ds-duration-base) var(--ds-ease-standard); }
.ds-switch__trilho::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ds-color-surface); box-shadow: var(--ds-shadow-1); transition: left var(--ds-duration-base) var(--ds-ease-standard); }
.ds-switch input:checked + .ds-switch__trilho { background: var(--ds-color-action); }
.ds-switch input:checked + .ds-switch__trilho::after { left: 20px; }
.ds-switch input:focus-visible + .ds-switch__trilho { box-shadow: var(--ds-shadow-focus); }
.ds-switch input:disabled + .ds-switch__trilho { opacity: .5; cursor: not-allowed; }
.ds-switch-linha { display: flex; align-items: center; gap: var(--ds-space-3); margin-bottom: var(--ds-space-4); }

/* ---- Lista selecionável (mestre-detalhe): um item ativo, o detalhe fica ao lado ---- */
.ds-lista-sel { display: flex; flex-direction: column; border: var(--ds-borda) solid var(--ds-color-border); border-radius: var(--ds-r-xl); background: var(--ds-color-surface); overflow-y: auto; min-height: 0; }
.ds-lista-sel__item { display: flex; flex-direction: column; gap: var(--ds-space-1); padding: var(--ds-space-2) var(--ds-space-3); border: 0; border-left: var(--ds-borda-destaque) solid transparent; border-bottom: var(--ds-borda) solid var(--ds-color-border); background: transparent; color: var(--ds-color-text); font: inherit; font-size: var(--ds-text-sm); text-align: left; cursor: pointer; }
.ds-lista-sel__item:last-child { border-bottom: 0; }
.ds-lista-sel__item:hover { background: var(--ds-color-surface-2); }
.ds-lista-sel__item.is-ativo { background: var(--ds-color-info-bg); border-left-color: var(--ds-color-action); }
.ds-lista-sel-grade { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: var(--ds-space-5); align-items: start; }
@media (max-width: 768px) { .ds-lista-sel-grade { grid-template-columns: minmax(0, 1fr); } }

/* ---- Layout helpers ---- */
.ds-stack { display: flex; flex-direction: column; gap: var(--ds-space-4); }
.ds-stack--2 { gap: var(--ds-space-2); }
.ds-stack--3 { gap: var(--ds-space-3); }
.ds-stack--6 { gap: var(--ds-space-6); }
.ds-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-space-2); }
.ds-inline { display: inline-flex; align-items: center; gap: var(--ds-space-1); }
.ds-spread { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); }

/* ---- Acessibilidade ---- */
.ds-visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.ds-focusable:focus-visible { outline: 2px solid var(--ds-color-action); outline-offset: 2px; }
/* ===================== COMPONENTES (vidro, abas, paginação…) ===================== */

/* ---- .ds-btn: variantes de vidro ---- */
.ds-btn--glass-primary {
  background: var(--ds-glass-bg-strong);
  -webkit-backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  backdrop-filter: blur(var(--ds-glass-blur)) saturate(var(--ds-glass-saturate));
  border-color: var(--ds-glass-border); box-shadow: var(--ds-shadow-1); color: var(--ds-primary-700);
}
[data-ds-theme="dark"] .ds-btn--glass-primary { color: var(--ds-color-action); }
.ds-btn--glass-primary:hover { box-shadow: var(--ds-glass-shadow); }
.ds-btn--glass-secondary {
  background: var(--ds-glass-bg);
  -webkit-backdrop-filter: blur(var(--ds-glass-blur)); backdrop-filter: blur(var(--ds-glass-blur));
  border-color: var(--ds-glass-border); color: var(--ds-color-text);
}
.ds-btn--glass-secondary:hover { background: var(--ds-glass-bg-strong); }
/* Ação que resolve uma pendência da linha (nível 3): tom da pendência, sem competir com o azul do plano */
.ds-btn--pendencia,
.ds-btn--pendencia-rm { background: var(--ds-color-surface); border-color: var(--ds-color-warning); color: var(--ds-color-warning-fg); }
.ds-btn--pendencia:hover,
.ds-btn--pendencia-rm:hover { background: var(--ds-color-warning-bg); }
.ds-btn--pendencia-rb { background: var(--ds-color-surface); border-color: var(--ds-color-success); color: var(--ds-color-success-fg); }
.ds-btn--pendencia-rb:hover { background: var(--ds-color-success-bg); }
.ds-btn--pendencia-ra { background: var(--ds-color-surface); border-color: var(--ds-risk-alto-fg); color: var(--ds-risk-alto-fg); }
.ds-btn--pendencia-ra:hover { background: var(--ds-risk-alto-bg); }
.ds-btn--pendencia-re { background: var(--ds-color-surface); border-color: var(--ds-color-danger); color: var(--ds-color-danger-fg); }
.ds-btn--pendencia-re:hover { background: var(--ds-color-danger-bg); }

/* ---- .ds-badge: tom neutro com borda ---- */
.ds-badge--neutral { background: var(--ds-color-surface-2); color: var(--ds-color-text-muted); }

/* ---- Abas segmentadas (pílula) — componente novo .ds-tabs ---- */
.ds-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; font-family: var(--ds-font-sans); }
.ds-tabs::-webkit-scrollbar { display: none; }
.ds-tabs--segmented { padding: 4px; border-radius: var(--ds-r-pill); box-shadow: none; }
.ds-tab-btn {
  background: none; border: none; cursor: pointer; color: var(--ds-color-text-muted);
  display: flex; align-items: center; gap: 6px; white-space: nowrap; position: relative;
  font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
  transition: all var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-tabs--segmented .ds-tab-btn { padding: 8px 16px; border-radius: var(--ds-r-pill); }
.ds-tabs--segmented .ds-tab-btn:hover { color: var(--ds-color-text); background: var(--ds-sidebar-item-hover); }
.ds-tabs--segmented .ds-tab-btn.active { background: var(--ds-color-surface); color: var(--ds-primary-700); box-shadow: var(--ds-shadow-1); font-weight: var(--ds-weight-semibold); }
[data-ds-theme="dark"] .ds-tabs--segmented .ds-tab-btn.active { color: var(--ds-color-action); }
/* ---- Abas de navegação (sublinhado, estilo Gmail) — .ds-tabs-nav: o ÚNICO componente de abas de seção ----
   Estrutura: .ds-tabs-nav (linha com a base contínua) > .ds-tabs-nav__scroll-wrap > [seta--ini] .ds-tabs-nav__scroll
   (role="tablist", rola na horizontal) > .ds-tabs-nav__item… [seta--fim]. A aba ativa (.active + aria-selected) desenha o
   sublinhado de 3px sobre a base. Contador: .ds-tab-count. Setas do carrossel: uiAbasNavAtualizar(barra) (app_ui_utils.html).
   Posição fixa (sticky) e reserva para botões ao lado são layout da tela, não do componente. */
.ds-tabs-nav {
  display: flex; align-items: flex-start; gap: 4px;
  background: var(--ds-color-surface); border-bottom: 1px solid var(--ds-color-border);
}
.ds-tabs-nav__scroll-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
.ds-tabs-nav__scroll { display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
.ds-tabs-nav__scroll::-webkit-scrollbar { display: none; }
.ds-tabs-nav__item {
  display: inline-flex; align-items: center; gap: 6px; position: relative;
  padding: 12px 16px; margin-bottom: -1px;
  background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0;
  color: var(--ds-color-text-muted); font-family: var(--ds-font-sans);
  font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
  cursor: pointer; white-space: nowrap;
  transition: color var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-tabs-nav__item:hover { color: var(--ds-color-text); background: var(--ds-sidebar-item-hover); }
.ds-tabs-nav__item.active { color: var(--ds-color-action); font-weight: var(--ds-weight-semibold); border-bottom-color: var(--ds-color-action); }
body.high-contrast .ds-tabs-nav__item.active { border-bottom-color: var(--ds-color-text); color: var(--ds-color-text); }
.ds-tabs-nav__item .material-symbols-outlined { font-size: 18px; }
/* Botão de configurar as abas (adicionar app, restaurar a ordem): só ícone, no fim da linha */
.ds-tabs-nav__item--config { margin-left: auto; flex-shrink: 0; padding: 12px 10px; }
.ds-tabs-nav__item--config:hover { color: var(--ds-color-action); }
/* Aba sendo arrastada para reordenar */
.ds-tabs-nav__item--arrastando { opacity: .35; }
/* Setas do carrossel: aparecem só quando as abas não cabem (uiAbasNavAtualizar) */
.ds-tabs-nav__seta {
  position: absolute; top: 0; bottom: 1px; width: 28px; padding: 0; border: none; cursor: pointer; z-index: 1;
  display: flex; align-items: center; justify-content: center; color: var(--ds-color-text-muted);
}
.ds-tabs-nav__seta:hover { color: var(--ds-color-action); }
.ds-tabs-nav__seta--ini { left: 0; background: linear-gradient(to left, transparent, var(--ds-color-surface) 55%); }
