.ds-tabs-nav__seta--fim { right: 0; background: linear-gradient(to right, transparent, var(--ds-color-surface) 55%); }
@media (max-width: 768px) { .ds-tabs-nav__seta { display: none !important; } }
/* Contador dentro da aba (navegação ou segmentada); vazio some */
.ds-tab-count {
  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 20px;
  padding: 1px 7px; border-radius: var(--ds-r-pill);
  background: var(--ds-sidebar-item-hover); color: var(--ds-color-text-muted);
  font-size: 11px; font-weight: var(--ds-weight-bold); text-align: center;
}
.ds-tab-count:empty { display: none; }
.ds-tab-count .material-symbols-outlined { font-size: 13px; }
.ds-tab-btn.active .ds-tab-count,
.ds-tabs-nav__item.active .ds-tab-count,
.ds-tab-count--info { background: var(--ds-color-info-bg); color: var(--ds-color-info-fg); }
/* o tom de situação (sucesso/alerta) vale também na aba ativa */
.ds-tab-count--sucesso,
.ds-tabs-nav__item.active .ds-tab-count--sucesso { background: var(--ds-color-success-bg); color: var(--ds-color-success-fg); }
.ds-tab-count--alerta,
.ds-tabs-nav__item.active .ds-tab-count--alerta { background: var(--ds-color-warning-bg); color: var(--ds-color-warning-fg); }
/* não lido/novo: o vermelho de notificação (o mesmo do sino) */
.ds-tab-count--notificacao,
.ds-tabs-nav__item.active .ds-tab-count--notificacao { background: var(--ds-color-notificacao); color: var(--ds-color-on-notificacao); }

@media (max-width: 768px) {
  /* Abas no mobile: saem da página; abrem numa gaveta pelo ícone de abas da barra do topo (uiTopoAbas) */
  .ds-tabs-nav { display: none; }
}
}

/* ---- Abas do painel lateral (Detalhes / Atividade / Lixeira…) — .ds-tabs-painel ---- */
.ds-tabs-painel { display: flex; align-items: center; gap: 4px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--ds-color-border); flex-shrink: 0; }
.ds-tabs-painel__item {
  padding: 8px 14px; border: none; background: none; border-radius: var(--ds-r-pill); white-space: nowrap;
  font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
  color: var(--ds-color-text-muted); cursor: pointer;
}
.ds-tabs-painel__item:hover { background: var(--ds-sidebar-item-hover); color: var(--ds-color-text); }
.ds-tabs-painel__item.active { background: var(--ds-sidebar-item-active); color: var(--ds-color-action); font-weight: var(--ds-weight-semibold); }

body .btn-outline { background: var(--ds-glass-bg); border: 1px solid var(--ds-glass-border); color: var(--ds-color-text); }
body .btn-outline:hover { background: var(--ds-glass-bg-strong); }

/* ---- Paginação padrão (.pagination-bar e .btn-pag) ---- */
.pagination-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: var(--ds-glass-bg-strong);
  border: 1px solid var(--ds-glass-border);
  border-top: none;
  border-radius: 0 0 var(--ds-r-xl) var(--ds-r-xl);
  flex-wrap: wrap;
  gap: 10px;
}
.pagination-bar.rsc-pag {
  margin: 0 !important;
  border: none !important;
  border-top: 1px solid var(--ds-glass-border) !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: transparent;
  padding: 10px 14px;
}
.pag-left, .pag-center, .pag-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--ds-text-sm);
  color: var(--ds-color-text-muted);
}
.btn-pag {
  background: var(--ds-glass-bg-strong);
  border: 1px solid var(--ds-glass-border);
  border-radius: var(--ds-r-md);
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ds-color-text);
  padding: 0;
  transition: all var(--ds-duration-fast) var(--ds-ease-standard);
  user-select: none;
}
.btn-pag:hover:not(:disabled) {
  background: var(--ds-sidebar-item-hover);
  border-color: var(--ds-color-border-strong);
  color: var(--ds-color-text);
}
.btn-pag:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  border-color: var(--ds-glass-border);
  color: var(--ds-color-text-muted);
  box-shadow: none;
}
.btn-pag .material-symbols-outlined {
  font-size: 18px;
}
.pag-selector {
  height: 32px;
  padding: 2px 6px;
  text-align: center;
  border-radius: var(--ds-r-md);
  min-width: 56px;
  background: var(--ds-color-surface);
  color: var(--ds-color-text);
  border: 1px solid var(--ds-glass-border);
}
.pag-selector:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
body.high-contrast .btn-pag { border-color: var(--ds-color-border); color: var(--ds-color-text); }
body.high-contrast .btn-pag:disabled { opacity: 0.3; }

/* ---- Modais: geometria (janela centralizada, cabeçalho, corpo rolável, rodapé) ---- */
.modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.modal-card { display: flex; flex-direction: column; width: 100%; max-width: 600px; max-height: 90vh; }
.modal-header { display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: var(--ds-space-5); overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--ds-space-2-5); }
.btn-icon-close { background: none; border: none; cursor: pointer; }
/* ---- Modais: vidro, raio xl, título neutro, rodapé translúcido ---- */
body .modal-overlay,
body .ext-mini-overlay {
  background: var(--ds-color-scrim);
  z-index: var(--ds-z-modal);
}
body .modal-card {
  background: var(--ds-glass-bg-strong);
  border: 1px solid var(--ds-glass-border); border-radius: var(--ds-r-xl);
  box-shadow: var(--ds-glass-shadow-strong);
}
body .modal-header { padding: 20px 20px 12px; border-bottom: none; }
body .modal-header h3 { color: var(--ds-color-text); font-size: var(--ds-text-lg); font-weight: var(--ds-weight-semibold); }
body .modal-footer { background: transparent; border-top: 1px solid var(--ds-glass-border); border-radius: 0; padding: 12px 20px; }
body .btn-icon-close { width: 32px; height: 32px; border-radius: var(--ds-r-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--ds-color-text-muted); }
body .btn-icon-close:hover { background: var(--ds-sidebar-item-hover); color: var(--ds-color-text); }
/* Alto contraste: botão primário vazado */
body.high-contrast .btn-primary { background-color: var(--ds-color-bg); border: 1px solid var(--ds-color-action); color: var(--ds-color-action); font-weight: bold; }
body .form-control { border-radius: var(--ds-r-md); background: var(--ds-color-surface); }
body .form-control:focus { border-color: var(--ds-color-action); box-shadow: var(--ds-shadow-focus); }
/* ---- Faixa de KPIs (padrão de página: hero → KPIs → abas → conteúdo) ---- */
.ds-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.ds-kpi { border-radius: var(--ds-r-2xl); padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ds-kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ds-kpi-label { font-size: var(--ds-text-sm); color: var(--ds-color-text-muted); }
.ds-kpi-icon { width: 30px; height: 30px; border-radius: var(--ds-r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ds-kpi-icon .material-symbols-outlined { font-size: 18px; }
.ds-kpi-value { font-size: 26px; font-weight: var(--ds-weight-bold); color: var(--ds-color-text); letter-spacing: -0.5px; line-height: 1.2; }
.ds-kpi-track { width: 100%; height: 6px; border-radius: var(--ds-r-pill); background: var(--ds-sidebar-item-hover); overflow: hidden; }
.ds-kpi-fill { height: 100%; border-radius: var(--ds-r-pill); transition: width var(--ds-duration-slow) var(--ds-ease-standard); }
.ds-tone-info { background: var(--ds-color-info-bg); color: var(--ds-color-info-fg); }
.ds-tone-success { background: var(--ds-color-success-bg); color: var(--ds-color-success-fg); }
.ds-tone-danger { background: var(--ds-color-danger-bg); color: var(--ds-color-danger-fg); }
.ds-kpi-fill.ds-tone-info { background: var(--ds-color-action); }
.ds-kpi-fill.ds-tone-success { background: var(--ds-color-success-fg); }
.ds-kpi-fill.ds-tone-danger { background: var(--ds-color-danger-fg); }
@media (max-width: 1024px) { .ds-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .ds-kpis { grid-template-columns: 1fr; } .ds-kpi { padding: 16px; } }

/* ---- Dark: fundos que usam --ds-primary-700 (agora azul claro) precisam de texto escuro ---- */
[data-ds-theme="dark"] .bar-estratégico { color: var(--ds-color-on-action); }
/* ---- Botão-ícone de vidro (ações de hero/filtros: atualizar, exportar, densidade…) ---- */
.ds-icon-action {
  width: 40px; height: 40px; flex-shrink: 0; padding: 0; border-radius: var(--ds-r-lg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--ds-glass-bg); -webkit-backdrop-filter: blur(var(--ds-glass-blur)); backdrop-filter: blur(var(--ds-glass-blur));
  border: 1px solid var(--ds-glass-border); color: var(--ds-color-text-muted);
  transition: color var(--ds-duration-fast) var(--ds-ease-standard), box-shadow var(--ds-duration-fast) var(--ds-ease-standard);
}
.ds-icon-action:hover { color: var(--ds-color-action); box-shadow: var(--ds-glass-shadow); }
.ds-icon-action .material-symbols-outlined { font-size: 20px; }
.ds-icon-action--sm { width: 36px; height: 36px; }
.ds-icon-action--perigo { color: var(--ds-color-danger-fg); }
.ds-texto-leve { white-space: nowrap; color: var(--ds-color-text-muted); font-size: var(--ds-text-sm); }
.ds-lista-nomes { margin: 0 0 var(--ds-space-2); padding-left: var(--ds-space-5); }
.ds-icon-action[aria-pressed="true"] { color: var(--ds-color-action); background: var(--ds-sidebar-item-active); }
/* Ícone (i) de explicação — promovido de .elwiz-info/.srv-info/.selresp-info/.selsup-info (2026-11).
   Uso: <span class="material-symbols-outlined ds-info" tabindex="0" data-title="texto">info</span>, logo após o rótulo. */
.ds-info { font-size: 16px; color: var(--ds-color-text-muted); cursor: help; vertical-align: middle; margin-left: 4px; user-select: none; }
.ds-info:hover, .ds-info:focus-visible { color: var(--ds-color-text); outline: none; }
.ds-info.hidden { display: none; }
body.high-contrast .ds-info { color: var(--ds-color-text); }
/* ===================== COMPONENTES DE LISTA (2026-11-13; referência: pages_planos_lista.html) =====================
   Canônicos: toda tela nova usa ESTES. As cópias por tela (.pll-/.cal-/.avl-/.exl-/.ext-/.cxa-/.mse-filtro*, *-search*,
   *-pag-*, *-prog*, .resp-badge) estão listadas como obsoletas em docs/design_system_catalogo.json e migram quando a
   tela for tocada. Os menus suspensos são de script: abrirMenuSelecao() e acoesLinhaHTML()/acoesLinhaMenu()
   (components_acoes_linha.html) — nunca montar outro popover. */

/* Barra de filtros: [__normal | __selecao] (um ou outro) + __pag à direita. Vai dentro do .ds-pagina__filtros. */
.ds-filtros { display: flex; align-items: center; gap: 8px; padding: var(--ds-pagina-filtros-pad) 0; }
.ds-filtros__normal, .ds-filtros__selecao { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; min-width: 0; }
.ds-filtros__normal.hidden, .ds-filtros__selecao.hidden { display: none; }
.ds-filtros__selecao-texto { font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-filtros__divisor { width: var(--ds-borda); align-self: stretch; margin: 2px 4px; background: var(--ds-color-border); }
.ds-filtros__pag { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }

/* Busca expansível: .ds-busca > [botão .ds-icon-action] + .ds-busca__caixa(.hidden) > __icone + input.ds-input.ds-busca__input + __limpar */
.ds-busca { position: relative; display: inline-flex; align-items: center; }
.ds-busca__caixa { position: relative; display: flex; align-items: center; }
.ds-busca__caixa.hidden { display: none; }
.ds-busca__icone {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: var(--ds-icon-lg); color: var(--ds-color-text-muted); pointer-events: none;
}
/* mesma altura e arredondamento das pílulas de filtro (.ds-filtro__btn) */
.ds-busca__input { width: 220px; max-width: 60vw; height: 36px; padding-left: 42px; padding-right: 38px; border-radius: var(--ds-r-pill); }
.ds-busca__limpar {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  background: none; border: none; border-radius: var(--ds-r-md); color: var(--ds-color-text-muted);
}
.ds-busca__limpar.hidden { display: none; }
.ds-busca__limpar:hover { background: var(--ds-sidebar-item-hover); color: var(--ds-color-text); }
.ds-busca__limpar .material-symbols-outlined { font-size: var(--ds-icon-md); }

/* Filtro de lista suspensa: .ds-filtro > button.ds-filtro__btn(--ativo) [ícone + rótulo + expand_more] + button.ds-filtro__x(.hidden).
   O botão abre abrirMenuSelecao(gatilho, grupos) — itens com check reservado e, quando houver, bolinha de cor (dot). */
.ds-filtro { display: inline-flex; align-items: stretch; }
.ds-filtro__btn {
  display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px;
  background: var(--ds-color-surface); border: var(--ds-borda) solid var(--ds-color-border); border-radius: var(--ds-r-pill);
  color: var(--ds-color-text); font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
  cursor: pointer; white-space: nowrap;
}
.ds-filtro__btn:hover { background: var(--ds-sidebar-item-hover); }
.ds-filtro__btn .material-symbols-outlined { font-size: var(--ds-icon-md); color: var(--ds-color-text-muted); }
.ds-filtro__btn--ativo { background: var(--ds-color-info-bg); color: var(--ds-color-info-fg); border-color: var(--ds-color-info-bg); font-weight: var(--ds-weight-semibold); }
.ds-filtro__btn--ativo .material-symbols-outlined { color: var(--ds-color-info-fg); }
.ds-filtro__btn:has(+ .ds-filtro__x:not(.hidden)) {
  border-top-right-radius: 0; border-bottom-right-radius: 0; border-right-color: color-mix(in srgb, var(--ds-color-info-fg) 30%, transparent);
}
.ds-filtro__x {
  display: inline-flex; align-items: center; justify-content: center; width: 26px; padding: 0; cursor: pointer;
  background: var(--ds-color-info-bg); color: var(--ds-color-info-fg);
  border: var(--ds-borda) solid var(--ds-color-info-bg); border-left-color: color-mix(in srgb, var(--ds-color-info-fg) 30%, transparent);
  border-top-right-radius: var(--ds-r-pill); border-bottom-right-radius: var(--ds-r-pill);
}
.ds-filtro__x.hidden { display: none; }
.ds-filtro__x:hover { filter: brightness(0.94); }
.ds-filtro__x .material-symbols-outlined { font-size: var(--ds-icon-sm); }

/* Ação em texto (ex.: "Limpar filtros"): botão com cara de link */
.ds-link {
  background: none; border: none; padding: 6px 4px; color: var(--ds-color-action); font-family: var(--ds-font-sans);
  font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); cursor: pointer; white-space: nowrap;
}
.ds-link:hover { text-decoration: underline; }
.ds-link.hidden { display: none; }

/* Paginador compacto da barra de filtros: __contador "1–20 de 84" + __nav (‹ .ds-icon-action--sm, __atual, ›) */
.ds-paginador { display: inline-flex; align-items: center; gap: 8px; }
.ds-paginador__contador { font-size: var(--ds-text-sm); color: var(--ds-color-text-muted); white-space: nowrap; }
.ds-paginador__nav { display: inline-flex; align-items: center; gap: 2px; }
.ds-paginador__atual { min-width: 20px; text-align: center; font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.ds-paginador .ds-icon-action:disabled { opacity: 0.4; cursor: not-allowed; }
/* Paginador de rodapé (versão 2, base da tabela dentro do plano): esquerda "Exibir N", centro "a–b de n", direita ‹ [página] ›. uiPaginadorRodapeHTML / uiPaginarLista. */
.ds-paginador-rodape { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--ds-space-3); padding: var(--ds-space-3) var(--ds-space-4); border-top: 1px solid var(--ds-color-border); font-size: var(--ds-text-sm); color: var(--ds-color-text-muted); }
.ds-paginador-rodape__esq, .ds-paginador-rodape__centro, .ds-paginador-rodape__dir { display: flex; align-items: center; gap: var(--ds-space-2); }
.ds-paginador-rodape__esq { justify-self: start; }
.ds-paginador-rodape__centro { justify-self: center; white-space: nowrap; }
.ds-paginador-rodape__dir { justify-self: end; }
.ds-paginador-rodape .ds-select { width: auto; min-width: 56px; min-height: 32px; padding: var(--ds-space-1) var(--ds-space-2); font-size: var(--ds-text-sm); text-align: center; }
.ds-paginador-rodape .ds-icon-action:disabled { opacity: 0.4; cursor: not-allowed; }
@media (max-width: 768px) {
  .ds-paginador-rodape { grid-template-columns: 1fr; justify-items: center; }
  .ds-paginador-rodape__esq, .ds-paginador-rodape__dir { justify-self: center; }
}

/* Responsável: pastilha com o nome (nomeRespExibicao) e, se houver mais, "+N" em .ds-resp-mais */
.ds-resp { background: var(--ds-color-surface-2); color: var(--ds-color-text); font-weight: var(--ds-weight-medium); }
.ds-resp { min-width: 0; max-width: 100%; }
.ds-resp > :not(.material-symbols-outlined) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ds-resp .material-symbols-outlined { flex-shrink: 0; }
.ds-resp .material-symbols-outlined { font-size: var(--ds-icon-xs); }
.ds-resp-mais { color: var(--ds-color-text-muted); font-weight: var(--ds-weight-semibold); font-size: var(--ds-text-xs); }

/* Progresso: .ds-progresso > .ds-kpi-track > .ds-kpi-fill (style="width:N%", valor calculado) + .ds-progresso__valor "N%" */
.ds-progresso { display: flex; align-items: center; gap: 10px; }
.ds-progresso .ds-kpi-track { width: 72px; flex: none; }
.ds-progresso__valor { min-width: 34px; font-size: var(--ds-text-xs); font-weight: var(--ds-weight-bold); color: var(--ds-color-text-muted); }

/* Botão dividido (ação principal + seta que abre o menu das demais, via acoesLinhaMenu): .ds-split > .ds-btn.ds-split__principal + .ds-btn.ds-split__seta */
.ds-split { display: inline-flex; }
.ds-split .ds-btn { border-radius: 0; min-height: 40px; }
.ds-split .ds-split__principal { border-radius: var(--ds-r-sm) 0 0 var(--ds-r-sm); padding: 0 18px; white-space: nowrap; }
.ds-split .ds-split__seta { border-radius: 0 var(--ds-r-sm) var(--ds-r-sm) 0; padding: 0 8px; min-width: 40px; border-left: var(--ds-borda) solid color-mix(in srgb, var(--ds-color-on-action) 35%, transparent); }
.ds-split .ds-split__principal.hidden + .ds-split__seta { border-radius: var(--ds-r-sm); border-left: 0; }

/* Mobile (padrão Gmail/Drive): a busca fica sempre aberta e ocupa a linha (uiBuscaAbrir/uiBuscaRecolher, app_ui_utils.html); os filtros são pílulas
   que abrem o bottom sheet do próprio filtro (abrirMenuSelecao no mobile) e mostram o valor escolhido; limpar um filtro é no × da própria pílula (ou no "Limpar" do sheet); sem "Limpar filtros" geral. */
@media (max-width: 768px) {
  .ds-filtros { flex-wrap: wrap; }
  .ds-filtros__normal, .ds-filtros__selecao { min-height: var(--ds-pagina-filtros-linha); }   /* mesma altura: trocar a busca pela faixa de seleção não move a lista */
  .ds-filtros__normal { row-gap: var(--ds-space-2); }
  .ds-filtros__normal > .ds-busca { flex: 1 1 100%; }
  /* a busca vive na barra do topo (uiTopoBuscar); a barra de filtros só aparece com pílulas à vista ou em seleção, senão some inteira */
  .ds-filtros__normal > .ds-busca { display: none; }
  #topbar[data-buscando] > :not(.ds-topbar-busca) { display: none !important; }
  /* em página com abas o título é o nome da aba ativa (botão com seta de lista suspensa) e substitui a trilha; os ícones ficam à direita */
  #topbar-crumbs { flex: 0 3 auto; }
  #topbar > :last-child { margin-left: auto; }
  #topbar[data-abas] > #topbar-crumbs { display: none; }
  .ds-topbar-status__ponto { display: block; width: 14px; height: 14px; padding: 0; border-radius: var(--ds-r-pill); background: currentColor; }   /* a cor é a da fonte do .ds-badge--<tom> */
  .ds-topbar-aba { display: flex; align-items: center; gap: var(--ds-space-1); flex: 0 1 auto; min-width: 0; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit; font-size: var(--ds-text-lg); font-weight: var(--ds-weight-bold); color: var(--ds-color-text); white-space: nowrap; }
  .ds-topbar-aba.hidden { display: none; }
  .ds-topbar-aba .material-symbols-outlined { flex: none; font-size: var(--ds-icon-md); color: var(--ds-color-text-muted); }
  .ds-topbar-aba__prefixo { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; color: var(--ds-color-text-muted); font-weight: var(--ds-weight-semibold); }
  .ds-topbar-aba__prefixo:empty { display: none; }
  .ds-topbar-aba__txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #tb-buscar[data-ativo] { color: var(--ds-color-action); }

  /* seleção: a faixa de ações toma o lugar da barra do topo (nada desce nem sobe). A barra de filtros mantém o espaço que já ocupava (pílulas invisíveis) ou, se não havia, fica sem altura. */
  .ds-filtros__selecao:not(.hidden) { position: fixed; top: 0; left: 0; right: 0; z-index: calc(var(--ds-z-header) + 1); height: var(--ds-header-height); flex-wrap: nowrap; padding: 0 var(--ds-space-3); background: var(--ds-color-surface); border-bottom: var(--ds-borda) solid var(--ds-color-border); }

  .ds-filtros:has(.ds-filtros__selecao:not(.hidden)) > .ds-filtros__normal.hidden { display: flex !important; visibility: hidden; }

/* ===================== MENUS SUSPENSOS E AÇÕES DE LINHA (canônicos; script em components_acoes_linha.html) =====================
   .acoes-linha/.acoes-btn: ações de linha + ⋮ (acoesLinhaHTML). .acoes-menu: o ÚNICO popover do sistema — menu de ações
   (acoesLinhaMenu) e lista suspensa de seleção com check e bolinha de cor (abrirMenuSelecao). */
.acoes-linha { display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; flex-shrink: 0; }
/* Lista em tabela — o que toda lista compartilha. Coluna de ações: ícones SEMPRE à direita da célula (a ação de linha sozinha na célula ocupa a largura toda;
   senão o inline-flex fica à esquerda), sem borda nenhuma nos ícones (regra abaixo), com o cabeçalho (.ds-th-acoes: atualizar, exportar, imprimir, ordenar) alinhado igual. Cabeçalho ordenável: .ds-th-ord +
   .ds-th-ord__icone (seta). Linha que abre ao clicar: .ds-linha-clicavel. Alerta de atraso: .ds-alerta-atraso (ícone solto, nunca dentro de badge). */
td > .acoes-linha:only-child { display: flex; }
.ds-col-acoes { width: 208px; white-space: nowrap; text-align: right; }
@media (max-width: 768px) { .ds-col-acoes { width: 48px; } }
.ds-th-acoes { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
/* Ícone na coluna de ações (cabeçalho ou célula) é SEMPRE sem borda, fundo e sombra — igual ao .acoes-btn; só o hover destaca. */
.ds-col-acoes .ds-icon-action, .ds-th-acoes .ds-icon-action, .ds-th-ferramentas .ds-icon-action { width: 28px; height: 28px; background: none; border-color: transparent; box-shadow: none; color: var(--ds-color-text-muted); }
.ds-col-acoes .ds-icon-action:hover, .ds-th-acoes .ds-icon-action:hover, .ds-th-ferramentas .ds-icon-action:hover { background: var(--ds-sidebar-item-hover); border-color: transparent; box-shadow: none; color: var(--ds-color-action); }
/* Ações sobrepostas (sem coluna própria): a ÚLTIMA informação da linha dá lugar às ações no hover/foco — ação principal, secundária e ⋮ (acoesLinhaHTML).
   Célula: .ds-col-sobreposta (<col>/<th>) > .ds-celula-sobreposta > .ds-celula-sobreposta__info (o dado) + .ds-celula-sobreposta__acoes (acoesLinhaHTML). O hover vale só para a linha (tr) da própria célula, também em tabela dentro de linha expandida.
   Sem hover (celular/tablet): o dado fica visível e só o ⋮ aparece; o menu lista todas as ações. */
.ds-col-sobreposta { width: 176px; white-space: nowrap; text-align: right; }
.ds-celula-sobreposta { display: grid; justify-items: end; align-items: center; min-height: 32px; }
.ds-celula-sobreposta > * { grid-area: 1 / 1; transition: opacity var(--ds-duration-fast) var(--ds-ease-standard), visibility var(--ds-duration-fast) var(--ds-ease-standard); }
.ds-celula-sobreposta__acoes { opacity: 0; visibility: hidden; position: relative; z-index: 1; }
tr:hover > td > .ds-celula-sobreposta > .ds-celula-sobreposta__info, tr:focus-within > td > .ds-celula-sobreposta > .ds-celula-sobreposta__info, .ds-celula-sobreposta:has([aria-expanded="true"]) .ds-celula-sobreposta__info { opacity: 0; pointer-events: none; }
tr:hover > td > .ds-celula-sobreposta > .ds-celula-sobreposta__acoes, tr:focus-within > td > .ds-celula-sobreposta > .ds-celula-sobreposta__acoes, .ds-celula-sobreposta__acoes:has([aria-expanded="true"]) { opacity: 1; visibility: visible; }
@media (hover: none), (max-width: 768px) {
  .ds-celula-sobreposta { display: flex; justify-content: flex-end; align-items: center; gap: var(--ds-space-2); }
  tr .ds-celula-sobreposta .ds-celula-sobreposta__info { opacity: 1; }
  tr .ds-celula-sobreposta .ds-celula-sobreposta__acoes { opacity: 1; visibility: visible; }
  .ds-celula-sobreposta .acoes-direto { display: none; }
  .ds-celula-sobreposta .acoes-so-mobile { display: inline-flex; }
}
/* Ferramentas da tabela no cabeçalho da última coluna: só o ícone de ordenar fica visível; ao clicar, os demais surgem da direita para a esquerda. */
.ds-th-ferramentas { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: var(--ds-space-1); }
.ds-th-ferramentas__rotulo { margin-right: auto; transition: opacity var(--ds-duration-base) var(--ds-ease-standard); }
.ds-th-ferramentas.is-aberto .ds-th-ferramentas__rotulo { opacity: 0; pointer-events: none; }
.ds-th-ferramentas__extras { position: absolute; right: calc(28px + var(--ds-space-1)); top: 50%; transform: translateY(-50%); display: flex; gap: var(--ds-space-1); padding: var(--ds-space-1); background: var(--ds-color-surface); border-radius: var(--ds-r-sm); clip-path: inset(0 0 0 100%); visibility: hidden; transition: clip-path var(--ds-duration-base) var(--ds-ease-standard), visibility 0s linear var(--ds-duration-base); }
.ds-th-ferramentas.is-aberto .ds-th-ferramentas__extras { clip-path: inset(0); visibility: visible; transition-delay: 0s; z-index: 2; }
/* Impressão: ferramentas e ações somem; o dado da última coluna fica. */
@media print {
  .ds-th-ferramentas__extras, .ds-th-ferramentas > .ds-icon-action, .ds-celula-sobreposta__acoes { display: none !important; }

}
.ds-th-ord { cursor: pointer; user-select: none; white-space: nowrap; }

/* Subtabela: tabela ou faixa aninhada numa linha expandida. O cabeçalho (.ds-subtabela__cab, ou th) é menor que o da tabela principal (hierarquia visual) */
.ds-subtabela { border: var(--ds-borda) solid var(--ds-color-border); border-radius: var(--ds-r-xl); overflow: hidden; }

.ds-subtabela__cab, .ds-subtabela th { height: var(--ds-subtabela-cab-altura); padding: 0 12px; font-size: var(--ds-subtabela-cab-fonte); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text-muted); text-transform: none; }
.ds-subtabela :is(th, td) { position: static; border: 0 solid var(--ds-glass-border); border-width: 0 var(--ds-borda) var(--ds-borda) 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<!-- Seletor de tema (claro, escuro, alto contraste) das telas de acesso e da página pública de dados abertos: abas em pílula do design
     system. Aplica o tema como o cabeçalho (data-ds-theme no <html> + body.high-contrast) e guarda em localStorage['sgp_tema'],
     a mesma chave que o sistema lê. Se o cabeçalho já existe, avisa-o (aplicarTema) para o ícone dele acompanhar. -->
<script>
var SeletorTema = (function () {
  var TEMAS = [['light', 'Claro'], ['dark', 'Escuro'], ['contrast', 'Alto contraste']];
  function salvo() {
    var t = 'light';
    try { t = localStorage.getItem('sgp_tema'); } catch (e) { /* sem localStorage: claro */ }
    return TEMAS.some(function (x) { return x[0] === t; }) ? t : 'light';
  }
  function atual() {
    if (document.body && document.body.classList.contains('high-contrast')) return 'contrast';
    return document.documentElement.getAttribute('data-ds-theme') === 'dark' ? 'dark' : 'light';
  }
  function aplicar(tema) {
    if (tema === 'light') document.documentElement.removeAttribute('data-ds-theme'); else document.documentElement.setAttribute('data-ds-theme', 'dark');
    if (document.body) document.body.classList.toggle('high-contrast', tema === 'contrast');
    try { localStorage.setItem('sgp_tema', tema); } catch (e) { /* só vale nesta página */ }
    if (typeof window.aplicarTema === 'function') window.aplicarTema(tema);
  }
  /** Só a página pública (sem cabeçalho): o alto contraste vive no <body>, que não existia quando o <head> aplicou o tema. */
  function iniciar() {
    document.addEventListener('DOMContentLoaded', function () { if (salvo() === 'contrast') document.body.classList.add('high-contrast'); });
  }
  function criar() {
    var grupo = document.createElement('div');
    grupo.className = 'ds-tabs ds-tabs--segmented'; grupo.setAttribute('role', 'group'); grupo.setAttribute('aria-label', 'Tema da tela');
    var botoes = TEMAS.map(function (x) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ds-tab-btn'; b.textContent = x[1];
      b.addEventListener('click', function () { aplicar(x[0]); marcar(); });
      grupo.appendChild(b);
      return b;
    });
    function marcar() {
      var t = atual();
      botoes.forEach(function (b, i) { var ativo = TEMAS[i][0] === t; b.classList.toggle('active', ativo); b.setAttribute('aria-pressed', ativo); });
    }
    marcar();
    document.addEventListener('DOMContentLoaded', marcar); // o corpo pode ter ganhado o alto contraste depois
    return grupo;
  }
  return { criar: criar, iniciar: iniciar };
})();
</script>
