<!-- ================================================================
     APP RISCOS (Fase 3B — Arquitetura de Abas Plugáveis)
     Injetado dinamicamente em #riscos-conteudo via apiObterHtmlApp('riscos')
     Mantém estado próprio e comunica com o host via _riscosSDK
     ================================================================ -->
<!-- ================================================================
     MODAIS DO APP RISCOS (data-app-portal="1" -> movidos para document.body)
     ================================================================ -->

<!-- MODAL DE RISCO — wizard com trilha lateral -->
<div id="modal-risco" class="modal-overlay hidden" data-app-portal="1" data-fechar="fecharModalRisco" data-on-click="risco.1">
  <div class="modal-card modal-card--lg" role="dialog" aria-modal="true" aria-labelledby="modal-risco-titulo">

    <button class="btn-icon-close" data-on-click="risco.2" data-title="Fechar" aria-label="Fechar">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="ds-wizard">
      <aside class="ds-wizard__trilha">
        <div class="ds-wizard__cabecalho">
          <span class="ds-wizard__contexto" id="rwiz-eyebrow">&nbsp;</span>
          <h3 class="ds-wizard__titulo" id="modal-risco-titulo">Novo risco</h3>
        </div>

        <div class="ds-wizard__etapas" id="rwiz-rail-lista"><!-- injetado via JS: _rwizRenderRail() --></div>

        <div class="ds-wizard__andamento">
          <div class="ds-wizard__barra"><span class="ds-wizard__barra-preenchimento" id="rwiz-rail-fill"></span></div>
          <span id="rwiz-rail-contador">Etapa 1 de 4</span>
        </div>
      </aside>

      <div class="ds-wizard__corpo">
        <div class="wizard-steps-viewport">
        <form id="form-risco" data-on-submit="risco.3" novalidate>
          <input type="hidden" id="risco-id-edicao">
          <input type="hidden" id="risco-ultima-alteracao">
          <input type="hidden" id="risco-id-elemento">

          <!-- ETAPA 1: IDENTIFICAÇÃO -->
          <div class="wizard-step" data-step="1" id="wizard-risco-step-1">
            <h2 class="ds-wizard__titulo-etapa">Identificação</h2>

            <!-- vínculo já definido (modal aberto a partir de um elemento): no lugar do seletor de elemento -->
            <div id="msg-contexto-elem-risco" class="ds-wizard__aviso ds-wizard__aviso--corpo hidden">
              <span class="material-symbols-outlined">subdirectory_arrow_right</span>
              <span>Analisado em <strong id="lbl-elem-risco"></strong></span>
            </div>

            <div class="ds-field" id="group-risco-objeto">
              <div id="risco-selelem"></div>
            </div>

            <div class="ds-field">
              <label class="ds-label" for="risco-descricao">Descrição do risco / evento <span class="ds-obrig">obrigatório</span></label>
              <textarea id="risco-descricao" class="ds-textarea" rows="3" required minlength="10" maxlength="500"
                        placeholder="Que evento pode impactar o objetivo? Ex: indisponibilidade dos sistemas durante a migração."
                        data-on-input="risco.5"></textarea>
              <small class="ds-contador"></small>
              <small class="ds-help ds-help--error hidden" id="risco-descricao-erro"></small>
            </div>

            <div class="ds-field">
              <label class="ds-label">Natureza do risco <span class="ds-obrig">obrigatório</span></label>
              <div class="risco-nat-chips" id="risco-nat-chips"></div>
              <small class="ds-help ds-help--error hidden" id="risco-nat-erro"></small>
            </div>
          </div>

          <!-- ETAPA 2: CAUSAS E CONSEQUÊNCIAS (ao menos um par) -->
          <div class="wizard-step hidden" data-step="2" id="wizard-risco-step-2">
            <h2 class="ds-wizard__titulo-etapa">Causas e consequências <span class="ds-obrig">obrigatório</span></h2>

            <div class="ds-form-linha">
              <div class="ds-field" style="margin-bottom:0">
                <input type="text" id="risco-causa-input" class="ds-input" maxlength="500" placeholder="Causa..."
                       data-on-keydown="risco.6">
                <small class="ds-contador"></small>
              </div>
              <div class="ds-field" style="margin-bottom:0">
                <input type="text" id="risco-consequencia-input" class="ds-input" maxlength="500" placeholder="Consequência correspondente..."
                       data-on-keydown="risco.6">
                <small class="ds-contador"></small>
              </div>
            </div>
            <button type="button" class="ds-btn ds-btn--ghost ds-btn--sm" style="margin:8px 0 12px" data-on-click="risco.7">
              <span class="material-symbols-outlined icon-sm">add</span> Inserir par
            </button>
            <div id="risco-causas-lista" class="risco-causas-lista"></div>
            <small class="ds-help ds-help--error hidden" id="risco-causas-erro"></small>
          </div>

          <!-- ETAPA 3: AVALIAÇÃO -->
          <div class="wizard-step hidden" data-step="3" id="wizard-risco-step-3">
            <h2 class="ds-wizard__titulo-etapa">Avaliação</h2>

            <div class="ds-form-linha">
              <div class="ds-field">
                <label class="ds-label" for="risco-probabilidade">Probabilidade <span class="ds-obrig">obrigatório</span></label>
                <select id="risco-probabilidade" class="ds-select" required data-on-change="risco.8">
                  <option value="" disabled selected>Selecione...</option>
                  <option value="Muito Baixa">Muito Baixa (peso 1)</option>
                  <option value="Baixa">Baixa (peso 2)</option>
                  <option value="Média">Média (peso 5)</option>
                  <option value="Alta">Alta (peso 8)</option>
                  <option value="Muito Alta">Muito Alta (peso 10)</option>
                </select>
                <small class="ds-help ds-help--error hidden" id="risco-probabilidade-erro"></small>
              </div>
              <div class="ds-field">
                <label class="ds-label" for="risco-impacto">Impacto <span class="ds-obrig">obrigatório</span></label>
                <select id="risco-impacto" class="ds-select" required data-on-change="risco.8">
                  <option value="" disabled selected>Selecione...</option>
                  <option value="Muito Baixo">Muito Baixo (peso 1)</option>
                  <option value="Baixo">Baixo (peso 2)</option>
                  <option value="Médio">Médio (peso 5)</option>
                  <option value="Alto">Alto (peso 8)</option>
                  <option value="Muito Alto">Muito Alto (peso 10)</option>
                </select>
                <small class="ds-help ds-help--error hidden" id="risco-impacto-erro"></small>
              </div>
            </div>

            <div class="ds-field">
              <label class="ds-label">Nível de risco</label>
              <div id="risco-nivel-preview" class="rwiz-nivel-preview">—</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 4px">
              <span style="font-size:0.72rem;padding:2px 8px;border-radius:10px;background: var(--ds-color-success-bg);color: var(--ds-color-success-fg);font-weight:600">RB — Baixo (0–9)</span>
              <span style="font-size:0.72rem;padding:2px 8px;border-radius:10px;background: var(--ds-color-warning-bg);color: var(--ds-color-warning-fg);font-weight:600">RM — Médio (10–39)</span>
              <span style="font-size:0.72rem;padding:2px 8px;border-radius:10px;background: var(--ds-risk-alto-bg);color: var(--ds-risk-alto-fg);font-weight:600">RA — Alto (40–79)</span>
              <span style="font-size:0.72rem;padding:2px 8px;border-radius:10px;background: var(--ds-color-danger-bg);color: var(--ds-color-danger-fg);font-weight:600">RE — Extremo (80–100)</span>
            </div>

            <!-- Apetite ao Risco -->
            <div id="risco-apetite-banner" class="risco-apetite-banner">
              <span class="material-symbols-outlined" id="risco-apetite-icone">info</span>
              <span id="risco-apetite-texto">Selecione a probabilidade e o impacto.</span>
            </div>
          </div>

          <!-- ETAPA 4: RESPONSÁVEIS -->
          <div class="wizard-step hidden" data-step="4" id="wizard-risco-step-4">
            <h2 class="ds-wizard__titulo-etapa">Responsáveis</h2>
            <div id="risco-selresp"></div>
            <small class="ds-help ds-help--error hidden" id="risco-resp-erro"></small>
          </div>
        </form>
        </div><!-- /.wizard-steps-viewport -->

        <div class="ds-wizard__rodape">
          <button type="button" class="ds-btn ds-btn--ghost" data-on-click="risco.2">Cancelar</button>
          <div class="ds-wizard__rodape-dir">
          <button type="button" class="ds-btn ds-btn--ghost hidden" id="btn-risco-voltar" data-on-click="risco.9">
            <span class="material-symbols-outlined icon">arrow_back</span> Voltar
          </button>
          <button type="button" class="ds-btn ds-btn--primary" id="btn-risco-proximo" data-on-click="risco.10">
            Continuar <span class="material-symbols-outlined icon">arrow_forward</span>
          </button>
          <button type="submit" form="form-risco" class="ds-btn ds-btn--primary hidden" id="btn-risco-salvar">
            <span class="material-symbols-outlined icon">save</span> Salvar risco
          </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL: AÇÃO DE TRATAMENTO -->
<div id="modal-tratamento-form" class="modal-overlay hidden" data-app-portal="1" data-fechar="fecharModalTratamentoForm" data-on-click="risco.11">
  <div class="modal-card" style="max-width:560px">
    <div class="modal-header">
      <div>
        <h3 id="modal-trat-form-titulo">Nova Ação de Tratamento</h3>
        <p id="modal-trat-form-risco-desc" style="font-size:0.82rem;color:var(--ds-color-text-muted);margin:2px 0 0;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p>
      </div>
      <button class="btn-icon-close" data-on-click="risco.12">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body">
      <form id="form-tratamento" data-on-submit="risco.13">
        <input type="hidden" id="trat-id-edicao">
        <input type="hidden" id="trat-id-risco">

        <div class="form-group" style="margin-bottom:10px">
          <label style="font-size:0.82rem;font-weight:600">Ação de Tratamento *</label>
          <input type="text" id="trat-acao" class="form-control" maxlength="500" placeholder="Descreva a ação...">
          <small class="ds-contador"></small>
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label style="font-size:0.82rem;font-weight:600">Detalhamento</label>
          <textarea id="trat-descricao" class="form-control" rows="2" maxlength="500" placeholder="Detalhes adicionais..."></textarea>
          <small class="ds-contador"></small>
        </div>
        <div class="form-row" style="margin-bottom:10px">
          <div class="form-group" style="flex:1;margin-bottom:0">
            <label style="font-size:0.82rem;font-weight:600">Periodicidade *</label>
            <select id="trat-periodicidade" class="form-control" data-on-change="risco.14">
              <option value="" disabled selected>Selecione...</option>
              <option value="Pontual">Pontual (ação única)</option>
              <option value="Mensal">Mensal</option>
              <option value="Bimestral">Bimestral</option>
              <option value="Trimestral">Trimestral</option>
              <option value="Semestral">Semestral</option>
              <option value="Anual">Anual</option>
              <option value="Personalizada">Personalizada</option>
            </select>
          </div>
          <div class="form-group hidden" id="trat-intervalo-wrap" style="flex:1;margin-bottom:0">
            <label style="font-size:0.82rem;font-weight:600">A cada</label>
            <div style="display:flex;gap:6px">
              <input type="number" min="1" id="trat-intervalo-qtd" class="form-control" placeholder="Nº" style="max-width:70px">
              <select id="trat-intervalo-unidade" class="form-control">
                <option value="Dias">Dias</option>
                <option value="Semanas">Semanas</option>
                <option value="Meses">Meses</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="flex:1;margin-bottom:0">
            <label style="font-size:0.82rem;font-weight:600">Data de Referência *
              <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;cursor:help;color:var(--ds-color-text-muted)" data-title="Data a partir da qual a periodicidade é contada (base para calcular os próximos lembretes). Se a periodicidade for 'Pontual', esta é a data-limite da ação.">info</span>
            </label>
            <input type="date" id="trat-data-referencia" class="form-control">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:10px">
          <label style="font-size:0.82rem;font-weight:600">Vincular a uma Causa (opcional)</label>
          <select id="trat-causa-vinculo" class="form-control">
            <option value="">Geral (risco como um todo)</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:0">
          <div id="trat-selresp"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" data-on-click="risco.12">Cancelar</button>
      <button type="submit" form="form-tratamento" class="btn btn-primary">
        <span class="material-symbols-outlined icon">save</span> <span id="trat-form-botao-texto">Salvar</span>
      </button>
    </div>
  </div>
</div>

<!-- ================================================================
     ESTILOS DO APP RISCOS
     ================================================================ -->
<style>
/* Modal de Risco: usa o assistente canônico (.ds-wizard); aqui só o que é próprio dele. */
.rwiz-nivel-preview {
  padding: 8px 12px; border-radius: var(--ds-r-md); font-weight: 700; font-size: 1rem; text-align: center;
  background: var(--ds-color-surface-2); color: var(--ds-color-text-muted); border: 1px solid var(--ds-color-border);
  min-height: 38px; display: flex; align-items: center; justify-content: center;
}

.trat-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  border: 1px solid var(--ds-color-border); border-radius: 6px; margin-bottom: 5px; background: var(--ds-color-surface);
}
.trat-item:last-child { margin-bottom: 0; }
.trat-acao { font-weight: 600; color: var(--ds-color-text); font-size: 0.84rem; white-space: nowrap; }
.trat-desc { font-size: 0.78rem; color: var(--ds-color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.trat-meta { font-size: 0.74rem; color: var(--ds-color-text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .trat-desc { max-width: 100%; white-space: normal; }
}

.risco-causas-lista { max-height: 220px; overflow-y: auto; }
.risco-causa-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--ds-color-border); border-radius: var(--ds-r-md); margin-bottom: 6px;
  background: var(--ds-color-surface); color: var(--ds-color-text); font-size: 0.82rem;
}
.risco-causa-num {
  width: 20px; height: 20px; border-radius: 50%; background: var(--ds-color-action); color: var(--ds-color-on-action);
  display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.risco-causa-item .risco-causa-vazio { color: var(--ds-color-text-muted); font-style: italic; }

.risco-nat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.risco-nat-chip {
  padding: 6px 12px; border-radius: var(--ds-r-pill); border: 1px solid var(--ds-color-border);
  background: var(--ds-color-surface); color: var(--ds-color-text); font-size: 0.82rem; cursor: pointer; transition: all 0.15s;
}
.risco-nat-chip:hover { background: var(--ds-sidebar-item-hover); }
.risco-nat-chip.active { background: var(--ds-color-action); border-color: var(--ds-color-action); color: var(--ds-color-on-action); font-weight: 600; }
body.high-contrast .risco-nat-chip.active { background: #000; border-color: #fff; color: #fff; }

.risco-apetite-banner {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--ds-r-lg);
  font-size: 0.85rem; margin-top: 10px; background: var(--ds-color-surface-2); color: var(--ds-color-text-muted); border: 1px solid var(--ds-color-border);
}
.risco-apetite-banner.dentro { background: var(--ds-color-success-bg); color: var(--ds-color-success-fg); border-color: transparent; }
.risco-apetite-banner.fora   { background: var(--ds-color-danger-bg); color: var(--ds-color-danger-fg); border-color: transparent; }

/* ── UI RISCOS (Matriz 5×5 + "Por nível" + Filtros + Tabela) ─── */
.rsc-topo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 16px; margin-bottom: 16px; }
.rsc-card {
  border-radius: var(--ds-r-2xl); padding: 20px; min-width: 0;
  background: var(--ds-color-surface); border: 1px solid var(--ds-color-border); box-shadow: none !important;
}
.rsc-card h3 { font-size: var(--ds-text-md); font-weight: var(--ds-weight-bold); color: var(--ds-color-text); margin: 0; }
.rsc-card-sub { font-size: var(--ds-text-sm); color: var(--ds-color-text-muted); margin: 2px 0 14px; }

/* Matriz */
.rsc-matriz-wrap { display: flex; gap: 8px; align-items: stretch; }
.rsc-eixo-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; font-weight: var(--ds-weight-bold); letter-spacing: .6px; color: var(--ds-color-text-muted); }
.rsc-matriz { flex: 1; min-width: 0; display: grid; grid-template-columns: 84px repeat(5, minmax(0, 1fr)); gap: 4px; }
.rsc-eixo-l { display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); }
.rsc-eixo-c { text-align: center; font-size: var(--ds-text-xs); color: var(--ds-color-text-muted); padding-top: 4px; }
.rsc-eixo-x { text-align: center; font-size: 11px; font-weight: var(--ds-weight-bold); letter-spacing: .6px; color: var(--ds-color-text-muted); margin-top: 6px; }
.rsc-cel {
  --rsc-cor: var(--ds-color-success-fg);
  min-height: 42px; border: 2px solid transparent; border-radius: var(--ds-r-md); cursor: pointer;
  background: color-mix(in srgb, var(--rsc-cor) 13%, var(--ds-color-surface));
  color: var(--rsc-cor); font-family: var(--ds-font-sans); font-size: var(--ds-text-base); font-weight: var(--ds-weight-bold);
  transition: transform var(--ds-duration-fast) var(--ds-ease-standard), border-color var(--ds-duration-fast) var(--ds-ease-standard);
}
.rsc-cel--RM { --rsc-cor: var(--ds-color-warning-fg); }
.rsc-cel--RA { --rsc-cor: var(--ds-risk-alto-fg); }
.rsc-cel--RE { --rsc-cor: var(--ds-color-danger-fg); }
.rsc-cel:hover { border-color: color-mix(in srgb, var(--rsc-cor) 55%, transparent); }
.rsc-cel.is-sel { border-color: var(--ds-color-action); box-shadow: var(--ds-shadow-focus); }

/* Por nível */
.rsc-niveis { display: flex; flex-direction: column; gap: 6px; }
.rsc-nivel-linha {
  display: grid; grid-template-columns: 78px minmax(0, 1fr) 28px; align-items: center; gap: 12px; width: 100%;
  padding: 6px 8px; border: 1px solid transparent; border-radius: var(--ds-r-lg); background: none; cursor: pointer;
  font-family: var(--ds-font-sans);
}
.rsc-nivel-linha:hover { background: var(--ds-sidebar-item-hover); }
.rsc-nivel-linha.is-sel { border-color: var(--ds-color-action); background: var(--ds-sidebar-item-active); }
.rsc-barra { height: 6px; border-radius: var(--ds-r-pill); background: var(--ds-sidebar-item-hover); overflow: hidden; }
.rsc-barra-fill { display: block; height: 100%; border-radius: var(--ds-r-pill); }
.rsc-nivel-n { text-align: right; font-size: var(--ds-text-base); font-weight: var(--ds-weight-semibold); color: var(--ds-color-text); }
.rsc-alerta {
  display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; border-radius: var(--ds-r-lg);
  font-size: var(--ds-text-sm); background: var(--ds-color-warning-bg); color: var(--ds-color-warning-fg);
}
.rsc-alerta--ok { background: var(--ds-color-success-bg); color: var(--ds-color-success-fg); }
.rsc-alerta .material-symbols-outlined { font-size: 18px; }

.elementos-filtros .ds-select { width: auto; min-width: 140px; }
.det-modos { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--ds-r-lg); background: var(--ds-color-surface-2); border: 1px solid var(--ds-glass-border); }
.det-modo {
  position: relative; width: 38px; height: 34px; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: var(--ds-r-md); color: var(--ds-color-text-muted);
}
.det-modo:hover { color: var(--ds-color-text); }
.det-modo.ativo { background: var(--ds-color-surface); color: var(--ds-primary-700); box-shadow: var(--ds-shadow-1); }
[data-ds-theme="dark"] .det-modo.ativo { color: var(--ds-color-action); }
.det-modo .material-symbols-outlined { font-size: 20px; }
.det-dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ds-color-warning-fg); }

.det-split { display: inline-flex; }
.det-split .ds-btn { border-radius: 0; min-height: 40px; }
.det-split .det-split-main { border-radius: var(--ds-r-sm) 0 0 var(--ds-r-sm); padding: 0 18px; }
.det-split .det-split-seta { border-radius: 0 var(--ds-r-sm) var(--ds-r-sm) 0; padding: 0 8px; min-width: 40px; border-left: 1px solid rgba(255,255,255,.35); }
.det-split .det-split-main.hidden + .det-split-seta { border-radius: var(--ds-r-sm); border-left: 0; }

/* ── RISCOS: tabela (reaproveita .el-tabela) ─────────────────── */
.rsc-tabela col.rsc-col-risco,  .rsc-tabela .rsc-col-risco  { width: auto; max-width: 0; overflow: hidden; }

function handleSalvarTratamento(e) {
  e.preventDefault();
  var acao = document.getElementById('trat-acao').value.trim();
  if (!acao) { if (typeof showMessage === 'function') showMessage('error', 'Atenção', 'Descreva a ação de tratamento.'); return; }
  var periodicidade = document.getElementById('trat-periodicidade').value;
  if (!periodicidade) { if (typeof showMessage === 'function') showMessage('error', 'Atenção', 'Selecione a periodicidade.'); return; }
  var dataReferencia = document.getElementById('trat-data-referencia').value;
  if (!dataReferencia) { if (typeof showMessage === 'function') showMessage('error', 'Atenção', 'Informe a data de referência.'); return; }
  var respsTrat = seletorRespTrat ? seletorRespTrat.getLista() : [];
  if (_rscRespObrigatorio && respsTrat.length === 0) { if (typeof showMessage === 'function') showMessage('error', 'Atenção', 'Adicione ao menos um responsável.'); return; }

  var idEdicao = document.getElementById('trat-id-edicao').value;
  var causaSel = document.getElementById('trat-causa-vinculo');
  var dados = {
    id:               idEdicao || undefined,
    idRisco:          document.getElementById('trat-id-risco').value,
    acao:             acao,
    descricao:        document.getElementById('trat-descricao').value.trim(),
    periodicidade:    periodicidade,
    intervaloQtd:     document.getElementById('trat-intervalo-qtd').value,
    intervaloUnidade: document.getElementById('trat-intervalo-unidade').value,
    dataReferencia:   dataReferencia,
    idCausa:          causaSel.value,
    responsaveis:     respsTrat.map(function(r) { return { id: r.id, tipo: r.tipo, nome: r.nome }; })
  };

  if (typeof mostrarLoader === 'function') mostrarLoader();
  _riscosSDK.chamar('apiSalvarTratamento', dados).then(function() {
    if (typeof esconderLoader === 'function') esconderLoader();
    fecharModalTratamentoForm();
    if (typeof showMessage === 'function') {
      showMessage('success', idEdicao ? 'Atualizado' : 'Adicionado',
        idEdicao ? 'Ação de tratamento atualizada.' : 'Ação de tratamento adicionada.');
    }
    _riscosRecarregarLista();
  }, function(err) {
    if (typeof esconderLoader === 'function') esconderLoader();
    if (typeof showMessage === 'function') showMessage('error', 'Erro', escapeHtml(err.message || String(err)));
  });
}

// Grava o par digitado na linha expandida (novo, ou edição quando vem idCausa). Só com os dois campos preenchidos; o servidor confere de novo.
function riscosGravarCausa(idRisco, idCausa) {
  var id = String(idRisco), chave = _riscoChaveRasc(id, idCausa);
  var d = estadoRiscos.rascunhos[chave] || {};
  var causa = (d.causa || '').trim(), consequencia = (d.consequencia || '').trim();
  if (!causa || !consequencia) return;
  var sel = idCausa ? '[data-novo="' + id + '"][data-edita="' + idCausa + '"]' : _riscoSeletorNovo(id);
  var btn = document.querySelector(sel + ' [data-rsc-gravar]');
  if (btn) btn.disabled = true;
  var chamada = idCausa
    ? _riscosSDK.chamar('apiAtualizarCausaConsequencia', id, String(idCausa), causa, consequencia)
    : _riscosSDK.chamar('apiAdicionarCausaConsequencia', id, causa, consequencia);
  chamada.then(function(res) {
    var risco = _riscoPorId(id);
    if (risco && res && res.causasConsequencias) risco.causasConsequencias = res.causasConsequencias;
    delete estadoRiscos.rascunhos[chave];
    _riscosRenderCorpo();
    _riscosRefrescarPainel(id);
    if (!idCausa) riscosNovaCausa(id);
  }, function(err) {
    if (btn) btn.disabled = false;
    if (typeof showMessage === 'function') showMessage('error', 'Erro', escapeHtml(err.message || String(err)));
  });
}

// aoFim (opcional): roda quando a carga termina (ex.: abrir o modal a partir de outra aba, que precisa dos dados do plano).
function carregarRiscos(aoFim) {
  var idPlano = _rscObterIdPlano();
  if (!idPlano) { if (aoFim) showMessage('error', 'Riscos', 'Os dados do plano ainda não foram carregados. Tente de novo em instantes.'); return; }
  if (aoFim) _rscAoCarregar.push(aoFim);
  if (_rscCarregando) return;
  _rscCarregando = true;

  renderizarSecaoRiscos();
  var tbody = document.getElementById('riscos-lista');
  if (tbody && typeof spinnerListaHTML === 'function') {
    tbody.innerHTML = '<tr class="el-linha-msg"><td colspan="7">' + spinnerListaHTML() + '</td></tr>';
  }

  _riscosSDK.chamar('apiGetAbaRiscos', idPlano).then(function(res) {
    if (!_rscCtx || String(_rscCtx.idPlano) !== String(idPlano)) return; // resposta de um plano já abandonado
    _rscCarregando = false;
    _rscCarregado = true;
    _riscosCache = (res && res.riscos) || [];
    _rscRespObrigatorio = !!(res && res.configRiscos && res.configRiscos.respObrigatorio);
    _rscLimites = (res && res.configRiscos) || {};
    _elementosResumoCache = (res && res.elementosResumo) || [];
    estadoRiscos.expandidos = {};
    _rscAtualizarContador();
    renderizarSecaoRiscos();
    var fila = _rscAoCarregar; _rscAoCarregar = [];
    fila.forEach(function(f) { f(); });
    if (estadoRiscos.painelId) {
      var rp = _riscoPorId(estadoRiscos.painelId);
      if (rp) _riscosRenderPainel(rp); else _riscosSDK.fecharPainel();
    }
  }, function(err) {
    if (!_rscCtx || String(_rscCtx.idPlano) !== String(idPlano)) return;
    _rscCarregando = false;
    if (_rscAoCarregar.length) showMessage('error', 'Riscos', (err && err.message) || 'Não foi possível carregar os riscos do plano.');
    _rscAoCarregar = [];
    var el = document.getElementById('riscos-lista');
    if (el) {
      el.innerHTML = '<tr class="el-linha-msg"><td colspan="7"><div class="el-empty-state"><p style="color:var(--ds-color-danger)">' + escapeHtml(err.message || String(err)) + '</p></div></td></tr>';
    }
  });
}

function _rscAtualizarContador() {
  var total = _riscosCache.length;
  var criticosSemTrat = _riscosCache.filter(function(r) {
    var isCritico = r.nivelRisco === 'RE' || r.nivelRisco === 'RA';
    return isCritico && !(r.tratamentos && r.tratamentos.length);
  }).length;
  _riscosSDK.reportarContagem(total); // total de riscos (neutro)
  _riscosSDK.reportarAlerta(criticosSemTrat, criticosSemTrat + (criticosSemTrat === 1 ? ' risco de alta severidade sem ação de tratamento' : ' riscos de alta severidade sem ação de tratamento'));
}

function riscosExcluirSelecionados() {
  var ids = Object.keys(estadoRiscos.selecionados);
  if (!ids.length) return;
  if (typeof showConfirm !== 'function') return;
  showConfirm('Excluir riscos?', 'Deseja excluir ' + ids.length + (ids.length === 1 ? ' risco' : ' riscos') + ' e suas causas e ações? Esta ação não pode ser desfeita.', function() {
    if (typeof mostrarLoader === 'function') mostrarLoader();
    var pendentes = ids.length, erros = [];
    ids.forEach(function(id) {
      _riscosSDK.chamar('apiExcluirRisco', id).then(function() {
        pendentes--;
        if (pendentes === 0) concluir();
      }, function(err) {
        erros.push(err.message || String(err));
        pendentes--;
        if (pendentes === 0) concluir();
      });
    });
    function concluir() {
      if (typeof esconderLoader === 'function') esconderLoader();
      estadoRiscos.selecionados = {};
      if (erros.length && typeof showMessage === 'function') showMessage('error', 'Alguns riscos não foram excluídos', escapeHtml(erros[0]));
      else if (typeof showMessage === 'function') showMessage('success', 'Excluídos', 'Riscos excluídos com sucesso.');
      _riscosRecarregarLista();
    }
  });
}

      { icone: 'delete', rotulo: 'Excluir causa/consequência', onclick: "riscosExcluirCausa('" + jid + "','" + jpid + "')", principal: true, perigo: true, oculto: pares.length < 2 }
    ]) : '';
    return '<div class="detp-causa-card">'
      + '<div class="detp-trat-item"><div class="detp-trat-corpo">'
      +   '<div class="detp-risco-campo"><span class="detp-risco-rot">Causa</span><span class="detp-causa-txt">' + escapeHtml(p.causa || '—') + '</span></div>'
      +   '<div class="detp-risco-campo"><span class="detp-risco-rot">Consequência</span><span class="detp-causa-txt">' + escapeHtml(p.consequencia || '—') + '</span></div>'
      + '</div>' + acoesPar + '</div>'

            ? doGrupo.map(function(t) { return _riscoTratItemHTML(t, idj, podeEditar); }).join('')
            : '<div class="detp-trat-vazio"><span class="material-symbols-outlined">error</span>Sem ação de tratamento</div>')
      +   (podeEditar ? '<button type="button" class="rsc-link" data-on-click="risco.54" data-aclick0="' + idj + '" data-aclick1="' + escapeHtml(String(p.id)) + '"><span class="material-symbols-outlined">add</span>Ação de tratamento</button>' : '')
      + '</div></div>';
  }).join('');
  var gerais = trats.filter(function(t) { return !t.idCausa || !ids[String(t.idCausa)]; });
  if (gerais.length) {
    cards += '<div class="detp-causa-card"><span class="detp-risco-rot">Ações gerais</span>'
      + gerais.map(function(t) { return _riscoTratItemHTML(t, idj, podeEditar); }).join('') + '</div>';
  }
  if (!cards) cards = '<p class="detp-texto-bloco" style="color:var(--ds-color-text-muted)">Nenhuma causa ou ação cadastrada.</p>';

  var painelHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin:-4px -4px 14px 0">'
    +   '<span class="ds-tabs-painel__item active" style="pointer-events:none">Detalhes do risco</span>'
    +   '<button type="button" class="ds-icon-action ds-icon-action--sm" data-on-click="risco.55" data-title="Fechar" aria-label="Fechar painel de detalhes"><span class="material-symbols-outlined">close</span></button>'
    + '</div>'
    + '<div class="detp-secao">'
    +   '<h3 class="detp-risco-titulo">' + escapeHtml(r.risco || '') + '</h3>'
    +   '<div class="detp-risco-vinculo"><span class="material-symbols-outlined"' + (r.tipoRisco === 'GERAL' || !r.objetoAnalisado ? '' : ' data-ico="elemento"') + '>' + (r.tipoRisco === 'GERAL' || !r.objetoAnalisado ? 'flag' : 'category') + '</span>' + escapeHtml(_riscoVinculoTxt(r)) + '</div>'

    +     '<div class="detp-risco-campo"><span class="detp-risco-rot">Impacto</span><span class="detp-risco-val">' + escapeHtml(r.impacto || '—') + '</span></div>'

    +     (podeEditar ? '<button type="button" class="ds-icon-action ds-icon-action--sm" data-on-click="risco.53" data-aclick0="' + idj + '" data-title="Adicionar causa/consequência" aria-label="Adicionar causa/consequência"><span class="material-symbols-outlined">add</span></button>' : '')

function _riscosRecarregarLista() {

// Seletor único do elemento analisado (busca + lista; o item escolhido aparece no próprio campo).
function _opcoesElementosRisco() {
  var cores = (typeof dadosDetalhados !== 'undefined' && dadosDetalhados && dadosDetalhados.coresTipo) || {};
  return (_elementosResumoCache || []).slice().sort(function(a, b) {
    return typeof compararCodigos === 'function' ? compararCodigos(a.codigo, b.codigo) : 0;
  }).map(function(e) { return { id: e.id, titulo: e.titulo, codigo: e.codigo, tipo: e.tipo, cor: cores[e.tipo] || '' }; });

function _popularElementosRisco(idElementoSelecionado) {
  if (!document.getElementById('risco-selelem')) return;
  if (!seletorElemRisco) {
    seletorElemRisco = SeletorLista.criar({
      containerId: 'risco-selelem', semGrupos: true, filtrosTipo: true, unico: true,
      getOpcoes: _opcoesElementosRisco,
      getLimite: function() { return null; },
      onChange: _rwizSelecionarObjeto,
      textos: {
        rotulo: 'Objeto analisado', icone: 'category', obrigatorio: true, ajuda: '',
        placeholder: 'Selecione o elemento', vazio: 'Nenhum elemento neste plano.', vazioBusca: ' neste plano',
        chipsAria: 'Elemento analisado', telaTitulo: 'Objeto analisado', telaBusca: 'Buscar elementos deste plano', remover: 'Remover '
      }
    });
  }
  seletorElemRisco.limpar();
  var op = _opcoesElementosRisco().filter(function(o) { return String(o.id) === String(idElementoSelecionado); });
  if (op.length) seletorElemRisco.setLista(op);
}

function adicionarCausaConsequenciaRisco() {

// Hierarquia e autocomplete de responsáveis pelo Risco
function _processarHierarquiaUnidadeRisco(lista) {
  var mapa = {}, raizesGlobais = [];
  lista.forEach(function(u) { u.children = []; mapa[u.id] = u; });
  lista.forEach(function(u) {
    if (u.id === u.idPai) u.idPai = null;
    if (u.idPai && mapa[u.idPai]) mapa[u.idPai].children.push(u);
    else raizesGlobais.push(u);
  });
  return { mapa: mapa, raizesGlobais: raizesGlobais };
}
function _unidadesContextoPermitidoRisco(cacheUnidadesLocal) {
  var planoObj = _rscCtx && _rscCtx.plano;
  if (!planoObj || planoObj.tipoResponsavel !== 'UNIDADE') {
    return cacheUnidadesLocal;
  }
  var idUnidadePlano = String(planoObj.idUnidade).trim();
  var h = _processarHierarquiaUnidadeRisco(cacheUnidadesLocal);
  if (h.mapa[idUnidadePlano]) return _achatarArvoreRisco(h.mapa[idUnidadePlano]);
  var listaPermitida = [];
  h.raizesGlobais.forEach(function(no) { listaPermitida = listaPermitida.concat(_achatarArvoreRisco(no)); });
  return listaPermitida;
}

function _unidadesContextoPermitidoTrat(cacheUnidadesLocal) {
  var risco = (typeof _riscoPorId === 'function') ? _riscoPorId(_tratFormIdRisco) : null;
  var herdados = (risco && risco.responsaveis) || [];
  var unidadesHerdadas = herdados.filter(function(r) { return r.tipo === 'UNIDADE'; }).map(function(r) { return r.id; });
  var usuariosHerdados = herdados.filter(function(r) { return r.tipo === 'USER'; }).map(function(r) { return r.id; });
  if (unidadesHerdadas.length === 0 && usuariosHerdados.length === 0) {
    return _unidadesContextoPermitidoRisco(cacheUnidadesLocal);
  }
  if (unidadesHerdadas.length === 0) return [];
  var h = _processarHierarquiaUnidadeRisco(cacheUnidadesLocal);
  var vistos = {};
  var listaPermitida = [];
  unidadesHerdadas.forEach(function(idUnidade) {
    if (h.mapa[idUnidade]) {
      _achatarArvoreRisco(h.mapa[idUnidade]).forEach(function(no) {
        if (!vistos[no.id]) { vistos[no.id] = true; listaPermitida.push(no); }
      });
    }
  });
  return listaPermitida;
}

function _usuariosExclusivosContextoTrat() {
  var risco = (typeof _riscoPorId === 'function') ? _riscoPorId(_tratFormIdRisco) : null;
  var herdados = (risco && risco.responsaveis) || [];
  return herdados.filter(function(r) { return r.tipo === 'USER'; }).map(function(r) { return String(r.id); });
}

// Campos de causa/consequência da linha expandida: o de "adicionar" (data-novo) e o de edição de um par existente (data-novo + data-edita).
// O rascunho de cada um fica em estadoRiscos.rascunhos (chave = id do risco, ou id:idCausa na edição) e sobrevive aos re-renders.
function _riscoChaveRasc(idRisco, idCausa) { return String(idRisco) + (idCausa ? ':' + idCausa : ''); }
function _riscoNovoEl(el) { return el.closest('[data-novo]'); }
function _riscoSeletorNovo(id) { return '[data-novo="' + String(id) + '"]:not([data-edita])'; }

// Foca o campo "Adicionar causa" da linha expandida do risco (expande a linha se preciso).
function riscosNovaCausa(id) {

  var campo = document.querySelector(_riscoSeletorNovo(k) + ' [data-rsc-causa]');
  if (campo) { campo.focus(); campo.scrollIntoView({ block: 'nearest' }); }
}

// Abre a edição do par na própria linha, com os textos atuais.
function riscosEditarCausa(idRisco, idCausa) {
  var r = _riscoPorId(idRisco), p = r && (r.causasConsequencias || []).filter(function(x) { return String(x.id) === String(idCausa); })[0];
  if (!p) return;
  estadoRiscos.rascunhos[_riscoChaveRasc(idRisco, idCausa)] = { causa: p.causa || '', consequencia: p.consequencia || '', etapa: 2 };
  estadoRiscos.expandidos[String(idRisco)] = true; // a edição é na linha expandida (também quando vem do painel lateral)
  _riscosRenderCorpo();
  var campo = document.querySelector('[data-novo="' + String(idRisco) + '"][data-edita="' + String(idCausa) + '"] [data-rsc-causa]');
  if (campo) { campo.scrollIntoView({ block: 'nearest' }); campo.focus(); campo.select(); }
}

function riscosCancelarEdicaoCausa(idRisco, idCausa) {
  delete estadoRiscos.rascunhos[_riscoChaveRasc(idRisco, idCausa)];
  _riscosRenderCorpo();
}

// Pede confirmação (a exclusão leva as ações de tratamento da causa) e exclui o par.
function riscosExcluirCausa(idRisco, idCausa) {
  var r = _riscoPorId(idRisco), p = r && (r.causasConsequencias || []).filter(function(x) { return String(x.id) === String(idCausa); })[0];
  if (!p) return;
  var n = (r.tratamentos || []).filter(function(t) { return String(t.idCausa) === String(idCausa); }).length;
  var aviso = n ? (n === 1 ? ' A <strong>1 ação</strong> de tratamento ligada a ela também será excluída.' : ' As <strong>' + n + ' ações</strong> de tratamento ligadas a ela também serão excluídas.') : '';
  showConfirm('Excluir causa/consequência?', 'Deseja excluir a causa <strong>' + escapeHtml(p.causa || '') + '</strong>?' + aviso, function() {
    _riscosSDK.chamar('apiExcluirCausaConsequencia', String(idRisco), String(idCausa)).then(function(res) {
      r.causasConsequencias = res.causasConsequencias;
      r.tratamentos = (r.tratamentos || []).filter(function(t) { return (res.idsTratamentosExcluidos || []).indexOf(String(t.id)) === -1; });
      delete estadoRiscos.rascunhos[_riscoChaveRasc(idRisco, idCausa)];
      _riscosRenderCorpo();
      _riscosRefrescarPainel(idRisco);
    }, function(err) {
      if (typeof showMessage === 'function') showMessage('error', 'Erro', escapeHtml(err.message || String(err)));
    });
  });
}

// Mostra o campo da consequência (e o gravar) depois que a causa foi digitada.
function _riscoAbrirEtapaConsequencia(novo) {
  var chave = _riscoChaveRasc(novo.dataset.novo, novo.dataset.edita);
  var d = estadoRiscos.rascunhos[chave] || (estadoRiscos.rascunhos[chave] = {});
  d.etapa = 2;
  novo.querySelector('[data-rsc-etapa2]').classList.remove('hidden');
  novo.querySelector('[data-rsc-cons]').focus();
}

function riscosRascunhoDigitado(campo) {
  var novo = _riscoNovoEl(campo), chave = _riscoChaveRasc(novo.dataset.novo, novo.dataset.edita);
  var d = estadoRiscos.rascunhos[chave] || (estadoRiscos.rascunhos[chave] = {});
  d.causa = novo.querySelector('[data-rsc-causa]').value;
  d.consequencia = novo.querySelector('[data-rsc-cons]').value;
  novo.querySelector('[data-rsc-gravar]').disabled = !(d.causa.trim() && d.consequencia.trim());
}

// Causa: Enter ou Tab (com a causa preenchida) abre a consequência; Esc limpa/cancela e recomeça.
function riscosCausaTecla(ev, campo) {
  var novo = _riscoNovoEl(campo);
  if (ev.key === 'Escape') { riscosCancelarEdicaoCausa(novo.dataset.novo, novo.dataset.edita); return; }
  if (ev.isComposing || !campo.value.trim()) return;
  if (ev.key === 'Enter' || (ev.key === 'Tab' && !ev.shiftKey && novo.querySelector('[data-rsc-etapa2]').classList.contains('hidden'))) {
    ev.preventDefault();
    _riscoAbrirEtapaConsequencia(novo);
  }
}

// Consequência: Enter com os dois campos preenchidos grava; Esc limpa/cancela e recomeça.
function riscosConsTecla(ev, campo) {
  var novo = _riscoNovoEl(campo);
  if (ev.key === 'Escape') { riscosCancelarEdicaoCausa(novo.dataset.novo, novo.dataset.edita); return; }
  if (ev.isComposing || ev.key !== 'Enter') return;
  ev.preventDefault();
  if (novo.querySelector('[data-rsc-causa]').value.trim() && campo.value.trim()) riscosGravarCausa(novo.dataset.novo, novo.dataset.edita);
}

    +     '<button class="btn-pag" data-on-click="risco.44" data-title="Próximo" aria-label="Próxima página"><span class="material-symbols-outlined">chevron_right</span></button>'
    +   '</div>'
    + '</div>';

  var selSize = document.getElementById('riscos-pag-size');
  if (selSize) selSize.value = String(estadoRiscos.itensPorPagina);
  _riscosSyncBarra();
  _riscosRenderCorpo();
}

function _riscosRenderMatriz() {
  var el = document.getElementById('riscos-matriz');
  if (!el) return;
  var cont = {};
  var listaMatriz = _riscosBaseSem(['filtroProb', 'filtroImp']);
  listaMatriz.forEach(function(r) { var k = (r.probabilidade || '') + '|' + (r.impacto || ''); cont[k] = (cont[k] || 0) + 1; });
  var html = '';
  for (var pi = 4; pi >= 0; pi--) {
    html += '<div class="rsc-eixo-l">' + _RISCO_PROBS[pi] + '</div>';
    for (var ii = 0; ii < 5; ii++) {
      var n = cont[_RISCO_PROBS[pi] + '|' + _RISCO_IMPS[ii]] || 0;
      var nivel = _riscoNivelCelula(_RISCO_PESOS[pi], _RISCO_PESOS[ii]);
      var sel = estadoRiscos.filtroProb === _RISCO_PROBS[pi] && estadoRiscos.filtroImp === _RISCO_IMPS[ii];
      var desc = 'Probabilidade ' + _RISCO_PROBS[pi] + ', impacto ' + _RISCO_IMPS[ii] + ': ' + n + ' risco' + (n === 1 ? '' : 's');
      html += '<button type="button" class="rsc-cel rsc-cel--' + nivel + (sel ? ' is-sel' : '') + '" aria-pressed="' + sel + '"'
        + ' aria-label="' + desc + '" data-title="' + desc + '" data-on-click="risco.45" data-rclick0="' + pi + '" data-rclick1="' + ii + '">' + (n || '') + '</button>';
    }
  }
  html += '<div></div>' + _RISCO_IMPS.map(function(l) { return '<div class="rsc-eixo-c">' + l + '</div>'; }).join('');
  el.innerHTML = html;
}

function _riscosRenderNiveis() {
  var el = document.getElementById('riscos-niveis');
  if (!el) return;
  var lista = _riscosBaseSem(['filtroNivel']);
  var cont = { RB: 0, RM: 0, RA: 0, RE: 0 };
  lista.forEach(function(r) { if (cont[r.nivelRisco] !== undefined) cont[r.nivelRisco]++; });
  var total = lista.length;
  el.innerHTML = ['RE', 'RA', 'RM', 'RB'].map(function(n) {
    var c = _CORES_NIVEL_DET[n];
    var pct = total ? (cont[n] / total) * 100 : 0;
    var sel = estadoRiscos.filtroNivel === n;
    return '<button type="button" class="rsc-nivel-linha' + (sel ? ' is-sel' : '') + '" aria-pressed="' + sel + '" data-on-click="risco.46" data-aclick0="' + n + '">'
      + '<span class="ds-badge" style="background:' + c.bg + ';color:' + c.text + '">' + _RISCO_NIVEL_ROTULO[n] + '</span>'
      + '<span class="rsc-barra"><span class="rsc-barra-fill" style="width:' + pct.toFixed(0) + '%;background:' + c.text + '"></span></span>'
      + '<span class="rsc-nivel-n">' + cont[n] + '</span></button>';
  }).join('');
  var sub = document.getElementById('riscos-niveis-sub');
  if (sub) sub.textContent = total + ' risco' + (total === 1 ? '' : 's') + ' no escopo' + (total === 1 ? '' : 's');
  var fora = lista.filter(function(r) { return r.apetiteRisco ? r.apetiteRisco === 'Não' : (r.nivelRisco === 'RA' || r.nivelRisco === 'RE'); }).length;
  var al = document.getElementById('riscos-alerta');
  if (al) {
    al.innerHTML = !total ? ''
      : fora > 0
        ? '<div class="rsc-alerta"><span class="material-symbols-outlined">info</span><span><strong>' + fora + '</strong> fora do apetite ao risco</span></div>'
        : '<div class="rsc-alerta rsc-alerta--ok"><span class="material-symbols-outlined">check_circle</span><span>Todos dentro do apetite ao risco</span></div>';
  }
}

// Risco que exige tratamento (fora do apetite) e ainda não tem nenhuma ação: a única situação que pinta a linha e põe o botão "Definir tratamento".
function _riscoPendente(r) {
  var isFora = r.apetiteRisco ? r.apetiteRisco === 'Não' : (r.nivelRisco === 'RA' || r.nivelRisco === 'RE');
  return isFora && (r.tratamentos || []).length === 0;
}

// Ações de UM risco, na ordem de prioridade: a mesma na linha (hover e ⋮) e na barra de seleção. No risco pendente, "Definir tratamento" vem primeiro.
function _riscoItensAcao(r, podeEditar) {
  var idj = escapeHtml(String(r.id)), pend = podeEditar && _riscoPendente(r);
  var itens = [];
  if (pend) itens.push({ icone: 'build', rotulo: 'Definir tratamento', onclick: "riscosNovaAcaoTratamento('" + idj + "')", principal: true });
  itens.push(
    { icone: 'right_panel_open', rotulo: 'Detalhes', onclick: "riscosAbrirPainel('" + idj + "')", principal: true },
    { icone: 'edit', rotulo: 'Editar risco', onclick: "editarRisco('" + idj + "')", principal: true, oculto: !podeEditar },
    { icone: 'playlist_add', rotulo: 'Adicionar causa/consequência', onclick: "riscosNovaCausa('" + idj + "')", oculto: !podeEditar }
  );
  if (!pend) itens.push({ icone: 'build', rotulo: 'Adicionar ação de tratamento', onclick: "riscosNovaAcaoTratamento('" + idj + "')", oculto: !podeEditar });
  itens.push(
    { icone: 'download', rotulo: 'Exportar', desabilitado: true },
    { icone: 'delete', rotulo: 'Excluir risco', onclick: "confirmarExclusaoRisco('" + idj + "','" + escapeJsAttr(r.risco) + "')", perigo: true, oculto: !podeEditar }
  );
  return itens;
}

// Campos de causa → consequência: "adicionar" (idCausa vazio; abaixo da tabela, solto) ou editar um par existente (idCausa preenchido; no lugar da linha da tabela, com ✓ e ✕).
function _riscoCamposCausaHTML(idj, idCausa, rasc) {
  var edita = !!idCausa, completo = (rasc.causa || '').trim() && (rasc.consequencia || '').trim();
  var ac = edita ? ' data-aclick1="' + idCausa + '"' : '';
  var campoCausa = '<input type="text"' + (edita ? ' class="ds-input"' : '') + ' data-rsc-causa maxlength="500" placeholder="' + (edita ? 'Causa' : 'Adicionar causa') + '" value="' + escapeHtml(rasc.causa || '') + '" data-on-keydown="risco.56" data-on-input="risco.58" aria-label="Causa">';
  var campoCons = '<input type="text"' + (edita ? ' class="ds-input"' : '') + ' data-rsc-cons maxlength="500" placeholder="Consequência" value="' + escapeHtml(rasc.consequencia || '') + '" data-on-keydown="risco.57" data-on-input="risco.58" aria-label="Consequência">';
  var gravar = '<button type="button" class="ds-icon-action ds-icon-action--sm" data-rsc-gravar data-on-click="risco.59" data-aclick0="' + idj + '"' + ac + ' data-title="Gravar" aria-label="Gravar causa/consequência"' + (completo ? '' : ' disabled') + '><span class="material-symbols-outlined">check</span></button>';
  if (edita) {

      + '<td class="ds-col-sobreposta">' + gravar + '<button type="button" class="ds-icon-action ds-icon-action--sm" data-on-click="risco.62" data-aclick0="' + idj + '"' + ac + ' data-title="Cancelar" aria-label="Cancelar edição"><span class="material-symbols-outlined">close</span></button></td></tr>';
  }
  return '<div class="rsc-causa-linha" data-novo="' + idj + '">'
    + '<label><span class="material-symbols-outlined" aria-hidden="true">add</span>' + campoCausa + '</label>'
    + '<span data-rsc-etapa2' + (rasc.etapa === 2 ? '' : ' class="hidden"') + '>'
    +   '<span class="material-symbols-outlined rsc-causa-seta" aria-hidden="true">arrow_right_alt</span>'
    +   '<label>' + campoCons + '</label>' + gravar
    +   '<button type="button" class="ds-icon-action ds-icon-action--sm" data-on-click="risco.62" data-aclick0="' + idj + '" data-title="Limpar" aria-label="Limpar causa e consequência"><span class="material-symbols-outlined">close</span></button>'
    + '</span></div>';
}

function _riscoLinhaHTML(r, podeEditar) {
  var id = String(r.id), idj = escapeHtml(id);
  var c = _CORES_NIVEL_DET[r.nivelRisco] || { bg: 'var(--ds-color-surface-2)', text: 'var(--ds-color-text-muted)' };
  var aberto = !!estadoRiscos.expandidos[id];
  var sel = !!estadoRiscos.selecionados[id];
  var ativo = estadoRiscos.painelId === id;
  var cob = _riscoCobertura(r);
  var isPendente = _riscoPendente(r);

  // Triângulo: o risco já tem tratamento, mas ainda há causa sem ação (no pendente, o botão principal já diz o que falta)
  var alerta = '';
  if (!isPendente && cob.descobertas > 0) {
    alerta = '<span class="material-symbols-outlined rsc-alerta-ico" data-title="' + cob.descobertas + (cob.descobertas === 1 ? ' causa ainda sem ação de tratamento' : ' causas ainda sem ação de tratamento') + '">warning</span>';
  }

  var resps = r.responsaveis || [];
  var respHtml = '—';
  if (resps.length) {
    var p0 = resps[0];
    var primeiro = typeof nomeRespExibicao === 'function' ? nomeRespExibicao(p0.nome, p0.tipo) : p0.nome;
    var nAdic = resps.length - 1;
    var respTitle = nAdic > 0
      ? 'Principal: ' + primeiro + ' | Adicionais: ' + resps.slice(1).map(function(x) { return typeof nomeRespExibicao === 'function' ? nomeRespExibicao(x.nome, x.tipo) : x.nome; }).join(', ')
      : (p0.nome !== primeiro ? p0.nome : '');
    var ico = p0.tipo === 'USER' ? 'person' : 'apartment';
    respHtml = '<span class="ds-resp"' + (respTitle ? ' data-title="' + escapeHtml(respTitle) + '"' : '') + '>'
      + '<span class="material-symbols-outlined">' + ico + '</span>'
      + '<span>' + escapeHtml(primeiro || 'Não definido') + '</span>'
      + (nAdic > 0 ? ' <span class="ds-resp-mais">+' + nAdic + '</span>' : '')
      + '</span>';
  }
  var pi = (r.probabilidade || '—') + ' × ' + String(r.impacto || '—').toLowerCase();
  var piTit = 'Probabilidade ' + String(r.probabilidade || '—').toLowerCase() + ', impacto ' + String(r.impacto || '—').toLowerCase();

  var nivelKey = String(r.nivelRisco || 'RM').toLowerCase();
  var nivelBtnCls = 'ds-btn--pendencia-' + nivelKey;
  var itens = _riscoItensAcao(r, podeEditar);
  var celulaAcoes;
  if (isPendente && podeEditar) {
    // situação específica (sem o padrão do hover): o botão principal fica sempre visível e o resto vai no ⋮
    celulaAcoes = '<td class="ds-col-sobreposta rsc-col-acoes"><div class="rsc-decisao">'
      + '<button type="button" class="ds-btn ' + nivelBtnCls + ' ds-btn--sm rsc-btn-proativo" ' + uiAtributosAcao('event.stopPropagation(); ' + itens[0].onclick) + ' aria-label="Definir tratamento">'
      + '<span class="material-symbols-outlined">add</span><span>Definir tratamento</span></button>'
      + acoesLinhaHTML('risco-' + idj, itens.slice(1), { maxDireto: 0 }) + '</div></td>';
  } else {
    celulaAcoes = '<td class="ds-col-sobreposta rsc-col-acoes"><div class="ds-celula-sobreposta"><div class="ds-celula-sobreposta__info"><span class="rsc-pi" data-title="' + escapeHtml(piTit) + '">' + escapeHtml(pi) + '</span></div>'
      + '<div class="ds-celula-sobreposta__acoes">' + acoesLinhaHTML('risco-' + idj, itens, { maxDireto: 2 }) + '</div></div></td>';
  }

  var cls = 'ds-linha-lista rsc-linha'
    + (isPendente ? ' is-pendente-tratamento is-nivel-' + nivelKey : '')
    + (aberto ? ' is-open' : '') + (sel ? ' selecionada' : '') + (ativo ? ' rsc-ativa' : '');

  var html = '<tr class="' + cls + '" data-id="' + idj + '" aria-expanded="' + aberto + '"'
    + ' data-on-click="risco.47" data-aclick0="' + idj + '" data-on-dblclick="risco.48" data-adblclick0="' + idj + '">'
    + '<td class="el-col-check"><input type="checkbox"' + (sel ? ' checked' : '') + ' data-on-click="risco.49" data-on-change="risco.50" data-achange0="' + idj + '" aria-label="Selecionar risco"></td>'
    + '<td class="el-col-expand"><button type="button" class="el-toggle-btn' + (aberto ? ' expanded' : '') + '" data-on-click="risco.51" data-aclick0="' + idj + '" aria-label="' + (aberto ? 'Recolher' : 'Expandir') + '"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button></td>'
    + '<td class="rsc-col-risco"><div class="rsc-titulo-cel"><span class="rsc-titulo" data-title="' + escapeHtml(r.risco) + '">' + escapeHtml(r.risco) + '</span>' + alerta + '</div></td>'
    + '<td class="rsc-col-nivel"><span class="ds-badge" style="background:' + c.bg + ';color:' + c.text + '">' + escapeHtml(_RISCO_NIVEL_ROTULO[r.nivelRisco] || '—') + '</span></td>'
    + '<td class="rsc-col-resp">' + respHtml + '</td>'
    + celulaAcoes
    + '</tr>';

  if (aberto) {
    var temVarios = (r.causasConsequencias || []).length > 1;
    var linhasPares = (r.causasConsequencias || []).map(function(p) {
      var n = cob.porCausa[String(p.id)] || 0;
      var pid = escapeHtml(String(p.id));
      var edit = estadoRiscos.rascunhos[_riscoChaveRasc(id, p.id)];
      if (edit && podeEditar) return _riscoCamposCausaHTML(idj, pid, edit);
      var jid = escapeJsAttr(id), jpid = escapeJsAttr(String(p.id));
      var acoes = podeEditar ? acoesLinhaHTML('causa-' + idj + '-' + pid, [
        { icone: 'build', rotulo: 'Adicionar ação de tratamento', onclick: "riscosNovaAcaoTratamento('" + jid + "','" + jpid + "')" },
        { icone: 'edit', rotulo: 'Editar causa/consequência', onclick: "riscosEditarCausa('" + jid + "','" + jpid + "')" },
        { icone: 'delete', rotulo: 'Excluir causa/consequência', onclick: "riscosExcluirCausa('" + jid + "','" + jpid + "')", cor: 'var(--ds-color-danger-fg)', oculto: !temVarios }
      ], { maxDireto: 3 }) : '';
      return '<tr class="ds-linha-clicavel" data-on-click="risco.52" data-aclick0="' + idj + '">'
        + '<td' + ((p.causa || '').length > 40 ? ' data-title="' + escapeHtml(p.causa) + '"' : '') + '>' + escapeHtml(p.causa || '—') + '</td>'
        + '<td' + ((p.consequencia || '').length > 40 ? ' data-title="' + escapeHtml(p.consequencia) + '"' : '') + '>' + escapeHtml(p.consequencia || '—') + '</td>'
        + '<td class="ds-col-sobreposta"><div class="ds-celula-sobreposta"><div class="ds-celula-sobreposta__info"><span class="rsc-causa-n' + (n ? '' : ' is-sem') + '">' + (n ? n + (n === 1 ? ' ação' : ' ações') : 'Sem ação') + '</span></div>'
        +   '<div class="ds-celula-sobreposta__acoes">' + acoes + '</div></div></td></tr>';
    }).join('');
    var tabela = linhasPares
      ? '<div class="ds-subtabela"><table><colgroup><col><col><col></colgroup>'
        + '<thead><tr><th>Causa</th><th>Consequência</th><th>Ação</th></tr></thead><tbody>' + linhasPares + '</tbody></table></div>'
      : '';
    var novo = podeEditar ? _riscoCamposCausaHTML(idj, '', estadoRiscos.rascunhos[id] || {}) : (linhasPares ? '' : '<div class="rsc-vinculo">Nenhuma causa cadastrada.</div>');
    html += '<tr class="rsc-det' + (sel ? ' selecionada' : '') + (ativo ? ' rsc-ativa' : '') + '"><td colspan="6">'
      + tabela + novo
      + '</td></tr>';
  }
  return html;
}

function _riscosRenderCorpo() {
  var listaEl = document.getElementById('riscos-lista');
  if (!listaEl) return;

  var podeEditar = _rscPodeEditar();
  _riscosRenderMatriz();
  _riscosRenderNiveis();
  _riscosSyncBarra();

  if (!_rscCarregado) {
    if (typeof spinnerListaHTML === 'function') listaEl.innerHTML = '<tr class="el-linha-msg"><td colspan="6">' + spinnerListaHTML() + '</td></tr>';
    _riscosAtualizarPaginacao(0, 0);
    _riscosAtualizarSelecao([]);
    return;
  }

  var listaCompleta = _riscosSortLista(_riscosFiltrar(_riscosListaAtiva()));
  var total = listaCompleta.length;

  if (total === 0) {
    var vz;
    if (_riscosCache.length === 0) vz = { icon: 'shield', titulo: 'Nenhum risco cadastrado', detalhe: 'Use "Novo risco" para começar a gestão de riscos do plano.' };
    else vz = { icon: 'search_off', titulo: 'Nenhum risco encontrado', detalhe: 'Tente ajustar os filtros ou a busca para ver outros resultados.' };
    listaEl.innerHTML = '<tr class="el-linha-msg"><td colspan="6"><div class="el-empty-state"><span class="material-symbols-outlined">' + vz.icon + '</span><p><strong>' + vz.titulo + '</strong></p><p class="sub">' + vz.detalhe + '</p></div></td></tr>';
    _riscosAtualizarPaginacao(0, 0);
    _riscosAtualizarSelecao([]);
    return;
  }

  var itensPag = estadoRiscos.itensPorPagina;
  var totalPags = Math.max(1, Math.ceil(total / itensPag));
  if (estadoRiscos.paginaAtual > totalPags) estadoRiscos.paginaAtual = totalPags;
  if (estadoRiscos.paginaAtual < 1) estadoRiscos.paginaAtual = 1;
  var start = (estadoRiscos.paginaAtual - 1) * itensPag;
  var pagina = listaCompleta.slice(start, start + itensPag);

  listaEl.innerHTML = pagina.map(function(r) { return _riscoLinhaHTML(r, podeEditar); }).join('');
  _riscosAtualizarPaginacao(total, start);
  _riscosAtualizarSelecao(listaCompleta);

  var todosAbertos = pagina.length > 0 && pagina.every(function(r) { return estadoRiscos.expandidos[String(r.id)]; });
  var be = document.getElementById('riscos-btn-expandir');
  if (be) {
    var ic = be.querySelector('.material-symbols-outlined');
    if (ic) ic.textContent = todosAbertos ? 'unfold_less' : 'unfold_more';
    be.setAttribute('data-title', todosAbertos ? 'Recolher todos' : 'Expandir todos');
    be.setAttribute('aria-label', todosAbertos ? 'Recolher todos' : 'Expandir todos');
  }
}

function riscosCliqueLinha(ev, id) {
  if (ev.target.closest('button, a, input, label, .acoes-linha, .rsc-link')) return;
  var idStr = String(id);
  if (ev.shiftKey && _riscosUltimoClicado) {
    var listaVisivel = _riscosSortLista(_riscosFiltrar(_riscosListaAtiva()));
    var itensPag = estadoRiscos.itensPorPagina;
    var start = (estadoRiscos.paginaAtual - 1) * itensPag;
    var pagina = listaVisivel.slice(start, start + itensPag);
    _riscosSelecionarIntervalo(_riscosUltimoClicado, idStr, pagina);
    _riscosAtualizarSelecaoVisual();
  } else if (ev.ctrlKey || ev.metaKey) {
    if (estadoRiscos.selecionados[idStr]) delete estadoRiscos.selecionados[idStr];
    else estadoRiscos.selecionados[idStr] = true;
    _riscosUltimoClicado = idStr;
    _riscosAtualizarSelecaoVisual();
  } else {
    riscosToggleExpand(idStr);
  }
}

function riscosDuploCliqueLinha(ev, id) {
  if (ev.target.closest('button, a, input, label, .acoes-linha, .rsc-link')) return;
  riscosAbrirPainel(id);
}

function _riscosSelecionarIntervalo(idA, idB, pagina) {
  var rows = pagina || _riscosSortLista(_riscosFiltrar(_riscosListaAtiva()));
  var idxA = -1, idxB = -1;
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i].id) === String(idA)) idxA = i;
    if (String(rows[i].id) === String(idB)) idxB = i;
  }
  if (idxA === -1 || idxB === -1) return;
  var min = Math.min(idxA, idxB), max = Math.max(idxA, idxB);
  for (var i = min; i <= max; i++) {
    estadoRiscos.selecionados[String(rows[i].id)] = true;
  }
}

function _riscosAtualizarSelecaoVisual() {
  var rows = document.querySelectorAll('#riscos-lista tr.rsc-linha[data-id]');
  rows.forEach(function(tr) {
    var id = tr.getAttribute('data-id');
    var sel = !!(id && estadoRiscos.selecionados[id]);
    tr.classList.toggle('selecionada', sel);
    var chk = tr.querySelector('.el-col-check input[type="checkbox"]');
    if (chk) chk.checked = sel;
    var det = tr.nextElementSibling;
    if (det && det.classList.contains('rsc-det')) {
      det.classList.toggle('selecionada', sel);
    }
  });
  var listaCompleta = _riscosSortLista(_riscosFiltrar(_riscosListaAtiva()));
  _riscosAtualizarSelecao(listaCompleta);
}

function riscosToggleSelecao(id, marcado) {
  var idStr = String(id);
  if (marcado) {
    estadoRiscos.selecionados[idStr] = true;
    _riscosUltimoClicado = idStr;
  } else {
    delete estadoRiscos.selecionados[idStr];
  }
  _riscosAtualizarSelecaoVisual();
}

function riscosToggleSelecionarTodos(marcado) {
  estadoRiscos.selecionados = {};
  if (marcado) {
    _riscosFiltrar(_riscosListaAtiva()).forEach(function(r) {
      estadoRiscos.selecionados[String(r.id)] = true;
    });
  }
  _riscosAtualizarSelecaoVisual();
}

function riscosCancelarSelecao() {
  estadoRiscos.selecionados = {};
  _riscosAtualizarSelecaoVisual();
}

function _riscosAtualizarSelecao(listaCompleta) {
  var ids = {};
  (listaCompleta || []).forEach(function(r) { ids[String(r.id)] = true; });

function riscosMudarPagina(dir) {
  var total = _riscosFiltrar(_riscosListaAtiva()).length;
  var totalPags = Math.max(1, Math.ceil(total / estadoRiscos.itensPorPagina));
  if (dir === 'prev' && estadoRiscos.paginaAtual > 1) estadoRiscos.paginaAtual--;
  if (dir === 'next' && estadoRiscos.paginaAtual < totalPags) estadoRiscos.paginaAtual++;
  if (estadoRiscos.paginaAtual < 1) estadoRiscos.paginaAtual = 1;
  if (estadoRiscos.paginaAtual > totalPags) estadoRiscos.paginaAtual = totalPags;
  _riscosRenderCorpo();
}

function riscosIrParaPagina(pagina) {
  var total = _riscosFiltrar(_riscosListaAtiva()).length;
  var totalPags = Math.max(1, Math.ceil(total / estadoRiscos.itensPorPagina));
  var p = parseInt(pagina, 10) || 1;
  estadoRiscos.paginaAtual = Math.min(Math.max(1, p), totalPags);
  _riscosRenderCorpo();
}

function _riscosAtualizarPaginacao(total, start) {
  if (typeof _atualizarBarraPaginacao === 'function') {
    _atualizarBarraPaginacao('riscos', estadoRiscos, total, start);

}

// app_riscos_modais — modais e wizards (abrir, validar, salvar)

// Resumo do que já foi preenchido (aparece no lugar do subtítulo da etapa)
function _rwizResumoPasso(n) {
  if (n === 1) {
    var idEl = document.getElementById('risco-id-elemento').value;
    var el = idEl ? _elementosResumoCache.find(function(e) { return String(e.id) === String(idEl); }) : null;
    return el ? ((el.codigo ? el.codigo + ' — ' : '') + el.titulo) : '';
  }
  if (n === 2) {
    var qtd = _riscoParesCC.filter(function(p) { return (p.causa || '').trim() && (p.consequencia || '').trim(); }).length;
    return qtd ? qtd + (qtd === 1 ? ' par' : ' pares') : '';
  }
  if (n === 3) {
    var nivel = document.getElementById('risco-nivel-preview');
    var t = nivel ? nivel.textContent.trim() : '';
    return t && t !== '—' ? t : '';
  }
  if (n === 4) {
    var lista = (typeof seletorRespRisco !== 'undefined' && seletorRespRisco) ? seletorRespRisco.getLista() : [];
    return lista.map(function(r) { return nomeRespExibicao(r.nome, r.tipo); }).join(', ');
  }
  return '';
}

function _rwizRenderRail() {
  var wrap = document.getElementById('rwiz-rail-lista');
  if (!wrap) return;
  var passos = estadoWizardRisco.passos;
  var idxAtual = passos.indexOf(estadoWizardRisco.atual);
  wrap.innerHTML = passos.map(function(p, i) {
    var atual = p === estadoWizardRisco.atual;
    var concluido = !atual && _rwizPassoValido(p) && (_rwizEdicao || estadoWizardRisco.visitadas[p] === true);
    var cls = 'ds-wizard__etapa' + (atual ? ' is-ativa' : (concluido ? ' is-concluida' : ''));
    var info = RWIZ_TITULOS[i];
    var resumo = (atual || concluido) ? _rwizResumoPasso(p) : '';
    var numHTML = concluido ? '<span class="material-symbols-outlined">check</span>' : String(i + 1);
    return '<button type="button"' + (atual ? ' aria-current="step"' : '') + ' class="' + cls + '" data-on-click="risco.18" data-rclick0="' + p + '">'
      + '<span class="ds-wizard__num">' + numHTML + '</span>'
      + '<span class="ds-wizard__texto"><span class="ds-wizard__rotulo">' + escapeHtml(info.titulo) + '</span>'
      + '<span class="ds-wizard__resumo">' + escapeHtml(resumo || info.desc) + '</span></span>'
      + '</button>';
  }).join('');
  var pct = Math.round(((idxAtual + 1) / passos.length) * 100);
  var fill = document.getElementById('rwiz-rail-fill'); if (fill) fill.style.width = pct + '%';
  var txt = document.getElementById('rwiz-rail-contador'); if (txt) txt.textContent = 'Etapa ' + (idxAtual + 1) + ' de ' + passos.length;
}

function _rwizIrPara(n, direcao) {
  var trocarAgora = function() {
    estadoWizardRisco.atual = n;
    estadoWizardRisco.visitadas[n] = true;
    document.querySelectorAll('#modal-risco .wizard-step').forEach(function(el) {
      el.classList.toggle('hidden', Number(el.dataset.step) !== n);
    });
    _rwizRenderRail();
    var passos = estadoWizardRisco.passos;
    document.getElementById('btn-risco-voltar').classList.toggle('hidden', n === passos[0]);
    document.getElementById('btn-risco-proximo').classList.toggle('hidden', n === passos[passos.length - 1]);
    document.getElementById('btn-risco-salvar').classList.toggle('hidden', n !== passos[passos.length - 1]);
    var viewport = document.querySelector('#modal-risco .wizard-steps-viewport');
    if (viewport) viewport.scrollTop = 0;
    estadoWizardRisco.transicionando = false;
  };
  // Uma troca por vez: o clique seguinte cancela a animação pendente (senão ela terminaria na etapa antiga).
  clearTimeout(estadoWizardRisco.timer);
  document.querySelectorAll('#modal-risco .wizard-step').forEach(function(el) { el.classList.remove('wizard-slide-out-left', 'wizard-slide-out-right'); });
  var atualEl = document.getElementById('wizard-risco-step-' + estadoWizardRisco.atual);
  if (!direcao || !atualEl || Number(atualEl.dataset.step) === n) { trocarAgora(); return; }
  estadoWizardRisco.transicionando = true;
  atualEl.classList.add(direcao === 'frente' ? 'wizard-slide-out-left' : 'wizard-slide-out-right');
  estadoWizardRisco.timer = setTimeout(trocarAgora, 180);
}

function _rwizIrParaRail(n) {
  if (n === estadoWizardRisco.atual) return;
  if (n > estadoWizardRisco.atual && !_rwizValidarEtapas(_rwizEtapasAntesDe(n))) return;
  _rwizIrPara(n, n > estadoWizardRisco.atual ? 'frente' : 'tras');
}
function _rwizClasseErro(campo) {
  return campo.tagName === 'SELECT' ? 'ds-select--error' : campo.tagName === 'TEXTAREA' ? 'ds-textarea--error' : 'ds-input--error';
}
function _rwizMsgCampo(campo) {
  var v = campo.validity;
  var overrides = RWIZ_MSGS_CAMPO[campo.id] || {};
  if (v.valueMissing) return overrides.valueMissing || 'Preencha este campo.';
  if (v.tooShort) return overrides.tooShort || ('Use pelo menos ' + campo.minLength + ' caracteres.');
  if (v.tooLong) return overrides.tooLong || ('Use no máximo ' + campo.maxLength + ' caracteres.');
  return campo.validationMessage || 'Verifique este campo.';
}
function _rwizExibirErro(campo) {
  campo.classList.add(_rwizClasseErro(campo));
  if (campo._selop) campo._selop.sincronizar();
  var erro = document.getElementById(campo.id + '-erro');
  if (erro) { erro.textContent = _rwizMsgCampo(campo); erro.classList.remove('hidden'); }
}
function _rwizLimparErro(campo) {
  campo.classList.remove('ds-input--error', 'ds-select--error', 'ds-textarea--error');
  if (campo._selop) campo._selop.sincronizar();
  var erro = document.getElementById(campo.id + '-erro');
  if (erro) { erro.classList.add('hidden'); erro.textContent = ''; }
}

// ---- Validação por etapa ----
function _rwizTemParCompleto() {
  return _riscoParesCC.some(function(p) { return (p.causa || '').trim() && (p.consequencia || '').trim(); });
}

// Primeira pendência da etapa p — { campo } | { natureza: true } | { causas: true } | { resp: true } | null. Pura: não mexe na tela.
function _rwizPendenciaPasso(p) {
  var stepEl = document.getElementById('wizard-risco-step-' + p);
  if (!stepEl) return null;
  var campos = stepEl.querySelectorAll('input, textarea, select');
  for (var i = 0; i < campos.length; i++) {
    if (campos[i].disabled || campos[i].closest('.hidden') || campos[i].type === 'hidden') continue;
    // os campos de digitação do par (etapa 2) valem pelo que já foi inserido, não por si
    if (campos[i].id === 'risco-causa-input' || campos[i].id === 'risco-consequencia-input') continue;
    if (!campos[i].checkValidity()) return { campo: campos[i] };
  }
  if (p === 1 && !document.getElementById('risco-id-elemento').value && !document.getElementById('group-risco-objeto').classList.contains('hidden')) return { elemento: true };
  if (p === 1 && _naturezasSelecionadasRisco().length === 0) return { natureza: true };
  if (p === 2 && !_rwizTemParCompleto()) return { causas: true };
  if (p === 4 && _rscRespObrigatorio && !(seletorRespRisco && seletorRespRisco.getLista().length)) return { resp: true };
  return null;
}
function _rwizPassoValido(p) { return !_rwizPendenciaPasso(p); }

// Valida a etapa p (visível) mostrando o erro e o foco quando houver pendência.
function _rwizValidarPasso(p) {
  var pend = _rwizPendenciaPasso(p);
  var erroNat = document.getElementById('risco-nat-erro'), erroCausas = document.getElementById('risco-causas-erro'), erroResp = document.getElementById('risco-resp-erro');
  if (p === 1 && erroNat) erroNat.classList.add('hidden');
  if (p === 2 && erroCausas) erroCausas.classList.add('hidden');
  if (p === 4 && erroResp) erroResp.classList.add('hidden');
  if (!pend) return true;
  if (pend.elemento) seletorElemRisco.setErro('Selecione o elemento do plano.');
  else if (pend.campo) { _rwizExibirErro(pend.campo); pend.campo.focus(); }
  else if (pend.natureza && erroNat) { erroNat.textContent = 'Selecione ao menos uma natureza.'; erroNat.classList.remove('hidden'); }
  else if (pend.causas && erroCausas) { erroCausas.textContent = 'Insira ao menos um par de causa e consequência.'; erroCausas.classList.remove('hidden'); }
  else if (pend.resp && erroResp) { erroResp.textContent = 'Adicione ao menos um responsável pelo risco.'; erroResp.classList.remove('hidden'); }
  return false;
}

// Valida as etapas da lista, em ordem; na primeira com pendência leva o usuário até ela, mostra o erro e devolve false.
function _rwizValidarEtapas(lista) {
  for (var i = 0; i < lista.length; i++) {
    if (_rwizPassoValido(lista[i])) continue;
    if (lista[i] !== estadoWizardRisco.atual) _rwizIrPara(lista[i]);
    _rwizValidarPasso(lista[i]);
    return false;
  }
  return true;
}
function _rwizEtapasAntesDe(n) { return estadoWizardRisco.passos.filter(function(p) { return p >= estadoWizardRisco.atual && p < n; }); }

function _rwizProximo() {
  if (!_rwizValidarPasso(estadoWizardRisco.atual)) return;
  var passos = estadoWizardRisco.passos;
  var idx = passos.indexOf(estadoWizardRisco.atual);
  if (idx < passos.length - 1) _rwizIrPara(passos[idx + 1], 'frente');
}

function _rwizVoltar() {
  var passos = estadoWizardRisco.passos;
  var idx = passos.indexOf(estadoWizardRisco.atual);
  if (idx > 0) _rwizIrPara(passos[idx - 1], 'tras');
}

// Antes de salvar: percorre todas as etapas e leva o usuário à primeira com pendência
function _rwizValidarTudoAntesDeSalvar() {
  return _rwizValidarEtapas(estadoWizardRisco.passos);
}

var _rwizEdicao = false;
function _rwizIniciar(edicao) {
  _rwizEdicao = !!edicao;
  estadoWizardRisco.visitadas = {};
  var modal = document.getElementById('modal-risco');
  modal.querySelectorAll('select.ds-select').forEach(SeletorOpcao.melhorar);
  SeletorOpcao.sincronizar(modal);
  if (seletorRespRisco) seletorRespRisco.atualizarObrigatorio();
  uiContadoresAtualizar(modal);
  _rwizIrPara(1);
}

function _rwizSelecionarObjeto() {

  seletorElemRisco.setErro('');
  _rwizRenderRail();
}

function rscAbrirModalDoElemento(idElemento) {

  if (noCache) abrirModalRisco(null, idElemento);

// Vínculo definido pela origem do clique: mostra "Analisado em tipo cód — nome" no lugar do seletor de elemento.
function _rwizContextoElemento(idElemento) {

  var el = idElemento ? _elementosResumoCache.find(function(e) { return String(e.id) === String(idElemento); }) : null;

  box.setAttribute('data-title', txt);
  box.classList.remove('hidden');
  grupo.classList.add('hidden');
}

function abrirModalRisco(risco, idElementoFixo) {
  document.getElementById('modal-risco-titulo').innerText = risco ? 'Editar risco' : 'Novo risco';
  var eyebrow = document.getElementById('rwiz-eyebrow');
  var planoNome = (_rscCtx && _rscCtx.plano && _rscCtx.plano.nome) || '';
  if (eyebrow) eyebrow.textContent = planoNome;
  document.getElementById('risco-id-edicao').value    = risco ? risco.id : '';
  document.getElementById('risco-ultima-alteracao').value = risco ? risco.ultimaAlteracao : '';

  _popularElementosRisco(idElemento);
  _rwizContextoElemento(risco ? null : idElementoFixo);
  document.getElementById('risco-descricao').value = risco ? risco.risco : '';
  _riscoParesCC = (risco && Array.isArray(risco.causasConsequencias)) ? risco.causasConsequencias.slice() : [];
  _rwizParesIniciais = _riscoParesCC.length; // dado já acima do limite pode ser mantido, não aumentado
  document.getElementById('risco-causa-input').value = '';
  document.getElementById('risco-consequencia-input').value = '';
  _renderizarCausasConsequenciasRisco();
  document.getElementById('risco-nat-chips').innerHTML = typeof spinnerListaHTML === 'function' ? spinnerListaHTML('Carregando…') : 'Carregando…';
  _garantirCatalogoNaturezasRisco(function() {
    _renderChipsNaturezaRisco(risco ? risco.naturezasRisco : []);
  });
  document.getElementById('risco-probabilidade').value = risco ? risco.probabilidade : '';
  document.getElementById('risco-impacto').value       = risco ? risco.impacto : '';
  atualizarNivelRisco();

  document.querySelectorAll('#modal-risco .ds-input--error, #modal-risco .ds-select--error, #modal-risco .ds-textarea--error')
    .forEach(function(el) { el.classList.remove('ds-input--error', 'ds-select--error', 'ds-textarea--error'); });

  _initSeletorRespRisco();
  prepararDadosRiscoResp(function() {

    } else if (risco && risco.idResponsavel) {
      seletorRespRisco.setLista([{ id: risco.idResponsavel, tipo: risco.tipoResponsavel || 'UNIDADE', nome: risco.nomeResponsavel || '' }]);

      seletorRespRisco.limpar();

  if (primeiro && !primeiro.closest('.hidden')) primeiro.focus();
}
