<script>
/**
 * Fábrica do contrato entre um app "instalável" e o host que o carrega
 * (ver docs/arquitetura_apps_modulares.md). Cada app cria a PRÓPRIA
 * instância — `var _forumSDK = criarSamaumaSDK();` — e nunca guarda num
 * global genérico (`SamaumaSDK`): o app é entregue por injeção dinâmica de
 * HTML/JS no DOM do host (`apiObterHtmlApp` + `<script>` recriado em
 * runtime), não em <iframe> (testado e bloqueado pelo Google — todo Apps
 * Script já roda dentro de um iframe de sandbox do próprio Google, e um
 * segundo nível pra outro app quebra a autenticação). Sem <iframe>, todo
 * app injetado divide o mesmo escopo global da página — um único objeto
 * `SamaumaSDK` compartilhado colidiria entre dois apps montados ao mesmo
 * tempo (Fase 3). Cada instância guarda seu próprio nome com o PRÓPRIO
 * prefixo de arquivo (`_forumSDK`, `_elementosSDK`, ...), mesma convenção
 * de "todo global leva o prefixo do arquivo" já usada em todo o projeto
 * (ver CLAUDE.md).
 *
 * Regra de ouro: um app nunca chama google.script.run direto nem calcula
 * permissão no cliente — só através da instância do SDK que criar.
 */
function criarSamaumaSDK() {
  var _contexto = null;
  var _visibilidade = { pagina: true, aba: true };
  var _callbacksContexto = [];
  var _callbacksVisibilidade = [];
  var _callbacksPainelFechado = [];
  var _callbackTecla = null;
  var _callbacksTema = [];
  var _aoBadge = null;
  var _aoContagem = null;
  var _aoAlerta = null;
  var _aoDados = null;

  return {
    // Chamado pelo host logo depois de injetar/montar o app, e de novo toda
    // vez que o contexto muda (ex.: usuário trocou de plano).
    iniciar: function (ctx) {
      _contexto = {
        idPlano: ctx.idPlano, permissoes: ctx.permissoes || {},
        usuario: ctx.usuario || {}, plano: ctx.plano || {}
      };
      _callbacksContexto.forEach(function (cb) { cb(_contexto); });
    },

    // Chamado pelo host sempre que a visibilidade da aba do app ou da
    // tela-mãe muda (troca de aba, navegação pra outra tela da SPA).
    notificarVisibilidade: function (v) {
      _visibilidade = { pagina: !!v.pagina, aba: !!v.aba };
      _callbacksVisibilidade.forEach(function (cb) { cb(_visibilidade); });
    },

    // Registra callback para quando o contexto chegar/mudar. Se já tiver
    // chegado antes do registro, dispara imediatamente.
    aoContexto: function (cb) {
      _callbacksContexto.push(cb);
      if (_contexto) cb(_contexto);
    },

    aoVisibilidade: function (cb) {
      _callbacksVisibilidade.push(cb);
      cb(_visibilidade);
    },

    contexto: function () { return _contexto; },
    visibilidade: function () { return _visibilidade; },

    // Notificação de painel lateral fechado pelo host
    notificarPainelFechado: function () {
      _callbacksPainelFechado.forEach(function (cb) { cb(); });
    },
    aoPainelFechado: function (cb) {
      _callbacksPainelFechado.push(cb);
    },

    // Repasse de teclas de atalho (Escape, Ctrl+A) da aba ativa
    notificarTecla: function (evt) {
      if (_callbackTecla) return _callbackTecla(evt);
      return false;
    },
    aoTecla: function (cb) {
      _callbackTecla = cb;
    },

    // Notificação de alternância de tema visual (claro/escuro)
    notificarTema: function (tema) {
      _callbacksTema.forEach(function (cb) { cb(tema); });
    },
    aoTema: function (cb) {
      _callbacksTema.push(cb);
    },

    // O HOST registra aqui como quer reagir ao badge deste app (ex.:
    // atualizar o selo vermelho da própria aba) — o app só reporta o valor.
    aoBadge: function (cb) { _aoBadge = cb; },
    reportarBadge: function (valor) { if (_aoBadge) _aoBadge(valor); },

    // Contagem total do app na própria aba (estilo "141" — diferente de
    // aoBadge/reportarBadge, que é notificação/não-lida, estilo bolinha).
    // PADRÃO DOS CONTADORES DA ABA (vale para todo app, atual ou futuro):
    //  - contagem = TOTAL de itens do app (chip neutro, ex.: 141 elementos);
    //  - alerta   = itens que exigem ação (chip âmbar + tooltip, ex.: "2 vínculos
    //    aguardam sua decisão").
    // Um app pode reportar um, o outro ou os dois. Para aparecerem já na abertura
    // do plano, o app registra um provedor em CONTADORES_APPS (code.js).
    aoContagem: function (cb) { _aoContagem = cb; },
    reportarContagem: function (valor) { if (_aoContagem) _aoContagem(valor); },
    aoAlerta: function (cb) { _aoAlerta = cb; },
    reportarAlerta: function (valor, titulo) { if (_aoAlerta) _aoAlerta(valor, titulo); },

    // Genérico: qualquer app pode publicar um retorno de dados pro host
    // reagir (ex.: Elementos publica a lista atualizada pro host recalcular
    // KPIs do header sem o app precisar conhecer essas outras telas).
    aoDados: function (cb) { _aoDados = cb; },
    reportarDados: function (valor) { if (_aoDados) _aoDados(valor); },

    // Barra lateral de detalhes (#detp-panel — ver docs/arquitetura_apps_modulares.md):
    // "substituição total" — o app manda o HTML pronto e é dono de 100% da
    // marcação dentro do drawer (inclusive de suas próprias tabs/cabeçalho/
    // botão de fechar, se quiser; CSS compartilhado do host — .detp-secao,
    // .detp-linha, .detp-subsecao, .detp-tabs/.detp-tab etc. — já está
    // disponível globalmente pra manter a mesma linguagem visual, mas o app
    // não é obrigado a usá-lo). A casca só garante a moldura do drawer
    // (posição/animação) e o Esc como fallback de fechamento. Único ponto
    // que muda na migração pra um componente de verdade (Angular): a
    // implementação interna, nunca essa assinatura.
    abrirPainel: function (html) { if (typeof window.abrirPainelApp === 'function') window.abrirPainelApp(html); },
    fecharPainel: function () { if (typeof window.fecharPainelDetalhes === 'function') window.fecharPainelDetalhes(); },

    // Embrulha google.script.run.withSuccessHandler/withFailureHandler numa
    // Promise. Único ponto que muda na migração para o backend Node/Express.
    chamar: function (nomeFuncao) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (erro) { reject(erro); });
        runner[nomeFuncao].apply(runner, args);
      });
    }
  };
}
</script>

<script>
// ── INSTÂNCIA DO SDK SAMAÚMA PARA MONITORAMENTO ─────────────────
var _monitoramentoSDK = criarSamaumaSDK();
window._desempenhoSDK = _monitoramentoSDK;
window._monitoramentoSDK = _monitoramentoSDK;

var _monitPlanoId = null;
var _monitCtx = null;
var _perfDados = null;
var _perfExpandidos = {};
var monitTudoExpandido = false;
var _monitAbaVisivel = false;
var _monitCarregando = false;
var _monitStale = false; // dados do servidor podem estar defasados: recarrega na próxima vez que a aba ficar visível

var _monitCharts = {};
var _monitChartsClique = {};

var estadoMonit = {
  modo: 'progresso',
  busca: '', filtroStatus: '', filtroResp: '', filtroElem: '', filtroConceito: '',
  tipoElementoBarras: '',
  sort: { col: 'codigo', dir: 'asc' },
  paginaAtual: 1, itensPorPagina: 20
};

var _MON_ORD_STATUS = ['Concluído', 'Em Andamento', 'Não Iniciado', 'Cancelado'];
var _MON_ORD_CONC = ['Excelente', 'Bom', 'Regular', 'Insuficiente', 'Não apurado'];

var _PERF_CORES_CONCEITO = {
  'Excelente':    { bg: 'var(--ds-color-success-bg)', text: 'var(--ds-color-success-fg)' },
  'Bom':          { bg: 'var(--ds-color-info-bg)', text: 'var(--ds-color-info-fg)' },
  'Regular':      { bg: 'var(--ds-color-warning-bg)', text: 'var(--ds-color-warning-fg)' },
  'Insuficiente': { bg: 'var(--ds-color-danger-bg)', text: 'var(--ds-color-danger-fg)' },
  'Alta Performance':        { bg: 'var(--ds-color-success-bg)', text: 'var(--ds-color-success-fg)' },
  'Desempenho Satisfatório': { bg: 'var(--ds-color-info-bg)', text: 'var(--ds-color-info-fg)' },
  'Desempenho Crítico':      { bg: 'var(--ds-color-warning-bg)', text: 'var(--ds-color-warning-fg)' },
  'Falha no Planejamento':   { bg: 'var(--ds-color-danger-bg)', text: 'var(--ds-color-danger-fg)' }
};

var _PERF_CORES_STATUS = {
  'Concluído':    { cor: 'var(--ds-color-success-fg)', bg: 'var(--ds-color-success-bg)' },
  'Em Andamento': { cor: 'var(--ds-color-info-fg)', bg: 'var(--ds-color-info-bg)' },

function _monitParseData(str) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(str || ''));
  return m ? new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])) : null;
}

function _monitDetLinha(label, valor) {
  return valor ? '<div class="detp-linha"><span class="detp-linha-label">' + label + '</span>'
    + '<span class="detp-linha-valor">' + valor + '</span></div>' : '';
}

function _monitCor(varOuCor) {
  var m = /^var\((--[^)]+)\)$/.exec(String(varOuCor || '').trim());
  if (!m) return varOuCor;
  return getComputedStyle(document.body).getPropertyValue(m[1]).trim() || '#5b6472';
}

function _monitTema() {
  return {
    texto: _monitCor('var(--ds-color-text)'), muted: _monitCor('var(--ds-color-text-muted)'),
    borda: _monitCor('var(--ds-color-border)'), trilha: _monitCor('var(--ds-sidebar-item-hover)'),
    superficie: _monitCor('var(--ds-color-surface)'), acao: _monitCor('var(--ds-color-action)'),
    fonte: getComputedStyle(document.body).fontFamily || 'Roboto, sans-serif'
  };
}

function _monitTooltip(t) {

  var nivelDe = {};
  elems.forEach(function(e) {
    var nivel = 1, atual = paiDe[String(e.id)], seg = 0;
    while (atual && seg < 30) {
      nivel++;
      atual = paiDe[atual] || '';
      seg++;
    }
    nivelDe[String(e.id)] = nivel;
  });
  var tiposMap = {};
  elems.forEach(function(e) {
    var t = String(e.tipo || '').trim();
    if (!t) return;
    var n = nivelDe[String(e.id)] || 1;
    if (!tiposMap[t] || n < tiposMap[t].nivel) {
      tiposMap[t] = { tipo: t, nivel: n, count: 0 };
    }
    tiposMap[t].count++;
  });
  return Object.keys(tiposMap).map(function(k) { return tiposMap[k]; }).sort(function(a, b) {
    if (a.nivel !== b.nivel) return a.nivel - b.nivel;

    +   '<div class="el-search-caixa' + (estadoMonit.busca ? '' : ' hidden') + '" id="monit-search-caixa">'

    +     '<input type="text" class="ds-input el-search-input" id="monit-filtro-busca" oninput="aplicarFiltrosMonit()" value="' + escapeHtml(estadoMonit.busca) + '"'
    +       ' placeholder="' + (modo === 'progresso' ? 'Buscar elemento ou responsável…' : 'Buscar indicador ou elemento…') + '" aria-label="Buscar">'
    +     '<button type="button" class="el-search-clear' + (estadoMonit.busca ? '' : ' hidden') + '" id="monit-btn-clear" onclick="limparFiltroMonitBusca()" data-title="Limpar busca" aria-label="Limpar busca">'
    +       '<span class="material-symbols-outlined">close</span></button>'
    +   '</div>'
    + '</div>'
    + campos.map(function(c) {
        var rot = _monitRotuloFiltro(c), def = _monitFiltrosDef[c];
        return '<div class="el-filtro">'
          + '<button type="button" class="el-filtro-btn' + (rot ? ' el-filtro-btn--ativo' : '') + '" onclick="monitAbrirFiltro(\'' + c + '\', event)">'
          +   '<span>' + escapeHtml(rot ? def.label + ': ' + rot : def.label) + '</span>'
          +   '<span class="material-symbols-outlined" style="font-size:18px">expand_more</span></button>'
          + '<button type="button" class="el-filtro-x' + (rot ? '' : ' hidden') + '" onclick="monitLimparUmFiltro(\'' + c + '\')" aria-label="Limpar filtro ' + def.label.toLowerCase() + '">'
          +   '<span class="material-symbols-outlined" style="font-size:15px">close</span></button>'
          + '</div>';
      }).join('')
    + '<button type="button" class="el-limpar-link' + (temFiltro ? '' : ' hidden') + '" onclick="limparFiltrosMonit()" aria-label="Limpar filtros">Limpar filtros</button>'
    + '<div style="flex:1"></div>'
    + '<div class="det-modos" role="group" aria-label="Modo de visualização">'
    +   '<button type="button" class="det-modo' + (modo === 'progresso' ? ' ativo' : '') + '" onclick="monitMudarModo(\'progresso\')"'
    +     ' data-title="Progresso — andamento dos elementos" aria-label="Progresso" aria-pressed="' + (modo === 'progresso') + '">'
    +     '<span class="material-symbols-outlined">engineering</span></button>'
    +   '<button type="button" class="det-modo' + (modo === 'desempenho' ? ' ativo' : '') + '" onclick="monitMudarModo(\'desempenho\')"'
    +     ' data-title="Desempenho — eficácia das metas" aria-label="Desempenho" aria-pressed="' + (modo === 'desempenho') + '">'
    +     '<span class="material-symbols-outlined">military_tech</span></button>'
    + '</div>'
    + '</div>';
}

function monitAbrirBusca() {
  var st = document.getElementById('monit-search-toggle'); if (st) st.classList.add('hidden');
  var sc = document.getElementById('monit-search-caixa'); if (sc) sc.classList.remove('hidden');
  var fb = document.getElementById('monit-filtro-busca'); if (fb) fb.focus();
}

document.addEventListener('click', function(e) {
  var wrap = document.getElementById('monit-search-wrap'), caixa = document.getElementById('monit-search-caixa');
  if (!wrap || !caixa || caixa.classList.contains('hidden') || wrap.contains(e.target)) return;
  var inp = document.getElementById('monit-filtro-busca');
  if (inp && !inp.value.trim()) {
    caixa.classList.add('hidden');
    var st = document.getElementById('monit-search-toggle');
    if (st) st.classList.remove('hidden');
  }
});

function aplicarFiltrosMonit() {
  estadoMonit.busca = (document.getElementById('monit-filtro-busca') || {}).value || '';
  estadoMonit.paginaAtual = 1;
  var bc = document.getElementById('monit-btn-clear'); if (bc) bc.classList.toggle('hidden', !estadoMonit.busca);
  var resumo = document.getElementById('monit-resumo');
  if (resumo && _perfDados) { resumo.innerHTML = _monitResumoHTML(_perfDados); }
  _monitRenderCorpo();
  _monitDesenharResumo(_perfDados);
}

function limparFiltroMonitBusca() {
  var inp = document.getElementById('monit-filtro-busca'); if (inp) { inp.value = ''; inp.focus(); }
  aplicarFiltrosMonit();
}

function monitAbrirFiltro(campo, ev) {
  ev.stopPropagation();
  var def = _monitFiltrosDef[campo], atual = estadoMonit[def.chave], opcoes = [];
  if (campo === 'status') {
    opcoes = _MON_ORD_STATUS.map(function(s) { return { v: s, label: s, dot: _monitCor((_PERF_CORES_STATUS[s] || {}).cor) }; });
  } else if (campo === 'conceito') {
    opcoes = _MON_ORD_CONC.map(function(k) { var c = _PERF_CORES_CONCEITO[k]; return { v: k, label: k, dot: _monitCor(c ? c.text : 'var(--ds-color-border-strong)') }; });
  } else if (campo === 'obj') {
    var todosElems = ((_perfDados && _perfDados.elementos) || []).slice().sort(function(a, b) {
      return (typeof compararCodigos === 'function')
        ? compararCodigos(String(a.codigo || ''), String(b.codigo || ''))
        : String(a.codigo || '').localeCompare(String(b.codigo || ''), 'pt', { numeric: true });
    });
    opcoes = todosElems.map(function(o) { return { v: String(o.id), label: (o.codigo ? o.codigo + ' — ' : '') + o.titulo }; });
  } else {
    var s = {};
    _monitListaAtiva().forEach(function(l) { (l.quem || []).forEach(function(q) { if (q.idResp) s[q.idResp] = q.tipo; }); });
    opcoes = Object.keys(s).sort(function(a, b) { return a.localeCompare(b, 'pt'); }).map(function(n) {
      return { v: n, label: (typeof nomeRespExibicao === 'function') ? nomeRespExibicao(n, s[n]) : n };
    });
  }
  if (!opcoes.length) return;
  var itens = [{ label: 'Todos', ativo: !atual, onclick: "monitSelecionarFiltro('" + campo + "','')" }].concat(opcoes.map(function(o) {
    var it = { label: o.label, ativo: String(o.v) === String(atual), onclick: "monitSelecionarFiltro('" + campo + "','" + escapeJsAttr(o.v) + "')" };
    if (o.dot) it.dot = o.dot;
    return it;
  }));
  if (typeof abrirMenuSelecao === 'function') {
    abrirMenuSelecao(ev.currentTarget, [{ itens: itens }]);
  }
}

function monitSelecionarFiltro(campo, valor) {
  estadoMonit[_monitFiltrosDef[campo].chave] = valor;
  estadoMonit.paginaAtual = 1;
  renderizarMonitoramento(_perfDados);
}

function monitLimparUmFiltro(campo) { monitSelecionarFiltro(campo, ''); }

function limparFiltrosMonit() {
  estadoMonit.busca = ''; estadoMonit.filtroStatus = ''; estadoMonit.filtroResp = '';
  estadoMonit.filtroElem = ''; estadoMonit.filtroConceito = '';
  estadoMonit.paginaAtual = 1;
  renderizarMonitoramento(_perfDados);
}

function renderizarMonitoramento(dados) {
  var container = document.getElementById('monit-corpo-wrap');
  if (!container) return;
  var modo = estadoMonit.modo;
  var cols = modo === 'progresso'
    ? '<col><col class="mon-col-status"><col class="mon-col-prog"><col class="mon-col-prazo"><col class="mon-col-resp"><col class="mon-col-acoes">'
    : '<col><col class="mon-col-alc"><col class="mon-col-conc"><col class="mon-col-contrib"><col class="mon-col-acoes">';

  container.innerHTML =
    '<div id="monit-resumo">' + _monitResumoHTML(dados) + '</div>'
    + _monitFiltrosHTML(modo)
    + '<div class="el-table-wrap">'
    +   '<table class="el-tabela mon-tabela" id="monit-tabela"><colgroup>' + cols + '</colgroup>'
    +   '<thead id="monit-thead"></thead><tbody id="monit-tbody"></tbody></table>'
    + '</div>'
    + '<div id="monit-pagination" class="pagination-bar rsc-pag">'
    +   '<div class="pag-left"><span>Exibir:</span>'
    +     '<select id="monit-pag-size" onchange="monitMudarTamanho(this.value)" class="form-control form-control-sm">'
    +       '<option value="10">10</option><option value="20">20</option><option value="50">50</option>'
    +     '</select></div>'
    +   '<div class="pag-center"><span id="monit-pag-counter">0–0 de 0</span></div>'
    +   '<div class="pag-right">'
    +     '<button class="btn-pag" onclick="monitMudarPagina(\'prev\')" data-title="Anterior" aria-label="Página anterior"><span class="material-symbols-outlined">chevron_left</span></button>'
    +     '<select id="monit-pag-selector" onchange="monitIrParaPagina(this.value)" class="form-control form-control-sm pag-selector"><option value="1">1</option></select>'
    +     '<button class="btn-pag" onclick="monitMudarPagina(\'next\')" data-title="Próximo" aria-label="Próxima página"><span class="material-symbols-outlined">chevron_right</span></button>'
    +   '</div>'
    + '</div>';

  var selSize = document.getElementById('monit-pag-size');
  if (selSize) selSize.value = String(estadoMonit.itensPorPagina);
  _monitRenderCorpo();
  _monitDesenharResumo(dados);
}

function _monitRenderCorpo() {
  var thead = document.getElementById('monit-thead');
  var tbody = document.getElementById('monit-tbody');
  if (!thead || !tbody) return;
  var modo = estadoMonit.modo, sort = estadoMonit.sort;

  var cols = modo === 'progresso'
    ? [{ col: 'codigo', label: 'Elemento' }, { col: 'status', label: 'Status', cls: 'mon-col-status' }, { col: 'percentual', label: 'Progresso', cls: 'mon-col-prog' },
       { col: 'prazoSort', label: 'Prazo', cls: 'mon-col-prazo' }, { col: 'responsavel', label: 'Responsável', cls: 'mon-col-resp' }]
    : [{ col: 'nome', label: 'Indicador' }, { col: 'alcanceSort', label: 'Alcance', cls: 'mon-col-alc' }, { col: 'conceitoLabel', label: 'Conceito', cls: 'mon-col-conc' },
       { col: 'contribSort', label: 'Contribuição', cls: 'mon-col-contrib' }];
  var nCols = cols.length + 1;

  thead.innerHTML = '<tr>' + cols.map(function(c) {
    var ativo = sort.col === c.col;
    return '<th class="th-sortable' + (ativo ? ' is-sort' : '') + (c.cls ? ' ' + c.cls : '') + '" onclick="monitOrdenar(\'' + c.col + '\')">' + escapeHtml(c.label)
      + '<span class="sort-icon">' + (ativo ? (sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward') : '') + '</span></th>';
  }).join('')
    + '<th class="mon-col-acoes el-col-acoes"><div class="el-th-acoes">'
    +   '<button type="button" class="el-th-btn" onclick="atualizarMonitoramento()" data-title="Atualizar" aria-label="Atualizar"><span class="material-symbols-outlined">refresh</span></button>'
    +   (modo === 'desempenho'
          ? '<button type="button" class="el-th-btn" id="btn-expandir-monit" onclick="monitToggleExpandirTudo()" data-title="' + (monitTudoExpandido ? 'Recolher todos' : 'Expandir todos') + '"'
            + ' aria-label="' + (monitTudoExpandido ? 'Recolher todos' : 'Expandir todos') + '"><span class="material-symbols-outlined">' + (monitTudoExpandido ? 'unfold_less' : 'unfold_more') + '</span></button>'
          : '')
    +   '<button type="button" class="el-th-btn" onclick="imprimirMonitoramento()" data-title="Imprimir" aria-label="Imprimir"><span class="material-symbols-outlined">print</span></button>'
    +   '<button type="button" class="el-th-btn" onclick="exportarMonitoramento()" data-title="Exportar" aria-label="Exportar"><span class="material-symbols-outlined">download</span></button>'
    +   '<button type="button" class="el-th-btn" onclick="monitAbrirMenuOrdenar(event)" data-title="Ordenar" aria-label="Ordenar" aria-haspopup="menu" aria-expanded="false"><span class="material-symbols-outlined">sort</span></button>'
    + '</div></th></tr>';

  if (modo === 'desempenho' && !_perfDados) {
    tbody.innerHTML = '<tr class="el-linha-msg"><td colspan="' + nCols + '">' + (typeof spinnerListaHTML === 'function' ? spinnerListaHTML() : '<div class="lista-spinner-wrap"><div class="lista-spinner"></div></div>') + '</td></tr>';
    _monitAtualizarPaginacao(0, 0);
    return;
  }

  var listaCompleta = _monitSortLista(_monitFiltrar(_monitListaAtiva()));
  var total = listaCompleta.length, itensPag = estadoMonit.itensPorPagina;
  var totalPags = Math.max(1, Math.ceil(total / itensPag));
  if (estadoMonit.paginaAtual > totalPags) estadoMonit.paginaAtual = totalPags;
  if (estadoMonit.paginaAtual < 1) estadoMonit.paginaAtual = 1;
  var start = (estadoMonit.paginaAtual - 1) * itensPag;
  var lista = listaCompleta.slice(start, start + itensPag);

  if (!lista.length) {
    var temFiltro = estadoMonit.busca || estadoMonit.filtroStatus || estadoMonit.filtroResp || estadoMonit.filtroElem || estadoMonit.filtroConceito;
    var vz = temFiltro ? { icon: 'filter_alt_off', titulo: 'Nenhum resultado para os filtros', detalhe: 'Tente ampliar ou limpar os filtros aplicados.' }
      : modo === 'progresso' ? { icon: 'engineering', titulo: 'Nenhum elemento cadastrado', detalhe: 'Cadastre elementos na aba Elementos.' }
      : { icon: 'query_stats', titulo: 'Nenhum indicador cadastrado', detalhe: 'Cadastre indicadores na aba Indicadores.' };
    tbody.innerHTML = '<tr class="el-linha-msg"><td colspan="' + nCols + '"><div class="el-empty-state"><span class="material-symbols-outlined el-esi">' + vz.icon + '</span>'
      + '<p class="el-esti">' + vz.titulo + '</p><p>' + vz.detalhe + '</p></div></td></tr>';
    _monitAtualizarPaginacao(0, 0);
    _monitLimparCharts();
    return;
  }

  if (modo === 'progresso') {
    var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    tbody.innerHTML = lista.map(function(l) {
      var c = _PERF_CORES_STATUS[l.status] || { cor: 'var(--ds-color-text-muted)', bg: 'var(--ds-color-surface-2)' };
      var pct = _isNum(l.percentual) ? l.percentual : 0;
      var cancel = l.status === 'Cancelado', concl = l.status === 'Concluído';
      var dPrazo = _monitParseData(l.prazo || l.fim), vencido = !cancel && !concl && dPrazo && dPrazo < hoje;
      var raiz = String(l.codigo || '').indexOf('.') === -1;
      var nomesTodos = (l.quem || []).map(function(q) {
        return (typeof nomeRespExibicao === 'function') ? nomeRespExibicao(q.idResp, q.tipo) : q.idResp;
      }).filter(Boolean);
      var nAdic = (l.quem || []).length - 1;
      var respTitle = nAdic > 0
        ? 'Principal: ' + (l.quem[0].idResp || '') + ' | Adicionais: ' + (l.quem.slice(1).map(function(q){ return q.idResp; }).join(', '))
        : ((l.quem && l.quem[0] && l.quem[0].idResp !== nomesTodos[0]) ? l.quem[0].idResp : '');
      var ico = (l.quem && l.quem[0] && l.quem[0].tipo === 'USER') ? 'person' : 'apartment';
      var resp = (l.quem && l.quem.length > 0)
        ? '<span class="resp-badge el-resp-badge"' + (respTitle ? ' data-title="' + escapeHtml(respTitle) + '"' : '') + '>'
          + '<span class="material-symbols-outlined">' + ico + '</span>'
          + '<span class="el-resp-nome">' + escapeHtml(nomesTodos[0] || 'Não definido') + '</span>'
          + (nAdic > 0 ? ' <span class="resp-mais">+' + nAdic + '</span>' : '')
          + '</span>'
        : '—';
      var acoes = (typeof acoesLinhaHTML === 'function') ? acoesLinhaHTML('mon-el-' + l.id, [
        { icone: 'right_panel_open', rotulo: 'Detalhes do elemento', onclick: "abrirDetalhesElementoPainel('" + escapeHtml(l.id) + "')", principal: true }
      ]) : '';
      return '<tr ondblclick="abrirDetalhesElementoPainel(\'' + escapeHtml(l.id) + '\')">'
        + '<td><div class="mon-elem"><span class="el-codigo">' + escapeHtml(l.codigo || '—') + '</span>'
        +   '<span class="mon-elem-titulo' + (raiz ? ' is-raiz' : '') + '" data-title="' + escapeHtml(l.titulo) + '">' + escapeHtml(l.titulo) + '</span></div></td>'
        + '<td class="mon-col-status"><span class="mon-status" style="background:' + c.bg + ';color:' + c.cor + '"><span class="mon-status-dot"></span>' + escapeHtml(l.status) + '</span></td>'
        + '<td class="mon-col-prog"><div class="mon-barra-wrap"><span class="mon-barra"><span class="mon-barra-fill" style="width:' + Math.min(pct, 100) + '%;background:'
        +   (concl ? 'var(--ds-color-success)' : cancel ? 'var(--ds-color-border-strong)' : 'var(--ds-color-action)') + '"></span></span>'
        +   '<span class="mon-barra-val">' + (cancel ? '—' : pct.toFixed(0) + '%') + '</span></div></td>'
        + '<td class="mon-col-prazo"><span class="mon-prazo' + (vencido ? ' is-vencido' : '') + '"' + (vencido ? ' data-title="Prazo vencido"' : '') + '>'
        +   (vencido ? '<span class="material-symbols-outlined">schedule</span>' : '') + escapeHtml(l.prazo || '—') + '</span></td>'
        + '<td class="mon-col-resp">' + resp + '</td>'
        + '<td class="mon-col-acoes">' + acoes + '</td>'
        + '</tr>';
    }).join('');
    _monitLimparCharts();
  } else {
    var ESCALA = 130;
    tbody.innerHTML = lista.map(function(ind) {
      var id = escapeHtml(String(ind.id)), aberto = !!_perfExpandidos[ind.id];
      var c = _PERF_CORES_CONCEITO[ind.conceito] || { bg: 'var(--ds-color-surface-2)', text: 'var(--ds-color-text-muted)' };
      var tem = _isNum(ind.alcance);
      var pol = ind.interpretacao === 'Menor Melhor'
        ? '<span class="material-symbols-outlined mon-ind-pol" data-title="Quanto menor, melhor">south</span>'
        : '<span class="material-symbols-outlined mon-ind-pol" data-title="Quanto maior, melhor">north</span>';
      var acoes = (typeof acoesLinhaHTML === 'function') ? acoesLinhaHTML('mon-ind-' + id, [
        { icone: 'right_panel_open', rotulo: 'Detalhes do indicador', onclick: "monitAbrirPainelIndicador('" + id + "')", principal: true }
      ]) : '';
      var linha = '<tr class="mon-linha-ind' + (aberto ? ' is-open' : '') + '" onclick="perfToggleExpand(\'' + id + '\', event)" ondblclick="monitAbrirPainelIndicador(\'' + id + '\'); event.stopPropagation();" aria-expanded="' + aberto + '">'
        + '<td><div class="mon-ind"><span class="material-symbols-outlined mon-seta" aria-hidden="true">chevron_right</span>'
        +   '<span class="mon-ind-nome" data-title="' + escapeHtml(ind.nome) + '">' + escapeHtml(ind.nome) + '</span>' + pol + '</div></td>'
        + '<td class="mon-col-alc"><div class="mon-barra-wrap" data-title="' + (tem ? 'Alcance ' + _fmtNumBR(ind.alcance) + '% da meta (traço = 100%)' : (ind.temMeta ? 'Sem resultados validados' : 'Sem meta cadastrada')) + '">'
        +   '<span class="mon-barra"><span class="mon-barra-fill" style="width:' + (tem ? Math.min(100, ind.alcance / ESCALA * 100).toFixed(1) : 0) + '%;background:' + c.text + '"></span>'
        +   '<span class="mon-barra-meta" style="left:' + (100 / ESCALA * 100).toFixed(1) + '%"></span></span>'
        +   '<span class="mon-barra-val">' + (tem ? Math.round(ind.alcance) + '%' : '—') + '</span></div></td>'
        + '<td class="mon-col-conc">' + _perfBadgeConceito(ind.conceito) + '</td>'
        + '<td class="mon-col-contrib">' + (_isNum(ind.contribuicao)
            ? '<span class="mon-contrib" data-title="Peso ' + ind.peso + ' × ' + ind.pontos + ' ponto(s) = ' + _fmtNumBR(ind.contribuicao) + ' de ' + _fmtNumBR(ind.contribuicaoMax) + ' possíveis">'
              + '<strong>' + _fmtNumBR(ind.contribuicao) + '</strong><span> / ' + _fmtNumBR(ind.contribuicaoMax) + '</span></span>'
            : '—') + '</td>'
        + '<td class="mon-col-acoes">' + acoes + '</td>'
        + '</tr>';
      if (!aberto) return linha;
      var temBase = ind.indiceBase !== null && ind.indiceBase !== undefined && ind.indiceBase !== '' && !isNaN(Number(ind.indiceBase));
      var temHist = temBase || (ind.historico || []).length > 0 || (ind.apuracoes || []).some(function(a) { return _isNum(a.apurado); });
      var realMeta = tem ? _fmtNumBR(ind.valorRealizado) + ' / ' + _fmtNumBR(ind.valorMeta) + (ind.unidade ? ' ' + escapeHtml(ind.unidade) : '') : '';
      return linha + '<tr class="mon-det"><td colspan="' + nCols + '"><div class="mon-det-corpo">'
        + '<div class="mon-det-graf"><span>' + (temHist ? 'Resultados validados × meta' : '') + '</span>'
        +   (temHist ? '<div class="mon-chart-hist" id="mon-hist-' + id + '"></div>'
                     : '<div class="mon-det-vazio"><span class="material-symbols-outlined">hourglass_empty</span>Ainda sem resultados validados</div>')
        + '</div>'
        + '<div class="mon-det-ficha">'
        +   _monitDetLinha('Elemento', escapeHtml(ind.elemLabel || '—'))
        +   _monitDetLinha('Realizado / meta', realMeta)
        +   _monitDetLinha('Apuração', ind.tipoCalculo === 'CONTINUO' ? 'Contínua' : 'Singular')
        +   _monitDetLinha('Peso', String(ind.peso))
        +   _monitDetLinha('Pontos', _isNum(ind.pontos) ? ind.pontos + ' de ' + ((_perfDados.faixas && _perfDados.faixas.PONTOS_MAXIMOS) || 3) : '')
        +   _monitDetLinha('Referência', ind.periodo ? escapeHtml(ind.periodo) : '')
        +   (ind.responsavel ? _monitDetLinha('Responsável', escapeHtml(ind.responsavel)) : '')
        +   ((ind.resultadosPendentes || 0) > 0 ? _monitDetLinha('Pendentes de validação', String(ind.resultadosPendentes)) : '')
        +   '<div class="mon-det-acoes-painel" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--ds-color-border)">'
        +     '<button type="button" class="rsc-link" onclick="monitAbrirPainelIndicador(\'' + id + '\')">'
        +       '<span class="material-symbols-outlined">right_panel_open</span>Abrir detalhes no painel lateral</button>'
        +   '</div>'
        + '</div>'
        + '</div></td></tr>';
    }).join('');

    _monitLimparCharts();
    lista.forEach(function(ind) {
      if (_perfExpandidos[ind.id]) _monitChart('hist_' + ind.id, 'mon-hist-' + ind.id, _monitOptHistorico(ind));
    });
  }
  _monitAtualizarPaginacao(total, start);
}

function perfToggleExpand(idInd, ev) {
  if (ev && ev.target.closest && ev.target.closest('button, a, .acoes-linha')) return;
  _perfExpandidos[idInd] = !_perfExpandidos[idInd];
  _monitRenderCorpo();
}

function monitToggleExpandirTudo() {
  monitTudoExpandido = !monitTudoExpandido;
  _perfExpandidos = {};
  if (monitTudoExpandido) _monitFiltrar(_monitLinhasDesempenho()).forEach(function(l) { _perfExpandidos[String(l.id)] = true; });
  _monitRenderCorpo();
}

function atualizarMonitoramento() {
  _monitCarregarDados(true);
}

// silencioso=true: atualização em segundo plano — mantém na tela o que já está carregado
// (sem spinner, sem zerar filtros/linhas expandidas) e só troca quando a resposta chega.
function _monitCarregarDados(forcar, silencioso) {
  if (!_monitPlanoId || _monitPlanoId === 'undefined' || _monitCarregando) return;
  _monitCarregando = true;
  _monitStale = false;
  var idPlanoReq = _monitPlanoId;
  if (forcar && !silencioso) {
    _perfDados = null;
  }

  var wrap = document.getElementById('monit-corpo-wrap');
  if (silencioso && _perfDados) {
    // nada a mostrar: os dados atuais continuam visíveis
  } else if (wrap && !_perfDados) {
    wrap.innerHTML = '<div class="lista-spinner-wrap"><div class="lista-spinner"></div></div>';
  } else {
    var tbMonit = document.getElementById('monit-tbody');
    if (tbMonit) tbMonit.innerHTML = '<tr><td colspan="9" style="padding:0">' + (typeof spinnerListaHTML === 'function' ? spinnerListaHTML() : '<div class="lista-spinner-wrap"><div class="lista-spinner"></div></div>') + '</td></tr>';
  }

  _monitoramentoSDK.chamar('apiGetAbaMonitoramento', _monitPlanoId)
    .then(function(res) {
      if (idPlanoReq !== _monitPlanoId) return; // resposta de um plano já abandonado
      _monitCarregando = false;
      _perfDados = res;
      if (!silencioso) {
        _perfExpandidos = {};
        monitTudoExpandido = false;
      }
      renderizarMonitoramento(res);

      var d = (res && res.desempenho && res.desempenho.proprio) || {};
      if (d.pendentes > 0) {
        _monitoramentoSDK.reportarAlerta(d.pendentes, d.pendentes + ' resultado(s) pendente(s) de validação');
      } else {
        _monitoramentoSDK.reportarAlerta(null);
      }
    })
    .catch(function(err) {
      if (idPlanoReq !== _monitPlanoId) return;
      _monitCarregando = false;
      var tbMonit = document.getElementById('monit-tbody');
      var msg = (err && err.message) || String(err);
      if (tbMonit) {
        tbMonit.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--ds-color-danger)">' + escapeHtml(msg) + '</td></tr>';
      } else if (wrap) {
        wrap.innerHTML = '<div style="color:var(--ds-color-danger); padding:20px">Erro: ' + escapeHtml(msg) + '</div>';
      }
    });
}

// ── REGISTRO DE HOOKS DO SDK ───────────────────────────────────
_monitoramentoSDK.aoVisibilidade(function(info) {
  var visivel = !!(info && info.aba && info.pagina);
  _monitAbaVisivel = visivel;
  if (visivel) {
    if (!_perfDados && !_monitCarregando && _monitPlanoId && _monitPlanoId !== 'undefined') {
      _monitCarregarDados(false);
    } else if (_perfDados && _monitStale && !_monitCarregando) {
      _monitCarregarDados(true, true);
    } else if (_perfDados) {
      setTimeout(function() {
        _monitDesenharResumo(_perfDados);
        _monitResizeCharts();
      }, 50);
    }
  }
});

_monitoramentoSDK.aoContexto(function(ctx) {
  if (!ctx) return;
  var novoId = String(ctx.idPlano || (ctx.plano && ctx.plano.id) || '');
  if (!novoId || novoId === 'undefined') return;
  var mudouPlano = (_monitPlanoId !== novoId);
  _monitCtx = ctx;
  _monitPlanoId = novoId;

  if (!mudouPlano) {
    // Plano reaberto (ou trâmite): o que está em memória pode ter ficado defasado
    _monitStale = true;
    if (_monitAbaVisivel && _perfDados && !_monitCarregando) _monitCarregarDados(true, true);
    return;
  }

  if (mudouPlano) {
    _monitCarregando = false;
    _monitStale = false;
    _perfDados = null;
    _perfExpandidos = {};
    monitTudoExpandido = false;
    _monitDestruirTodosCharts();
    estadoMonit.busca = '';
    estadoMonit.filtroStatus = '';
    estadoMonit.filtroResp = '';
    estadoMonit.filtroElem = '';
    estadoMonit.filtroConceito = '';
    estadoMonit.tipoElementoBarras = '';
    estadoMonit.paginaAtual = 1;
    if (_monitAbaVisivel) {
      _monitCarregarDados(false);
    } else {
      var wrap = document.getElementById('monit-corpo-wrap');
      if (wrap) wrap.innerHTML = '';
    }
  }
});

// Chamadas pelo host quando Elementos/Indicadores reportam dados: se o que a aba
// mostra deixou de bater com a lista atual, marca como defasado (recarrega ao ficar visível).
function _monitMarcarSeMudou(assinaturaAtual, assinaturaMonit) {
  if (!_perfDados || assinaturaAtual === assinaturaMonit) return;
  _monitStale = true;
  if (_monitAbaVisivel && !_monitCarregando) _monitCarregarDados(true, true);
}
window.monitVerificarElementos = function(elementos) {
  var sig = function(l) { return (l || []).map(function(e) { return String(e.id) + '|' + String(e.status || 'Não Iniciado') + '|' + Number(e.percentual || 0); }).sort().join(';'); };
  _monitMarcarSeMudou(sig(elementos), sig(_perfDados && _perfDados.elementos));
};
window.monitVerificarIndicadores = function(indicadores) {
  var sig = function(l) { return (l || []).map(function(i) { return String(i.id); }).sort().join(';'); };
  _monitMarcarSeMudou(sig(indicadores), sig(_perfDados && _perfDados.indicadores));
};

_monitoramentoSDK.aoTema(function(tema) {
  if (_perfDados && _monitAbaVisivel) {
    _monitDesenharResumo(_perfDados);
    _monitRedesenharGraficosHistorico();
  }
});

_monitoramentoSDK.aoTecla(function(ev) {
  if (ev && ev.key === 'Escape') {
    if (estadoMonit.busca) {
      limparFiltroMonitBusca();
      return true;
    }
    var temExpandidos = Object.keys(_perfExpandidos).some(function(k) { return _perfExpandidos[k]; });
    if (temExpandidos) {
      _perfExpandidos = {};
      monitTudoExpandido = false;
      _monitRenderCorpo();
      return true;
    }
    var temFiltro = estadoMonit.filtroStatus || estadoMonit.filtroResp || estadoMonit.filtroElem || estadoMonit.filtroConceito;
    if (temFiltro) {
      limparFiltrosMonit();
      return true;
    }
  }
  return false;
});
</script>
