<!-- ================================================================
     APP VÍNCULOS (Fase 3B — Arquitetura de Abas Plugáveis)
     Injetado dinamicamente em #vinculos-conteudo via apiObterHtmlApp('vinculos')
     Mantém estado próprio e comunica com o host via _vinculosSDK
     ================================================================ -->
<script>
/**
 * Fábrica do contrato entre um app "instalável" e o host que o carrega
 * (ver docs/arquitetura_apps_modulares.md). Cada app cria a PRÓPRIA
 * instância — `var _forumSDK = criarSamaumaSDK();` — e nunca guarda num
 * global genérico (`SamaumaSDK`): o app é entregue por injeção dinâmica de
 * HTML/JS no DOM do host (`apiObterHtmlApp` + `<script>` recriado em
 * runtime), não em <iframe> (testado e bloqueado pelo Google — todo Apps
 * Script já roda dentro de um iframe de sandbox do próprio Google, e um
 * segundo nível pra outro app quebra a autenticação). Sem <iframe>, todo
 * app injetado divide o mesmo escopo global da página — um único objeto
 * `SamaumaSDK` compartilhado colidiria entre dois apps montados ao mesmo
 * tempo (Fase 3). Cada instância guarda seu próprio nome com o PRÓPRIO
 * prefixo de arquivo (`_forumSDK`, `_elementosSDK`, ...), mesma convenção
 * de "todo global leva o prefixo do arquivo" já usada em todo o projeto
 * (ver CLAUDE.md).
 *
 * Regra de ouro: um app nunca chama google.script.run direto nem calcula
 * permissão no cliente — só através da instância do SDK que criar.
 */
function criarSamaumaSDK() {
  var _contexto = null;
  var _visibilidade = { pagina: true, aba: true };
  var _callbacksContexto = [];
  var _callbacksVisibilidade = [];
  var _callbacksPainelFechado = [];
  var _callbackTecla = null;
  var _callbacksTema = [];
  var _aoBadge = null;
  var _aoContagem = null;
  var _aoAlerta = null;
  var _aoDados = null;

  return {
    // Chamado pelo host logo depois de injetar/montar o app, e de novo toda
    // vez que o contexto muda (ex.: usuário trocou de plano).
    iniciar: function (ctx) {
      _contexto = {
        idPlano: ctx.idPlano, permissoes: ctx.permissoes || {},
        usuario: ctx.usuario || {}, plano: ctx.plano || {}
      };
      _callbacksContexto.forEach(function (cb) { cb(_contexto); });
    },

    // Chamado pelo host sempre que a visibilidade da aba do app ou da
    // tela-mãe muda (troca de aba, navegação pra outra tela da SPA).
    notificarVisibilidade: function (v) {
      _visibilidade = { pagina: !!v.pagina, aba: !!v.aba };
      _callbacksVisibilidade.forEach(function (cb) { cb(_visibilidade); });
    },

    // Registra callback para quando o contexto chegar/mudar. Se já tiver
    // chegado antes do registro, dispara imediatamente.
    aoContexto: function (cb) {
      _callbacksContexto.push(cb);
      if (_contexto) cb(_contexto);
    },

    aoVisibilidade: function (cb) {
      _callbacksVisibilidade.push(cb);
      cb(_visibilidade);
    },

    contexto: function () { return _contexto; },
    visibilidade: function () { return _visibilidade; },

    // Notificação de painel lateral fechado pelo host
    notificarPainelFechado: function () {
      _callbacksPainelFechado.forEach(function (cb) { cb(); });
    },
    aoPainelFechado: function (cb) {
      _callbacksPainelFechado.push(cb);
    },

    // Repasse de teclas de atalho (Escape, Ctrl+A) da aba ativa
    notificarTecla: function (evt) {
      if (_callbackTecla) return _callbackTecla(evt);
      return false;
    },
    aoTecla: function (cb) {
      _callbackTecla = cb;
    },

    // Notificação de alternância de tema visual (claro/escuro)
    notificarTema: function (tema) {
      _callbacksTema.forEach(function (cb) { cb(tema); });
    },
    aoTema: function (cb) {
      _callbacksTema.push(cb);
    },

    // O HOST registra aqui como quer reagir ao badge deste app (ex.:
    // atualizar o selo vermelho da própria aba) — o app só reporta o valor.
    aoBadge: function (cb) { _aoBadge = cb; },
    reportarBadge: function (valor) { if (_aoBadge) _aoBadge(valor); },

    // Contagem total do app na própria aba (estilo "141" — diferente de
    // aoBadge/reportarBadge, que é notificação/não-lida, estilo bolinha).
    // PADRÃO DOS CONTADORES DA ABA (vale para todo app, atual ou futuro):
    //  - contagem = TOTAL de itens do app (chip neutro, ex.: 141 elementos);
    //  - alerta   = itens que exigem ação (chip âmbar + tooltip, ex.: "2 vínculos
    //    aguardam sua decisão").
    // Um app pode reportar um, o outro ou os dois. Para aparecerem já na abertura
    // do plano, o app registra um provedor em CONTADORES_APPS (code.js).
    aoContagem: function (cb) { _aoContagem = cb; },
    reportarContagem: function (valor) { if (_aoContagem) _aoContagem(valor); },
    aoAlerta: function (cb) { _aoAlerta = cb; },
    reportarAlerta: function (valor, titulo) { if (_aoAlerta) _aoAlerta(valor, titulo); },

    // Genérico: qualquer app pode publicar um retorno de dados pro host
    // reagir (ex.: Elementos publica a lista atualizada pro host recalcular
    // KPIs do header sem o app precisar conhecer essas outras telas).
    aoDados: function (cb) { _aoDados = cb; },
    reportarDados: function (valor) { if (_aoDados) _aoDados(valor); },

    // Barra lateral de detalhes (#detp-panel — ver docs/arquitetura_apps_modulares.md):
    // "substituição total" — o app manda o HTML pronto e é dono de 100% da
    // marcação dentro do drawer (inclusive de suas próprias tabs/cabeçalho/
    // botão de fechar, se quiser; CSS compartilhado do host — .detp-secao,
    // .detp-linha, .detp-subsecao, .detp-tabs/.detp-tab etc. — já está
    // disponível globalmente pra manter a mesma linguagem visual, mas o app
    // não é obrigado a usá-lo). A casca só garante a moldura do drawer
    // (posição/animação) e o Esc como fallback de fechamento. Único ponto
    // que muda na migração pra um componente de verdade (Angular): a
    // implementação interna, nunca essa assinatura.
    abrirPainel: function (html) { if (typeof window.abrirPainelApp === 'function') window.abrirPainelApp(html); },
    fecharPainel: function () { if (typeof window.fecharPainelDetalhes === 'function') window.fecharPainelDetalhes(); },

    // Embrulha google.script.run.withSuccessHandler/withFailureHandler numa
    // Promise. Único ponto que muda na migração para o backend Node/Express.
    chamar: function (nomeFuncao) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (erro) { reject(erro); });
        runner[nomeFuncao].apply(runner, args);
      });
    }
  };
}
</script>

<script>
// ================================================================
// ESTADO E INSTÂNCIA SDK DO APP VÍNCULOS
// ================================================================
var _vinculosSDK = criarSamaumaSDK();
var _vincCtx = null;
var _vincVis = { pagina: true, aba: true };
var _vincCarregado = false;
var _vincCarregando = false;

var _vincDadosCache = {
  planosVinculados: [],
  propostasEnviadas: [],
  propostasRecebidas: [],
  planosSuperiores: []
};

var estadoVinculos = {
  busca: '', filtroVinc: '', filtroStatus: '', filtroResp: '', filtroTipo: '',
  sort: { col: 'tipo', dir: 'asc' },
  itensPorPagina: 10, paginaAtual: 1,
  selecionados: {}
};
var _vincUltimaChaveClicada = null;

var estadoVincModal = {
  aba: 'superior', busca: '', filtroResp: '',
  paginaAtual: 1, itensPorPagina: 10,
  candidatosSuperior: [], candidatosSubordinado: []
};

// Tipos de vínculo: ordem padrão, rótulo, ícone e frase explicativa (pendências)
var _VINC_TIPO = {
  decidir:     { ord: 0, rot: 'Aguarda você', ico: 'move_to_inbox', tip: 'Pendência que depende da sua decisão' },
  aguardando:  { ord: 1, rot: 'Aguardando',   ico: 'schedule',      tip: 'Pendência que depende do outro plano' },
  superior:    { ord: 2, rot: 'Superior',     ico: 'north',         tip: 'Plano ao qual este plano está subordinado' },
  subordinado: { ord: 3, rot: 'Subordinado',  ico: 'south',         tip: 'Plano subordinado a este plano' }
};

var _VINC_DIR = {
  filho:             { tipo: 'decidir',    txt: 'Pediu para ser subordinado a este plano' },
  proposta_recebida: { tipo: 'decidir',    txt: 'Propôs que este plano seja subordinado a ele' },
  superior:          { tipo: 'aguardando', txt: 'Você pediu vínculo como plano superior · aguardando aprovação' },
  proposta_enviada:  { tipo: 'aguardando', txt: 'Você propôs que ele seja subordinado a este plano · aguardando aceite' }
};

var _VINC_COR_STATUS = {
  'Em Elaboração': '#1a56db', 'Em Análise': '#b08400', 'Em Execução': '#137333', 'Em Avaliação': '#c5221f',
  'Finalizado': '#1a56db', 'Prorrogado': '#e65100', 'Em Revisão': '#6a1b9a', 'Cancelado': '#8a94a3', 'Excluído': '#8a94a3'
};

var _vincFiltrosDef = {
  vinc:   { label: 'Vínculo',       chave: 'filtroVinc' },
  status: { label: 'Status',        chave: 'filtroStatus' },
  resp:   { label: 'Responsável',   chave: 'filtroResp' },
  tipo:   { label: 'Tipo',          chave: 'filtroTipo' }
};

function _vincBadgeStatus(status) {
  var mapa = {
    'Em Elaboração': '#e8f0fe|#1a56db', 'Em Análise': '#fff3cd|#856404',
    'Em Execução': '#e6f4ea|#137333',   'Em Avaliação': '#fce8e6|#c5221f',
    'Finalizado': '#e8f0fe|#1a56db',    'Prorrogado': '#fff8e1|#e65100',
    'Em Revisão': '#f3e8fd|#6a1b9a',    'Cancelado': '#f5f5f5|#555',
    'Excluído': '#f5f5f5|#555'
  };
  var cores = (mapa[status] || '#f5f5f5|#555').split('|');
  return '<span class="badge-status" style="background:' + cores[0] + ';color:' + cores[1] + '">' + escapeHtml(status || '') + '</span>';
}

function _vincChave(p) { return p.vtipo + ':' + p.id + (p.idVinculo ? ':' + p.idVinculo : ''); }

function _vincMapSuperior(p) {
  return {
    idVinculo: p.idVinculo, id: p.id, nome: p.nome || '(sem nome)', tipo: p.tipo || '', status: p.status || '',
    responsavel: p.responsavel || p.resp || '', tipoResponsavel: p.tipoResponsavel || p.tipoResp || '',
    respAdicionaisNomes: p.respAdicionaisNomes || [],
    statusVinculo: p.statusVinculo, papel: p.papel, anoInicio: p.anoInicio || '', anoFim: p.anoFim || '',
    progresso: (p.progresso !== undefined && p.progresso !== null) ? p.progresso : null
  };
}

function _vincDados() {
  var vinculados = _vincDadosCache.planosVinculados || [];
  var superiores = _vincDadosCache.planosSuperiores || [];

  var superAprov = superiores.filter(function(p) { return p.statusVinculo === 'Aprovado'; }).map(_vincMapSuperior);
  var subAprov = vinculados.filter(function(p) { return p.statusVinculo !== 'Pendente'; });
  var pendentes = [];
  superiores.filter(function(p) { return p.statusVinculo === 'Pendente'; }).forEach(function(p) {
    pendentes.push(Object.assign(_vincMapSuperior(p), { direcao: 'superior' }));
  });
  vinculados.filter(function(p) { return p.statusVinculo === 'Pendente'; }).forEach(function(p) {
    pendentes.push(Object.assign({}, p, { direcao: 'filho' }));
  });
  (_vincDadosCache.propostasEnviadas || []).forEach(function(p) {
    pendentes.push(Object.assign({}, p, { direcao: 'proposta_enviada' }));
  });
  (_vincDadosCache.propostasRecebidas || []).forEach(function(p) {
    pendentes.push(Object.assign({}, p, { direcao: 'proposta_recebida' }));
  });
  return { superAprov: superAprov, subAprov: subAprov, pendentes: pendentes };
}

function _vincListaUnica() {
  var d = _vincDados();
  var lista = []
    .concat(d.pendentes.map(function(p) { return Object.assign({}, p, { vtipo: (_VINC_DIR[p.direcao] || {}).tipo || 'aguardando' }); }))
    .concat(d.superAprov.map(function(p) { return Object.assign({}, p, { vtipo: 'superior' }); }))
    .concat(d.subAprov.map(function(p) { return Object.assign({}, p, { vtipo: 'subordinado' }); }));
  return lista.sort(function(a, b) {
    return (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
  });
}

function _vincTemFiltro() {
  var e = estadoVinculos;
  return !!(e.busca || e.filtroVinc || e.filtroStatus || e.filtroResp || e.filtroTipo);
}

function _vincFiltrar(lista, ignorar) {
  var e = estadoVinculos, busca = (e.busca || '').toLowerCase();
  return lista.filter(function(p) {
    if (busca && String(p.nome || '').toLowerCase().indexOf(busca) === -1) return false;
    if (ignorar !== 'vinc'   && e.filtroVinc   && p.vtipo !== e.filtroVinc) return false;
    if (ignorar !== 'status' && e.filtroStatus && p.status !== e.filtroStatus) return false;
    if (ignorar !== 'resp'   && e.filtroResp   && p.responsavel !== e.filtroResp) return false;
    if (ignorar !== 'tipo'   && e.filtroTipo   && p.tipo !== e.filtroTipo) return false;
    return true;
  });
}

function _vincSortLista(lista) {
  var col = (estadoVinculos.sort && estadoVinculos.sort.col) || 'tipo';
  var dir = (estadoVinculos.sort && estadoVinculos.sort.dir) || 'asc';
  return lista.slice().sort(function(a, b) {
    var res = 0;
    if (col === 'nome') {
      var na = String(a.nome || '').toLowerCase();
      var nb = String(b.nome || '').toLowerCase();
      res = na.localeCompare(nb, 'pt') || (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord);
    } else if (col === 'responsavel') {
      var ra = String(nomeRespExibicao(a.responsavel, a.tipoResponsavel) || '').toLowerCase();
      var rb = String(nomeRespExibicao(b.responsavel, b.tipoResponsavel) || '').toLowerCase();
      res = ra.localeCompare(rb, 'pt') || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else if (col === 'status') {
      var sa = String(a.status || '').toLowerCase();
      var sb = String(b.status || '').toLowerCase();
      res = sa.localeCompare(sb, 'pt') || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else if (col === 'progresso') {
      var pa = (a.progresso == null || isNaN(Number(a.progresso))) ? -1 : Number(a.progresso);
      var pb = (b.progresso == null || isNaN(Number(b.progresso))) ? -1 : Number(b.progresso);
      res = (pa - pb) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else {
      res = (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    }
    return dir === 'asc' ? res : -res;
  });
}

function vincOrdenarPorColuna(col) {
  if (!estadoVinculos.sort) estadoVinculos.sort = { col: 'tipo', dir: 'asc' };
  if (estadoVinculos.sort.col === col) {
    estadoVinculos.sort.dir = estadoVinculos.sort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    estadoVinculos.sort.col = col;
    estadoVinculos.sort.dir = 'asc';
  }
  estadoVinculos.paginaAtual = 1;

}

function vincAbrirFiltro(campo, ev) {
  ev.stopPropagation();
  var def = _vincFiltrosDef[campo], atual = estadoVinculos[def.chave];
  var base = _vincFiltrar(_vincListaUnica(), campo);
  var mapa = {};
  base.forEach(function(p) {
    var v, label, extra = {};
    if (campo === 'vinc')        { v = p.vtipo; label = _VINC_TIPO[v].rot; extra.ico = _VINC_TIPO[v].ico; }
    else if (campo === 'status') { if (!p.status) return; v = p.status; label = v; extra.dot = _VINC_COR_STATUS[v] || '#8a94a3'; }
    else if (campo === 'resp')   { if (!p.responsavel) return; v = p.responsavel; label = nomeRespExibicao(p.responsavel, p.tipoResponsavel); }
    else                         { if (!p.tipo) return; v = p.tipo; label = v; }
    if (!mapa[v]) mapa[v] = Object.assign({ v: v, label: label, n: 0 }, extra);
    mapa[v].n++;
  });
  var opcoes = Object.keys(mapa).map(function(k) { return mapa[k]; });
  opcoes.sort(campo === 'vinc'
    ? function(a, b) { return _VINC_TIPO[a.v].ord - _VINC_TIPO[b.v].ord; }
    : function(a, b) { return a.label.localeCompare(b.label, 'pt'); });
  if (!opcoes.length) return;
  var itens = [{ label: 'Todos', ativo: !atual, onclick: "vincSelecionarFiltro('" + campo + "','')" }]
    .concat(opcoes.map(function(o) {
      var it = { label: o.label, ativo: o.v === atual, onclick: "vincSelecionarFiltro('" + campo + "','" + escapeJsAttr(o.v) + "')" };
      if (o.dot) it.dot = o.dot;
      if (o.ico) it.icone = o.ico;
      return it;
    }));
  if (typeof abrirMenuSelecao === 'function') abrirMenuSelecao(ev.currentTarget, [{ itens: itens }]);
}

  var totalPags = Math.max(1, Math.ceil(total / itensPag));

  if (estadoVinculos.paginaAtual < 1) estadoVinculos.paginaAtual = 1;

    var itensPag = estadoVinculos.itensPorPagina;

    var pagina = listaVisivel.slice(start, start + itensPag);

  } else if (ev.ctrlKey || ev.metaKey) {

function _vincSelecionarIntervalo(chaveA, chaveB, pagina) {
  var rows = pagina || _vincSortLista(_vincFiltrar(_vincListaUnica()));

  var idxB = rows.findIndex(function(r) { return _vincChave(r) === String(chaveB); });
  if (idxA < 0 || idxB < 0) return;
  var min = Math.min(idxA, idxB), max = Math.max(idxA, idxB);
  for (var i = min; i <= max; i++) {
    estadoVinculos.selecionados[_vincChave(rows[i])] = true;

function _vpFiltrar(lista) {
  var busca = estadoVincModal.busca.toLowerCase();
  var fResp = estadoVincModal.filtroResp;
  return lista.filter(function(p) {
    if (busca && String(p.nome || '').toLowerCase().indexOf(busca) === -1) return false;
    if (fResp && p.responsavel !== fResp) return false;
    return true;
  });
}

function vpRenderLista() {
  var tbody = document.getElementById('vp-tbody');
  var pag = document.getElementById('vp-pagination');
  if (!tbody || !pag) return;

  var listaCompleta = _vpFiltrar(_vpListaAtiva());
  var total = listaCompleta.length;
  var itensPag = estadoVincModal.itensPorPagina;
  var totalPags = Math.max(1, Math.ceil(total / itensPag));
  if (estadoVincModal.paginaAtual > totalPags) estadoVincModal.paginaAtual = totalPags;
  var start = (estadoVincModal.paginaAtual - 1) * itensPag;
  var lista = listaCompleta.slice(start, start + itensPag);

  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px 12px;color:var(--ds-color-text-muted);font-size:0.85rem">'
      + 'Nenhum plano ' + (estadoVincModal.aba === 'superior' ? 'disponível como superior' : 'disponível para se tornar subordinado') + '.</td></tr>';
    pag.classList.add('hidden');
    return;
  }

  tbody.innerHTML = lista.map(function(p) {
    var idj = escapeHtml(String(p.id));
    var nomeJs = escapeJsAttr(p.nome);
    var vigencia = p.anoInicio && p.anoFim ? p.anoInicio + '–' + p.anoFim : (p.anoInicio || p.anoFim || '—');
    var acao = estadoVincModal.aba === 'superior'
      ? '<button class="btn btn-primary btn-sm" onclick="vpVincularSuperior(\'' + idj + '\',\'' + nomeJs + '\')">Vincular</button>'
      : '<button class="btn btn-outline btn-sm" onclick="vpSolicitarSubordinado(\'' + idj + '\',\'' + nomeJs + '\')">Solicitar Vínculo</button>';
    return '<tr>'
      + '<td>' + escapeHtml(p.tipo || '—') + '</td>'
      + '<td>' + escapeHtml(p.nome) + '</td>'
      + '<td>' + vigencia + '</td>'
      + '<td>' + escapeHtml(p.responsavel || '—') + '</td>'
      + '<td>' + _vincBadgeStatus(p.status) + '</td>'
      + '<td style="text-align:right">' + acao + '</td>'
      + '</tr>';
  }).join('');

  pag.classList.remove('hidden');
  var fim = Math.min(start + itensPag, total);
  var cnt = document.getElementById('vp-pag-counter');
  if (cnt) cnt.textContent = (total === 0 ? '0' : (start + 1) + '–' + fim) + ' de ' + total;
  var sel = document.getElementById('vp-pag-selector');
  if (sel) {
    sel.innerHTML = '';
    for (var i = 1; i <= totalPags; i++) {
      var opt = document.createElement('option');
      opt.value = i; opt.text = i;
      if (i === estadoVincModal.paginaAtual) opt.selected = true;
      sel.appendChild(opt);
    }
  }
  var btnPrev = pag.querySelector('.btn-pag[onclick*="prev"]');
  var btnNext = pag.querySelector('.btn-pag[onclick*="next"]');
  if (btnPrev) btnPrev.disabled = (estadoVincModal.paginaAtual === 1);
  if (btnNext) btnNext.disabled = (estadoVincModal.paginaAtual >= totalPags);
}

function vpVincularSuperior(idAlvo, nomeAlvo) {
  var idPlanoAtual = _vincCtx && _vincCtx.idPlano;
  if (!idPlanoAtual) return;
  showConfirm(
    'Vincular Plano?',
    'Deseja vincular este plano a <strong>' + escapeHtml(nomeAlvo) + '</strong> como plano superior?',
    function() {
      mostrarLoader();
      google.script.run
        .withSuccessHandler(function() {
          esconderLoader();
          fecharModalVincularPlano();
          showMessage('success', 'Vinculado', 'Plano superior definido.');
          carregarAbaVinculos();
        })
        .withFailureHandler(function(err) { esconderLoader(); showMessage('error', 'Erro', escapeHtml(err.message)); })
        .apiVincularASuperior(idPlanoAtual, idAlvo);
    }
  );
}

function vpSolicitarSubordinado(idAlvo, nomeAlvo) {
  var idPlanoAtual = _vincCtx && _vincCtx.idPlano;
  if (!idPlanoAtual) return;
  showConfirm(
    'Solicitar Vínculo?',
    'Deseja propor que <strong>' + escapeHtml(nomeAlvo) + '</strong> se torne subordinado deste plano? A outra parte precisa aceitar antes do vínculo valer.',
    function() {
      mostrarLoader();
      google.script.run
        .withSuccessHandler(function() {
          esconderLoader();
          fecharModalVincularPlano();
          showMessage('success', 'Proposta enviada', 'Aguardando aceite do responsável do plano.');
          carregarAbaVinculos();
        })
        .withFailureHandler(function(err) { esconderLoader(); showMessage('error', 'Erro', escapeHtml(err.message)); })
        .apiPropoQuerVinculoSubordinado(idPlanoAtual, idAlvo);
    }
  );
}

// ================================================================
// CARREGAMENTO DOS DADOS DO APP
// ================================================================
function carregarAbaVinculos() {
  var idPlano = _vincCtx && _vincCtx.idPlano;
  if (!idPlano) return;
  _vincCarregando = true;

  renderizarTabelaVinculos();
  var tbodyVinc = document.getElementById('vinc-tbody');
  if (tbodyVinc) tbodyVinc.innerHTML = '<tr class="el-linha-msg"><td colspan="7" style="padding:0">' + spinnerListaHTML() + '</td></tr>';

  _vinculosSDK.chamar('apiGetAbaVinculos', idPlano).then(function(res) {
    if (!_vincCtx || String(_vincCtx.idPlano) !== String(idPlano)) return; // resposta de um plano já abandonado
    _vincCarregando = false;
    _vincCarregado = true;
    _vincDadosCache = {
      planosVinculados: (res && res.planosVinculados) || [],
      propostasEnviadas: (res && res.propostasEnviadas) || [],
      propostasRecebidas: (res && res.propostasRecebidas) || [],
      planosSuperiores: (res && res.planosSuperiores) || []
    };
    // O resumo do plano no cabeçalho (planosSuperiores) pertence ao host: informa via SDK
    _vinculosSDK.reportarDados({ plano: { planosSuperiores: _vincDadosCache.planosSuperiores } });
    _vincAtualizarContadorAba();
    renderizarTabelaVinculos();
  }, function(err) {
    if (!_vincCtx || String(_vincCtx.idPlano) !== String(idPlano)) return;
    _vincCarregando = false;
    var el = document.getElementById('vinc-tbody');
    if (el) el.innerHTML = '<tr class="el-linha-msg"><td colspan="7" style="text-align:center;padding:20px;color:var(--ds-color-danger)">' + escapeHtml(err.message) + '</td></tr>';
  });
}

function atualizarAbaVinculos() { carregarAbaVinculos(); }

// ================================================================
// HANDSHAKE COM O HOST
// ================================================================
_vinculosSDK.aoVisibilidade(function(v) {
  _vincVis = v;
  if (v.aba && v.pagina && _vincCtx && !_vincCarregado && !_vincCarregando) {
    carregarAbaVinculos();
  }
});

_vinculosSDK.aoContexto(function(ctx) {
  if (_vincCtx && String(_vincCtx.idPlano) === String(ctx.idPlano)) {
    _vincCtx = ctx;
    if (_vincCarregado) {
      renderizarTabelaVinculos();
      _vincAtualizarContadorAba();
    }
    return;
  }
  _vincCtx = ctx;
  _vincCarregado = false;
  _vincCarregando = false;
  _vincDadosCache = { planosVinculados: [], propostasEnviadas: [], propostasRecebidas: [], planosSuperiores: [] };
  estadoVinculos.busca = '';
  estadoVinculos.filtroVinc = '';
  estadoVinculos.filtroStatus = '';
  estadoVinculos.filtroResp = '';
  estadoVinculos.filtroTipo = '';
  estadoVinculos.paginaAtual = 1;
  estadoVinculos.selecionados = {};
  if (_vincVis.aba && _vincVis.pagina) {
    carregarAbaVinculos();
  }
});

_vinculosSDK.aoTecla(function(evt) {
  if (evt.key === 'Escape') {
    if (typeof vincCancelarSelecao === 'function' && Object.keys(estadoVinculos.selecionados || {}).length > 0) {
      vincCancelarSelecao();
      return true;
    }
  } else if ((evt.ctrlKey || evt.metaKey) && !evt.altKey && !evt.shiftKey && String(evt.key).toLowerCase() === 'a') {
    if (typeof vincToggleSelecionarTodos === 'function') {
      vincToggleSelecionarTodos(true);
      return true;
    }
  }
  return false;
});

// Compatibilidade global
window.carregarAbaVinculos = carregarAbaVinculos;
window.atualizarAbaVinculos = atualizarAbaVinculos;
window.renderizarTabelaVinculos = renderizarTabelaVinculos;
window.abrirModalVincularPlano = abrirModalVincularPlano;
window.fecharModalVincularPlano = fecharModalVincularPlano;
window.vincToggleSelecionarTodos = vincToggleSelecionarTodos;
window.vincCancelarSelecao = vincCancelarSelecao;
window.estadoVinculos = estadoVinculos;
window._vinculosSDK = _vinculosSDK;
</script>
