<style>

.vinc-lista tbody tr.vinc-row--aguardando:not(.selecionada) td,

/* situação: só ícone colorido; a explicação fica no tooltip */

/* nível do plano: mesmo visual de .pll-tipo (lista de planos), com largura fixa para os nomes alinharem */

.vinc-nivel { flex: none; box-sizing: border-box; width: 96px; text-align: center; overflow: hidden; text-overflow: ellipsis;

/* decisão (Aguarda você): botões com texto + ⋮ */

/* desvinculado: linha expansível (chevron .el-toggle-btn do host, igual à aba Elementos) */

.vinc-sub-cel { display: flex; align-items: center; gap: 16px; min-width: 0; padding-left: 106px; }

/* barra lateral */
.vinc-detp-cab { margin-bottom: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

/* colunas que saem: a célula continua na tabela (largura 0), só o conteúdo some — nada desloca */
@media (min-width: 769px) and (max-width: 1280px) {
  .vinc-lista col.vinc-c-prog { width: 0; }

}
@media (min-width: 769px) and (max-width: 1100px) {

  .vinc-lista .vinc-c-resp > *, .vinc-lista .vinc-c-status > * { display: none !important; }
  .vinc-lista.tem-decisao col.vinc-c-acoes, .vinc-lista.tem-decisao .vinc-c-acoes { width: 124px; }

  .vinc-lista .vinc-decisao .ds-btn .material-symbols-outlined { font-size: 18px; }
  .vinc-sub-cel { padding-left: 0; }
}

/* mobile: galeria de cards (3 linhas), só o ⋮ */
@media (max-width: 768px) {

  .vinc-lista colgroup { display: none; }
  .vinc-lista thead { display: block; margin-bottom: 10px; }

  .vinc-lista thead th { display: none; padding: 0; border: none; position: static; }

  .vinc-lista tbody tr.vinc-row {

    grid-template-areas: "chk exp sit nivel status acoes" "nome nome nome nome nome nome" "resp resp resp resp resp prog";
    gap: 6px 8px; align-items: center; padding: 10px 12px; margin-bottom: 10px;

  .vinc-lista tbody tr.vinc-row--aguardando:not(.selecionada),

  .vinc-lista tbody tr.vinc-row td.el-col-expand { grid-area: exp; }
  .vinc-lista tbody tr.vinc-row td.vinc-c-sit { grid-area: sit; }
  .vinc-lista tbody tr.vinc-row td.vinc-c-nome, .vinc-lista tbody tr.vinc-row .vinc-plano { display: contents; }

  .vinc-lista tbody tr.vinc-row .vinc-nivel--vazio { display: none; }

  .vinc-lista tbody tr.vinc-row .acoes-linha { opacity: 1; }
  .vinc-lista .vinc-decisao .ds-btn { display: none; }
  .vinc-lista tbody tr.vinc-sub.vinc-visivel { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px 14px; padding: 8px 12px;

  .vinc-lista tbody tr.vinc-sub td.el-col-check, .vinc-lista tbody tr.vinc-sub td.el-col-expand, .vinc-lista tbody tr.vinc-sub td.vinc-c-acoes { display: none; }
  .vinc-lista tbody tr.vinc-sub td.vinc-c-nome { flex: 1 1 auto; overflow: hidden; }
  .vinc-sub-cel { padding-left: 0; gap: 10px; }
  .vinc-lista tbody tr.el-linha-msg { display: block; }
  .vinc-lista tbody tr.el-linha-msg td { display: block; padding: 32px 12px !important; }
}

var _VINC_COR_STATUS = {

function vincAcaoLote(acao) {
  var lista = _vincSelecionadosLista();

  var p = lista[0];
  if (acao === 'detalhes') return vincAbrirDetalhesPlano(_vincChave(p));
  if (acao === 'abrir') return carregarDetalhesPlano(String(p.id));
  if (acao === 'exportar') return exportarVinculosCSV();
  var idv = String(p.idVinculo || ''), nome = p.nome || '';
  if (lista.length === 1) {            // um só item: mesmos diálogos da linha
    if (acao === 'aprovar')     return p.direcao === 'filho' ? aprovarVinculoPlano(idv, nome) : responderPropostaVinculo(idv, nome, 'ACEITAR');
    if (acao === 'dispensar')   return vincDispensarRecusado(idv, nome);
    if (acao === 'recusar')     return p.direcao === 'filho' ? desvincularVinculo(idv, nome, true) : responderPropostaVinculo(idv, nome, 'RECUSAR');
    if (acao === 'cancelar')    return p.direcao === 'proposta_enviada' ? cancelarPropostaVinculo(idv, nome) : desvincularVinculo(idv, nome);
    if (acao === 'desvincular') return desvincularVinculo(idv, nome);
    if (acao === 'excluirorf')  return vincExcluirOrfaos(String(p.id));
  }
  var t = _VINC_TXT_LOTE[acao];
  if (!t) return;
  showConfirm(t.tit, 'Deseja ' + t.msg + ' ' + lista.length + (acao === 'excluirorf' ? ' planos?' : ' itens selecionados?'), function() {
    mostrarLoader();
    var erros = [], i = 0;

        estadoVinculos.selecionados = {};

        carregarAbaVinculos();
        return;

      google.script.run
        .withSuccessHandler(prox)
        .withFailureHandler(function(err) { erros.push((err && err.message) || String(err)); prox(); })[c[0]](...c.slice(1));
    })();
  });
}

function _vincChave(p) { return p.vtipo + ':' + p.id + (p.idVinculo ? ':' + p.idVinculo : ''); }

function _vincMapSuperior(p) {
  return {
    idVinculo: p.idVinculo, id: p.id, nome: p.nome || '(sem nome)', tipo: p.tipo || '', status: p.status || '',
    responsavel: p.responsavel || p.resp || '', tipoResponsavel: p.tipoResponsavel || p.tipoResp || '',

    statusVinculo: p.statusVinculo, papel: p.papel, anoInicio: p.anoInicio || '', anoFim: p.anoFim || '',

function _vincDados() {
  var vinculados = _vincDadosCache.planosVinculados || [];
  var superiores = _vincDadosCache.planosSuperiores || [];

  var superAprov = superiores.filter(function(p) { return p.statusVinculo === 'Aprovado'; }).map(_vincMapSuperior);
  var subAprov = vinculados.filter(function(p) { return p.statusVinculo !== 'Pendente'; }).map(_vincMapSuperior);
  var pendentes = [];
  superiores.filter(function(p) { return p.statusVinculo === 'Pendente'; }).forEach(function(p) {
    pendentes.push(Object.assign(_vincMapSuperior(p), { direcao: 'superior' }));
  });
  vinculados.filter(function(p) { return p.statusVinculo === 'Pendente'; }).forEach(function(p) {
    pendentes.push(Object.assign(_vincMapSuperior(p), { direcao: 'filho' }));
  });
  (_vincDadosCache.propostasEnviadas || []).forEach(function(p) {
    pendentes.push(Object.assign(_vincMapSuperior(p), { direcao: 'proposta_enviada' }));
  });
  (_vincDadosCache.propostasRecebidas || []).forEach(function(p) {
    pendentes.push(Object.assign(_vincMapSuperior(p), { direcao: 'proposta_recebida' }));
  });
  var desvinculados = (_vincDadosCache.desvinculados || []).map(function(d) {
    var els = (d.elementos || []).length, inds = (d.indicadores || []).length;
    var partes = [];
    if (els) partes.push(_vincPlural(els, 'elemento', 'elementos'));
    if (inds) partes.push(_vincPlural(inds, 'indicador', 'indicadores'));
    var lixeira = d.status === 'Excluído' && !d.desvinculadoEm;
    return {
      id: d.idPlanoSuperior, nome: d.nomePlanoSuperior || '(sem nome)', tipo: d.tipo || '', status: d.status || '',
      responsavel: d.responsavel || '', tipoResponsavel: d.tipoResponsavel || '', respAdicionaisNomes: d.respAdicionaisNomes || [],
      anoInicio: d.anoInicio || '', anoFim: d.anoFim || '', progresso: (d.progresso !== undefined && d.progresso !== null) ? d.progresso : null,
      direcao: 'desvinculado',
      desvinculadoEm: d.desvinculadoEm || '', desvinculadoPor: d.desvinculadoPor || '', vinculoAtual: d.vinculoAtual || '',
      lixeira: lixeira,
      subTxt: (lixeira ? 'Plano na lixeira' : 'Desvinculado em ' + (d.desvinculadoEm || '—') + (d.desvinculadoPor ? ' por ' + d.desvinculadoPor : ''))
        + (partes.length ? ' · ' + partes.join(' e ') + ' sem efeito' + (lixeira ? '; voltam a valer se o plano for restaurado' : '') : '') + (d.vinculoAtual === 'Pendente' ? ' · novo pedido aguardando aprovação' : '')
    };
  });
  // recusadas: só chegam para quem pediu/propôs. Direção no tooltip, como as pendentes.
  var recusadas = (_vincDadosCache.recusadas || []).map(function(r) {
    var dirTxt = r.direcao === 'proposta' ? 'Você propôs que ele seja subordinado a este plano' : 'Você pediu vínculo a este plano superior';
    var quando = [r.recusadoPor ? 'por ' + r.recusadoPor : '', r.recusadoEm ? 'em ' + r.recusadoEm : ''].filter(Boolean).join(' ');

function _vincListaUnica() {
  var d = _vincDados();
  var lista = []
    .concat(d.desvinculados.map(function(p) { return Object.assign({}, p, { vtipo: 'desvinculado' }); }))
    .concat(d.recusadas.map(function(p) { return Object.assign({}, p, { vtipo: 'recusado' }); }))
    .concat(d.pendentes.map(function(p) { return Object.assign({}, p, { vtipo: (_VINC_DIR[p.direcao] || {}).tipo || 'aguardando' }); }))
    .concat(d.superAprov.map(function(p) { return Object.assign({}, p, { vtipo: 'superior' }); }))
    .concat(d.subAprov.map(function(p) { return Object.assign({}, p, { vtipo: 'subordinado' }); }));
  return lista.sort(function(a, b) {
    return (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
  });
}

function _vincTemFiltro() {
  var e = estadoVinculos;
  return !!(e.busca || e.filtroVinc || e.filtroStatus || e.filtroResp || e.filtroTipo);
}

function _vincFiltrar(lista, ignorar) {
  var e = estadoVinculos, busca = (e.busca || '').toLowerCase();
  return lista.filter(function(p) {
    if (busca && String(p.nome || '').toLowerCase().indexOf(busca) === -1) return false;
    if (ignorar !== 'vinc'   && e.filtroVinc   && p.vtipo !== e.filtroVinc) return false;
    if (ignorar !== 'status' && e.filtroStatus && p.status !== e.filtroStatus) return false;
    if (ignorar !== 'resp'   && e.filtroResp   && p.responsavel !== e.filtroResp) return false;
    if (ignorar !== 'tipo'   && e.filtroTipo   && p.tipo !== e.filtroTipo) return false;
    return true;
  });
}

function _vincSortLista(lista) {
  var col = (estadoVinculos.sort && estadoVinculos.sort.col) || 'tipo';
  var dir = (estadoVinculos.sort && estadoVinculos.sort.dir) || 'asc';
  return lista.slice().sort(function(a, b) {
    var res = 0;
    if (col === 'nome') {
      var na = String(a.nome || '').toLowerCase();
      var nb = String(b.nome || '').toLowerCase();
      res = na.localeCompare(nb, 'pt') || (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord);
    } else if (col === 'responsavel') {
      var ra = String(nomeRespExibicao(a.responsavel, a.tipoResponsavel) || '').toLowerCase();
      var rb = String(nomeRespExibicao(b.responsavel, b.tipoResponsavel) || '').toLowerCase();
      res = ra.localeCompare(rb, 'pt') || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else if (col === 'status') {
      var sa = String(a.status || '').toLowerCase();
      var sb = String(b.status || '').toLowerCase();
      res = sa.localeCompare(sb, 'pt') || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else if (col === 'progresso') {
      var pa = (a.progresso == null || isNaN(Number(a.progresso))) ? -1 : Number(a.progresso);
      var pb = (b.progresso == null || isNaN(Number(b.progresso))) ? -1 : Number(b.progresso);
      res = (pa - pb) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    } else {
      res = (_VINC_TIPO[a.vtipo].ord - _VINC_TIPO[b.vtipo].ord) || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt');
    }
    return dir === 'asc' ? res : -res;
  });
}

function vincOrdenarPorColuna(col) {
  if (!estadoVinculos.sort) estadoVinculos.sort = { col: 'tipo', dir: 'asc' };
  if (estadoVinculos.sort.col === col) {
    estadoVinculos.sort.dir = estadoVinculos.sort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    estadoVinculos.sort.col = col;

// expande/recolhe sem re-renderizar (o duplo clique para abrir a barra lateral continua funcionando)

function _vincRenderCorpo() {
  var tbody = document.getElementById('vinc-tbody');
  if (!tbody) return;
  var podeEditar = !!(_vincCtx && _vincCtx.permissoes && _vincCtx.permissoes.vincular);
  var todos = _vincListaUnica();
  var listaCompleta = _vincSortLista(_vincFiltrar(todos));
  var total = listaCompleta.length, itensPag = estadoVinculos.itensPorPagina;
  var totalPags = Math.max(1, Math.ceil(total / itensPag));
  if (estadoVinculos.paginaAtual > totalPags) estadoVinculos.paginaAtual = totalPags;
  if (estadoVinculos.paginaAtual < 1) estadoVinculos.paginaAtual = 1;
  var start = (estadoVinculos.paginaAtual - 1) * itensPag;
  var lista = listaCompleta.slice(start, start + itensPag);

  _vincAtualizarContadorAba();
  _vincAtualizarIconesOrdenacao();

  if (!lista.length) {
    var vz = !todos.length
      ? { icon: 'link', titulo: 'Nenhum vínculo' }
      : { icon: 'filter_alt_off', titulo: 'Nenhum resultado para os filtros' };
    tbody.innerHTML = '<tr class="el-linha-msg"><td colspan="8"><div class="el-empty-state"><span class="material-symbols-outlined el-esi">' + vz.icon + '</span>'
      + '<p class="el-esti">' + vz.titulo + '</p></div></td></tr>';
    _vincAtualizarPaginacao(0, 0);
    _vincAtualizarSelecao([]);

  var tab = document.getElementById('vinc-tabela');
  if (tab) tab.classList.toggle('tem-decisao', podeEditar && lista.some(function(p) { return p.vtipo === 'decidir'; }));
  tbody.innerHTML = lista.map(function(p) {
    return _vincLinhaHTML(p, podeEditar) + (p.vtipo === 'desvinculado' ? _vincOrfItensHTML(p) : '');
  }).join('');
  _vincAtualizarPaginacao(total, start);
  _vincAtualizarSelecao(listaCompleta);
}

function vincMudarPagina(dir) {
  var total = _vincFiltrar(_vincListaUnica()).length;
  var totalPags = Math.max(1, Math.ceil(total / estadoVinculos.itensPorPagina));
  if (dir === 'prev' && estadoVinculos.paginaAtual > 1) estadoVinculos.paginaAtual--;
  if (dir === 'next' && estadoVinculos.paginaAtual < totalPags) estadoVinculos.paginaAtual++;
  if (estadoVinculos.paginaAtual < 1) estadoVinculos.paginaAtual = 1;
  if (estadoVinculos.paginaAtual > totalPags) estadoVinculos.paginaAtual = totalPags;
  _vincRenderCorpo();
}

function vincIrParaPagina(pg) {
  var total = _vincFiltrar(_vincListaUnica()).length;
  var totalPags = Math.max(1, Math.ceil(total / estadoVinculos.itensPorPagina));
  var p = parseInt(pg, 10) || 1;
  estadoVinculos.paginaAtual = Math.min(Math.max(1, p), totalPags);
  _vincRenderCorpo();
}

function _vincAtualizarPaginacao(total, start) {
  var pag = document.getElementById('vinc-pagination');
  if (pag) pag.classList.remove('hidden');
  if (typeof _atualizarBarraPaginacao === 'function') {
    _atualizarBarraPaginacao('vinc', estadoVinculos, total, start);
  }
}

function vincCliqueLinha(ev, chave) {
  if (ev.target.closest('input, button, a, .acoes-linha, .vinc-decisao')) return;
  var chaveStr = String(chave);
  var tr = ev.currentTarget;
  if (tr && tr.classList && tr.classList.contains('vinc-row--desvinculado')) { vincOrfToggle(tr.getAttribute('data-orf')); return; }

  if (ev.shiftKey && _vincUltimaChaveClicada) {
    var listaVisivel = _vincSortLista(_vincFiltrar(_vincListaUnica()));
    var itensPag = estadoVinculos.itensPorPagina;
    var start = (estadoVinculos.paginaAtual - 1) * itensPag;
    var pagina = listaVisivel.slice(start, start + itensPag);
    _vincSelecionarIntervalo(_vincUltimaChaveClicada, chaveStr, pagina);
    _vincAtualizarSelecaoVisual();
    return;
  } else if (ev.ctrlKey || ev.metaKey) {
    if (estadoVinculos.selecionados[chaveStr]) delete estadoVinculos.selecionados[chaveStr];
    else estadoVinculos.selecionados[chaveStr] = true;
    _vincUltimaChaveClicada = chaveStr;
    _vincAtualizarSelecaoVisual();
    return;
  }

  estadoVinculos.selecionados = {};
  estadoVinculos.selecionados[chaveStr] = true;
  _vincUltimaChaveClicada = chaveStr;
  _vincAtualizarSelecaoVisual();
}

function _vincSelecionarIntervalo(chaveA, chaveB, pagina) {
  var rows = pagina || _vincSortLista(_vincFiltrar(_vincListaUnica()));
  var idxA = rows.findIndex(function(r) { return _vincChave(r) === String(chaveA); });
  var idxB = rows.findIndex(function(r) { return _vincChave(r) === String(chaveB); });
  if (idxA < 0 || idxB < 0) return;
  var min = Math.min(idxA, idxB), max = Math.max(idxA, idxB);
  for (var i = min; i <= max; i++) {
    estadoVinculos.selecionados[_vincChave(rows[i])] = true;
  }
}

function _vincAtualizarSelecaoVisual() {
  var rows = document.querySelectorAll('#vinc-tbody tr.vinc-row[data-chave]');
  rows.forEach(function(tr) {
    var chave = tr.dataset.chave;
    var sel = !!(chave && estadoVinculos.selecionados[chave]);
    tr.classList.toggle('selecionada', sel);
    var chk = tr.querySelector('input[type="checkbox"]');
    if (chk) chk.checked = sel;
  });
  var todos = _vincListaUnica();
  var listaCompleta = _vincSortLista(_vincFiltrar(todos));
  _vincAtualizarSelecao(listaCompleta);
}

function vincToggleSelecao(chave, marcado) {
  var chaveStr = String(chave);
  if (marcado) {
    estadoVinculos.selecionados[chaveStr] = true;
    _vincUltimaChaveClicada = chaveStr;
  } else {
    delete estadoVinculos.selecionados[chaveStr];
  }
  _vincAtualizarSelecaoVisual();
}

function vincToggleSelecionarTodos(marcado) {
  estadoVinculos.selecionados = {};
  if (marcado) {
    _vincSortLista(_vincFiltrar(_vincListaUnica())).forEach(function(p) {
      estadoVinculos.selecionados[_vincChave(p)] = true;
    });
  }
  _vincAtualizarSelecaoVisual();
}

function vincCancelarSelecao() {
  estadoVinculos.selecionados = {};
  _vincUltimaChaveClicada = null;
  _vincAtualizarSelecaoVisual();
}

function _vincAtualizarSelecao(listaVisivel) {
  var porChave = {};
  listaVisivel.forEach(function(p) { porChave[_vincChave(p)] = p; });
  Object.keys(estadoVinculos.selecionados).forEach(function(k) { if (!porChave[k]) delete estadoVinculos.selecionados[k]; });
  var chaves = Object.keys(estadoVinculos.selecionados), n = chaves.length;
  var selecionados = chaves.map(function(k) { return porChave[k]; });
  var f = document.getElementById('vinc-filtros'), s = document.getElementById('vinc-filtros-selecao');
  if (f) f.classList.toggle('hidden', n > 0);
  if (s) s.classList.toggle('hidden', n === 0);
  var t = document.getElementById('vinc-selecao-texto'); if (t) t.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  var barra = document.getElementById('vinc-selecao-acoes');
  if (barra) barra.innerHTML = _vincAcoesLoteHTML(selecionados);
  var all = document.getElementById('chk-select-all-vinc');
  if (all) { all.checked = listaVisivel.length > 0 && n === listaVisivel.length; all.indeterminate = n > 0 && n < listaVisivel.length; }
  uiPaginaMedir(document.getElementById('page-plano-detalhe'));
}

// Ações da barra de seleção: só aparecem as que TODOS os itens selecionados aceitam (as "unico" só com 1 item).

function _vincAcoesLoteHTML(selecionados) {
  var n = selecionados.length;
  var podeEditar = !!(_vincCtx && _vincCtx.permissoes && _vincCtx.permissoes.vincular);
  if (!n) return '';
  return _VINC_ACOES.filter(function(a) {
    return (!a.unico || n === 1) && (!a.edita || podeEditar) && selecionados.every(a.ok);
  }).map(function(a) {
    return '<button type="button" class="ds-icon-action" data-on-click="vinc.37" data-aclick0="' + a.id + '" data-title="' + escapeHtml(a.rot) + '" aria-label="' + escapeHtml(a.rot) + '"'
      + (a.perigo ? ' style="color:var(--ds-color-danger-fg)"' : '') + '><span class="material-symbols-outlined">' + a.ico + '</span></button>';
  }).join('');
}

function _vincSelecionadosLista() {
  return _vincListaUnica().filter(function(p) { return estadoVinculos.selecionados[_vincChave(p)]; });
}

// chamada de servidor de cada ação, por item (decidir/aguardando variam conforme a direção do pedido)

function abrirMenuVinculosMais(ev) {
  var podeEditar = !!(_vincCtx && _vincCtx.permissoes && _vincCtx.permissoes.vincular);
  var itens = [
    { icone: 'north', rotulo: 'Vincular a um plano superior', descricao: 'Adicionar mais um plano superior ao qual este plano contribui',
      onclick: "abrirModalVincularPlano('superior')", oculto: !podeEditar },
    { icone: 'south', rotulo: 'Propor plano subordinado', descricao: 'Convidar outro plano a se subordinar a este',
      onclick: "abrirModalVincularPlano('subordinado')", oculto: !podeEditar },
    { icone: 'download', rotulo: 'Exportar vínculos', descricao: 'Baixar os vínculos do plano (CSV)', onclick: 'exportarVinculosCSV()' }
  ].filter(function(i) { return !i.oculto; });
  if (typeof _acoesLinhaNormalizar === 'function') itens = itens.map(_acoesLinhaNormalizar);
  if (typeof _acoesLinhaReg !== 'undefined') _acoesLinhaReg['vinculos-mais'] = { menu: itens, todos: itens };
  if (typeof acoesLinhaMenu === 'function') acoesLinhaMenu('vinculos-mais', ev);
}

function exportarVinculosCSV() {
  var idPlano = _vincCtx && _vincCtx.idPlano;
  if (!idPlano) return showMessage('error', 'Erro', 'Nenhum plano carregado.');
  var d = _vincDados();
  var direcaoLabel = { superior: 'Subordinante', filho: 'Subordinado (pendente)', proposta_enviada: 'Proposta enviada', proposta_recebida: 'Proposta recebida' };
  var todos = []
    .concat(d.superAprov.map(function(p) { return Object.assign({ direcaoLabel: 'Subordinante' }, p); }))
    .concat(d.subAprov.map(function(p) { return Object.assign({ direcaoLabel: 'Subordinado' }, p); }))
    .concat(d.pendentes.map(function(p) { return Object.assign({ direcaoLabel: direcaoLabel[p.direcao] || 'Pendente' }, p); }))
    .concat(d.desvinculados.map(function(p) { return Object.assign({ direcaoLabel: 'Desvinculado' }, p); }));
  var cab = ['Direcao', 'Tipo', 'Nome', 'Vigencia', 'Responsavel', 'Status', 'Progresso'];
  var fnCell = typeof _csvCell === 'function' ? _csvCell : function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; };
  var linhas = [cab.map(fnCell).join(',')];
  todos.forEach(function(p) {
    var vigencia = p.anoInicio && p.anoFim ? p.anoInicio + '-' + p.anoFim : (p.anoInicio || p.anoFim || '');
    var prog = (p.progresso == null || isNaN(Number(p.progresso))) ? '' : (Math.round(p.progresso) + '%');
    linhas.push([p.direcaoLabel, p.tipo || '', p.nome || '', vigencia, p.responsavel || '', p.status || '', prog].map(fnCell).join(','));
  });
  var nomePlano = (_vincCtx && _vincCtx.plano && _vincCtx.plano.nome) || 'plano';
  var nomeLimpo = nomePlano.replace(/[^\wÀ-ɏ]/g, '_');
  if (typeof _downloadCSV === 'function') {
    _downloadCSV(linhas.join('\n'), 'vinculos_' + nomeLimpo + '.csv');
  }
}

// ================================================================
// MODAL VINCULAR PLANO (PORTAL)
// ================================================================

function _vpListaAtiva() {
  return estadoVincModal.aba === 'superior' ? estadoVincModal.candidatosSuperior : estadoVincModal.candidatosSubordinado;
}

function vpPopularFiltroResp() {
  var todosResp = [];
  _vpListaAtiva().forEach(function(p) {
    if (p.responsavel && todosResp.indexOf(p.responsavel) === -1) todosResp.push(p.responsavel);
  });
  todosResp.sort();
  var sel = document.getElementById('vp-filtro-resp');
  if (!sel) return;
  var atual = sel.value;
  sel.innerHTML = '<option value="">Todos os responsáveis</option>'
    + todosResp.map(function(r) { return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + '</option>'; }).join('');
  if (todosResp.indexOf(atual) > -1) sel.value = atual;
  else estadoVincModal.filtroResp = '';
}

function vpAplicarFiltros() {
  estadoVincModal.busca = (document.getElementById('vp-filtro-busca') || {}).value || '';
  estadoVincModal.filtroResp = (document.getElementById('vp-filtro-resp') || {}).value || '';
  estadoVincModal.paginaAtual = 1;
  var bc = document.getElementById('vp-btn-clear'); if (bc) bc.style.display = estadoVincModal.busca ? 'flex' : 'none';
  vpRenderLista();
}

function vpLimparFiltroBusca() {
  estadoVincModal.busca = '';
  var fb = document.getElementById('vp-filtro-busca'); if (fb) fb.value = '';
  vpAplicarFiltros();
}

function vpMudarPagina(dir) {
  var total = _vpFiltrar(_vpListaAtiva()).length;
  var totalPags = Math.max(1, Math.ceil(total / estadoVincModal.itensPorPagina));
  if (dir === 'prev' && estadoVincModal.paginaAtual > 1) estadoVincModal.paginaAtual--;
  if (dir === 'next' && estadoVincModal.paginaAtual < totalPags) estadoVincModal.paginaAtual++;
  vpRenderLista();
}

function vpIrParaPagina(pg) {
  estadoVincModal.paginaAtual = parseInt(pg, 10) || 1;
  vpRenderLista();
}

function _vpFiltrar(lista) {
  var busca = estadoVincModal.busca.toLowerCase();
  var fResp = estadoVincModal.filtroResp;
  return lista.filter(function(p) {
    if (busca && String(p.nome || '').toLowerCase().indexOf(busca) === -1) return false;
    if (fResp && p.responsavel !== fResp) return false;
    return true;
  });
}

function vpRenderLista() {
  var tbody = document.getElementById('vp-tbody');
  var pag = document.getElementById('vp-pagination');
  if (!tbody || !pag) return;

  var listaCompleta = _vpFiltrar(_vpListaAtiva());
  var total = listaCompleta.length;
  var itensPag = estadoVincModal.itensPorPagina;
  var totalPags = Math.max(1, Math.ceil(total / itensPag));
  if (estadoVincModal.paginaAtual > totalPags) estadoVincModal.paginaAtual = totalPags;
  var start = (estadoVincModal.paginaAtual - 1) * itensPag;
  var lista = listaCompleta.slice(start, start + itensPag);

  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px 12px;color:var(--ds-color-text-muted);font-size:0.85rem">'
      + 'Nenhum plano ' + (estadoVincModal.aba === 'superior' ? 'disponível como superior' : 'disponível para se tornar subordinado') + '.</td></tr>';
    pag.classList.add('hidden');
    return;
  }

  tbody.innerHTML = lista.map(function(p) {
    var idj = escapeHtml(String(p.id));
    var nomeJs = escapeJsAttr(p.nome);
    var vigencia = p.anoInicio && p.anoFim ? p.anoInicio + '–' + p.anoFim : (p.anoInicio || p.anoFim || '—');
    var acao = estadoVincModal.aba === 'superior'
      ? '<button class="btn btn-primary btn-sm" data-on-click="vinc.39" data-aclick0="' + idj + '" data-aclick1="' + nomeJs + '">Vincular</button>'
      : '<button class="btn btn-outline btn-sm" data-on-click="vinc.40" data-aclick0="' + idj + '" data-aclick1="' + nomeJs + '">Solicitar Vínculo</button>';
    return '<tr>'
      + '<td>' + escapeHtml(p.tipo || '—') + '</td>'
      + '<td>' + escapeHtml(p.nome) + '</td>'
      + '<td>' + vigencia + '</td>'
      + '<td>' + escapeHtml(p.responsavel || '—') + '</td>'
      + '<td>' + _vincBadgeStatus(p.status) + '</td>'
      + '<td style="text-align:right">' + acao + '</td>'
      + '</tr>';
  }).join('');

  pag.classList.remove('hidden');
  var fim = Math.min(start + itensPag, total);
  var cnt = document.getElementById('vp-pag-counter');
  if (cnt) cnt.textContent = (total === 0 ? '0' : (start + 1) + '–' + fim) + ' de ' + total;
  var sel = document.getElementById('vp-pag-selector');
  if (sel) {
    sel.innerHTML = '';
    for (var i = 1; i <= totalPags; i++) {
      var opt = document.createElement('option');
      opt.value = i; opt.text = i;
      if (i === estadoVincModal.paginaAtual) opt.selected = true;
      sel.appendChild(opt);
    }
  }
  var btnPrev = pag.querySelector('.btn-pag[data-on-click="vinc.8"], .btn-pag[data-on-click="vinc.30"]');
  var btnNext = pag.querySelector('.btn-pag[data-on-click="vinc.10"], .btn-pag[data-on-click="vinc.32"]');
  if (btnPrev) btnPrev.disabled = (estadoVincModal.paginaAtual === 1);
  if (btnNext) btnNext.disabled = (estadoVincModal.paginaAtual >= totalPags);
}

// app_vinculos_modais — modais e wizards (abrir, validar, salvar)

function fecharModalVincularPlano() {
  var modal = document.getElementById('modal-vincular-plano');
  if (modal) modal.classList.add('hidden');
  if (typeof desbloquearFundo === 'function') desbloquearFundo();
}

// app_vinculos_eventos — registro das ações delegadas (uiRegistrarAcoes)
uiRegistrarAcoes('vinc', {
  '1': function (event) { if(event.target===this) fecharModalVincularPlano(); },
  '2': function (event) { fecharModalVincularPlano(); },
  '3': function (event) { vpMudarAba('superior'); },
  '4': function (event) { vpMudarAba('subordinado'); },
  '5': function (event) { vpAplicarFiltros(); },
  '6': function (event) { vpLimparFiltroBusca(); },
  '7': function (event) { vpAplicarFiltros(); },
  '8': function (event) { vpMudarPagina('prev'); },
  '9': function (event) { vpIrParaPagina(this.value); },
  '10': function (event) { vpMudarPagina('next'); },
  '11': function (event) { vincAbrirBusca(); },
  '12': function (event) { aplicarFiltrosVinculos(); },
  '13': function (event) { vincLimparBusca(); },
  '14': function (event) { vincAbrirFiltro(uiArgJs(this.dataset.aclick0), event); },
  '15': function (event) { vincLimparUmFiltro(uiArgJs(this.dataset.aclick0)); },
  '16': function (event) { limparFiltrosVinculos(); },
  '17': function (event) { abrirModalVincularPlano(); },
  '18': function (event) { abrirMenuVinculosMais(event); },
  '19': function (event) { vincCancelarSelecao(); },
  '20': function (event) { vincToggleSelecionarTodos(this.checked); },
  '21': function (event) { vincOrdenarPorColuna('tipo'); },
  '22': function (event) { vincOrdenarPorColuna('nome'); },
  '23': function (event) { vincOrdenarPorColuna('responsavel'); },
  '24': function (event) { vincOrdenarPorColuna('status'); },
  '25': function (event) { vincOrdenarPorColuna('progresso'); },
  '26': function (event) { atualizarAbaVinculos(); },
  '27': function (event) { exportarVinculosCSV(); },
  '28': function (event) { vincAbrirMenuOrdenar(event); },
  '29': function (event) { vincMudarTamanho(this.value); },
  '30': function (event) { vincMudarPagina('prev'); },
  '31': function (event) { vincIrParaPagina(this.value); },
  '32': function (event) { vincMudarPagina('next'); },
  '33': function (event) { vincCliqueLinha(event, uiArgJs(this.dataset.aclick0)); },
  '34': function (event) { event.stopPropagation(); },
  '35': function (event) { vincToggleSelecao(uiArgJs(this.dataset.achange0), this.checked); },
  '36': function (event) { event.stopPropagation(); vincOrfToggle(uiArgJs(this.dataset.aclick0)); },
  '37': function (event) { vincAcaoLote(uiArgJs(this.dataset.aclick0)); },
  '38': function (event) { carregarDetalhesPlano(uiArgJs(this.dataset.aclick0)); },
  '39': function (event) { vpVincularSuperior(uiArgJs(this.dataset.aclick0),uiArgJs(this.dataset.aclick1)); },
  '40': function (event) { vpSolicitarSubordinado(uiArgJs(this.dataset.aclick0),uiArgJs(this.dataset.aclick1)); }
});


</script>
